/* ============================================================
   ROUTING — real history. Back button works, tier persists,
   scroll is restored, and detours leave a breadcrumb.
   ============================================================ */
let CURRENT = null, CURRENT_TIER = "brief";

// session-only: remembers scroll per work-per-tier. Reset on fresh taps, not persisted.
const SCROLLMEM = {};
const isViewSlug = s => s === "home" || s === "timeline";
const memKey = (slug, tier) => slug + ":" + tier;
function rememberScroll(){
  if (CURRENT && !isViewSlug(CURRENT)) SCROLLMEM[memKey(CURRENT, CURRENT_TIER)] = window.scrollY;
}
function recallScroll(slug, tier){ return SCROLLMEM[memKey(slug, tier)] || 0; }

// does pushState actually work in this frame?
const HAS_HISTORY = (() => {
  try { history.replaceState({__t:1}, "", location.hash || "#/home");
        return !!(history.state && history.state.__t === 1); }
  catch(e){ return false; }
})();
try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch(e){}

const LABEL = s => s === "home" ? "The Threads"
                 : s === "timeline" ? "The Timeline"
                 : (WORKS[s] ? WORKS[s].title : "");

function saveState(){
  if (!CURRENT) return;
  const prev = (HAS_HISTORY && history.state) || {};
  try {
    history.replaceState({slug:CURRENT, tier:CURRENT_TIER, scroll:window.scrollY, from:prev.from},
                         "", "#/" + CURRENT);
  } catch(e){}
  persist();
}

function navigate(slug, opts){
  opts = opts || {};
  if (!WORKS[slug] && slug !== "home" && slug !== "timeline") slug = "home";
  rememberScroll();           // snapshot where we're leaving
  saveState();
  const tier = opts.tier || "brief";
  // a fresh, deliberate tap starts the destination clean (top of page, cleared tier memory)
  if (!opts.resume){
    delete SCROLLMEM[memKey(slug, "brief")];
    delete SCROLLMEM[memKey(slug, "deep")];
  }
  const st = {slug, tier, scroll:0,
              from: (opts.from !== undefined ? opts.from : CURRENT)};
  try { history.pushState(st, "", "#/" + slug); } catch(e){}
  render(slug, st);
}

function setTier(t){
  document.querySelectorAll(".tier").forEach(b =>
    b.setAttribute("aria-selected", b.dataset.pane === t));
  const pb = $("#pane-brief"), pd = $("#pane-deep");
  if (pb) pb.hidden = t !== "brief";
  if (pd) pd.hidden = t !== "deep";
  document.querySelectorAll(".secnav").forEach(nv => { nv.hidden = nv.dataset.for !== t; });
  CURRENT_TIER = t;
}

function syncRail(){
  const cur = $("#seq").querySelector('[aria-current="page"]');
  if (!cur) return;
  const r = rail.getBoundingClientRect(), c = cur.getBoundingClientRect();
  if (c.top < r.top + 40 || c.bottom > r.bottom - 20)
    rail.scrollTop += (c.top - r.top) - r.height / 2 + c.height / 2;
}

function backBar(from, slug){
  if (!from || from === slug || !LABEL(from)) return "";
  return `<div class="col backbar">
    <button class="backto" data-back data-to="${from}">← ${LABEL(from)}</button></div>`;
}

function render(slug, st){
  try { renderInner(slug, st); }
  catch (err){
    console.error("render failed", err);
    $("#view").innerHTML =
      `<div class="col" style="padding-top:64px">
         <h1 class="title" style="font-size:34px">Something broke.</h1>
         <p class="lede" style="margin-top:18px">This page failed to render.
            Nothing was lost — it is all still in the file.</p>
         <p style="margin-top:14px"><button class="backto" data-back data-to="home">← The Threads</button></p>
       </div>`;
  }
}

function renderInner(slug, st){
  st = st || {};
  slug = slug || "home";
  if (!WORKS[slug] && slug !== "home" && slug !== "timeline") slug = "home";
  CURRENT = slug;
  CURRENT_TIER = st.tier || "brief";

  const isView = (slug === "home" || slug === "timeline");
  $("#seq").innerHTML = railHTML(slug);

  if (isView){
    const isTl = slug === "timeline";
    $("#view").innerHTML = isTl ? timelineHTML() : homeHTML();
    $("#crumb").textContent = isTl ? "The Timeline" : "The Threads";
    document.title = "The Long Argument — " + (isTl ? "The Timeline" : "The Threads");
  } else {
    const w = WORKS[slug];
    $("#view").innerHTML = backBar(st.from, slug) + workHTML(w);
    $("#crumb").textContent = w.author;
    document.title = `The Long Argument — ${w.title}`;
    document.querySelectorAll(".tier").forEach(btn => {
      btn.onclick = () => {
        if (btn.dataset.pane === CURRENT_TIER) return;
        SCROLLMEM[memKey(CURRENT, CURRENT_TIER)] = window.scrollY;   // save the tier we're leaving
        setTier(btn.dataset.pane);
        const y = recallScroll(CURRENT, CURRENT_TIER);              // restore the tier we're entering
        requestAnimationFrame(() => window.scrollTo(0, y));
        saveState();
      };
    });
    setTier(CURRENT_TIER);
    enrich($("#pane-brief"), slug);
    enrich($("#pane-deep").querySelector('section[data-sec="context"]'), slug);
  }

  if (rail.classList.contains("open")) toggle();
  if (typeof hideGloss === "function") hideGloss();
  syncRail();
  const y = st.scroll || 0;
  requestAnimationFrame(() => { window.scrollTo(0, y); persist(); tickProgress(); measureHeader(); });
}

/* ---- preferences: theme + text size, remembered ---- */
const root = document.documentElement;
const PREFS_KEY = "prefs:ui";
let PREFS = {theme: root.dataset.theme || "dark", fs: 1};
try { PREFS = Object.assign(PREFS, JSON.parse(localStorage.getItem(PREFS_KEY) || "{}")); } catch(e){}

function applyPrefs(){
  root.dataset.theme = PREFS.theme;
  root.style.setProperty("--fs", PREFS.fs);
  $("#fsdn").disabled = PREFS.fs <= 0.85;
  $("#fsup").disabled = PREFS.fs >= 1.35;
}
function savePrefs(){
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS)); } catch(e){}
  if (STORE && STORE.kind === "artifact") STORE.set(PREFS_KEY, JSON.stringify(PREFS));
}
$("#theme").onclick = e => { e.stopPropagation();
  PREFS.theme = PREFS.theme === "dark" ? "light" : "dark"; applyPrefs(); savePrefs(); };
$("#fsup").onclick  = e => { e.stopPropagation();
  PREFS.fs = Math.min(1.35, +(PREFS.fs + 0.075).toFixed(3)); applyPrefs(); savePrefs(); };
$("#fsdn").onclick  = e => { e.stopPropagation();
  PREFS.fs = Math.max(0.85, +(PREFS.fs - 0.075).toFixed(3)); applyPrefs(); savePrefs(); };
applyPrefs();

/* ---- reading progress: orientation, not a scoreboard ---- */
const prog = $("#prog");
function tickProgress(){
  const h = document.documentElement.scrollHeight - window.innerHeight;
  prog.style.width = (h > 40 ? Math.min(100, (window.scrollY / h) * 100) : 0) + "%";
}
window.addEventListener("scroll", tickProgress, {passive:true});
window.addEventListener("resize", tickProgress);

/* ---- measure the header so the tier bar docks exactly beneath it ---- */
function measureHeader(){
  const h = $(".top").offsetHeight;
  if (h) root.style.setProperty("--hdr", h + "px");
  const nb = document.querySelector(".navbar");
  root.style.setProperty("--stick", (h + (nb ? nb.offsetHeight : 0) + 12) + "px");
}
window.addEventListener("resize", measureHeader);
measureHeader();

/* ---- tap the header to return to the top ---- */
$(".top").addEventListener("click", e => {
  if (e.target.closest("button")) return;
  window.scrollTo({top:0, behavior:"smooth"});
});

const rail = $("#rail"), scrim = $("#scrim");
const toggle = () => { rail.classList.toggle("open"); scrim.classList.toggle("open"); };
$("#menu").onclick = toggle;
scrim.onclick = toggle;




/* ============================================================
   CANONICAL GLOSSARY — one entry per figure, referenced everywhere.
   Kills the "four different Agamemnons" problem: a work says {ref:"agamemnon"},
   optionally adding a one-line role for THAT work via `here`.
   gk/rom render as "Athena (Minerva)" with a Greek/Roman marker.
   ============================================================ */
const GLOSSARY = {
  // — Olympians (Greek primary, Roman secondary) —
  "zeus":{name:"Zeus",equiv:"Jupiter",side:"rom",home:"iliad",v:"King of the gods. Holds the scales of fate and tilts events this way and that — officially above the quarrel, privately managing it, and bound even so by a destiny he did not write."},
  "hera":{name:"Hera",equiv:"Juno",side:"rom",home:"iliad",v:"Queen of the gods and wife of Zeus. Nurses a personal fury against Troy (she lost the divine beauty contest that started the war) and schemes tirelessly for its destruction."},
  "athena":{name:"Athena",equiv:"Minerva",side:"rom",home:"iliad",v:"Goddess of wisdom, strategy and war-craft — born fully armed from Zeus's head. Champion of clever heroes: she fights for the Greeks at Troy and is Odysseus's patron and protector."},
  "apollo":{name:"Apollo",home:"iliad",v:"God of prophecy, plague, music and archery — one of the few who keeps his name in both Greek and Roman myth. Fights for Troy; opens the Iliad by raining plague on the Greek camp."},
  "aphrodite":{name:"Aphrodite",equiv:"Venus",side:"rom",home:"iliad",v:"Goddess of love and desire. Triggered the Trojan War by promising Helen to Paris, and shields the Trojans in battle. Mother of Aeneas, the hero of Rome's founding epic.",to:"aeneid"},
  "poseidon":{name:"Poseidon",equiv:"Neptune",side:"rom",home:"odyssey",v:"God of the sea and earthquakes. Odysseus blinded his son the Cyclops, so he spends the Odyssey wrecking ships and drowning crews — the reason a short voyage home takes ten years."},
  "hermes":{name:"Hermes",equiv:"Mercury",side:"rom",home:"odyssey",v:"The messenger god — quick, cunning, patron of travellers, thieves and traders. The gods' errand-runner, and twice a rescuer of Odysseus."},
  "hades":{name:"Hades",equiv:"Pluto",side:"rom",home:"odyssey",v:"God of the dead and ruler of the underworld, which also bears his name. Not evil — simply the lord of what waits below."},
  "ares":{name:"Ares",equiv:"Mars",side:"rom",home:"iliad",v:"God of war in its raw, bloody, chaotic form — as distinct from Athena's disciplined generalship. Even the other gods find him distasteful."},
  "artemis":{name:"Artemis",equiv:"Diana",side:"rom",home:"iliad",v:"Goddess of the hunt, the wild, and the moon; Apollo's twin. Fierce, virgin, and quick to punish. It was her the Greek fleet had to appease with a human sacrifice before sailing to Troy.",to:"oresteia"},
  "cronus":{name:"Cronus",equiv:"Saturn",side:"rom",home:"iliad",v:"A Titan, father of Zeus, whom Zeus overthrew. The old order of gods, displaced by the Olympians."},

  // — recurring mortals & heroes —
  "jocasta":{name:"Jocasta",home:"oedipus-rex",v:"Queen of Thebes — widow of King Laius, then wife of Oedipus, and (unknown to them both) his mother. She works out the incest one scene before he does, and hangs herself rather than say it aloud. Mother of Antigone."},
  "antigone":{name:"Antigone",home:"antigone",v:"Daughter — and, through the incest, half-sister — of Oedipus. Absolute, fearless, and half in love with her own death. She buries her outcast brother against the king's decree and is walled up alive for it. She inherits her father's one fatal trait: the refusal to stop.",to:"oedipus-rex"},
  "apollo-god":{name:"Apollo",home:"oresteia",v:"God of prophecy, and the Oresteia's problem. He personally orders Orestes to kill his mother, then defends him at the trial with an argument even the gods find thin. The oracle at Delphi is his."},
  "the-furies":{name:"The Furies (Erinyes)",home:"oresteia",v:"Ancient goddesses of blood-vengeance, older than the Olympian gods — they hunt those who kill their own kin. Black, relentless, dripping. They pursue Orestes for his mother's murder, and are only pacified at the end by being given an honoured home beneath Athens.",to:"antigone"},
  "the-oracle":{name:"prophecy / the oracle",home:"oedipus-rex",v:"A divine prediction, usually from Delphi, that always comes true and is never a help. Greek tragedy runs on the gap between knowing the prophecy and being unable to escape it — the effort to avoid it is what fulfils it."},
  "augustus":{name:"Augustus",home:"aeneid",v:"Rome's first emperor (63 BC–AD 14), who ended a century of civil war and founded the imperial system. Patron of Virgil and of Ovid — he commissioned the glory the Aeneid supplies, and later exiled Ovid to the Black Sea. The Roman peace and the Roman censorship wear the same face.",to:"ovid"},
  "creon":{name:"Creon",home:"oedipus-rex",v:"Brother of Jocasta, and a careful, unambitious man who keeps ending up in charge of Thebes. Reasonable when the crown sits lightly on him; rigid and ruinous once it is his own. He is the pivot between the two Theban plays — vindicated in one, destroyed in the other.",to:"antigone"},
  "thebes":{name:"Thebes",home:"oedipus-rex",v:"The cursed city of the Oedipus family, ruling seat of central Greece in myth. Plague-struck under Oedipus, war-torn after his sons kill each other, and never at peace for long. Not to be confused with Thebes in Egypt.",to:"antigone"},
  "delphi":{name:"Delphi",home:"oedipus-rex",v:"The most important oracle in the Greek world, sacred to Apollo. Kings and heroes travel there for the god's guidance and come back with prophecies that are always true and never a comfort. Its motto: 'know thyself.'"},
  "socrates":{name:"Socrates",home:"republic",v:"The Athenian philosopher (469–399 BC) who wrote nothing himself and appears as the questioning voice in Plato's dialogues. He claimed to know only that he knew nothing, and was executed by Athens for 'corrupting the young.' The founding figure of Western philosophy.",to:"nicomachean-ethics"},
  "carthage":{name:"Carthage",home:"aeneid",v:"The great North African city, Rome's future deadly rival, ruled in the Aeneid by Queen Dido. Aeneas's abandonment of her plants the mythic seed of the real wars in which Rome would one day raze Carthage to the ground.",to:"confessions"},
  "eden":{name:"Eden",home:"paradise-lost",v:"The garden of the Bible's opening — humanity's first home, and the paradise lost when Adam and Eve eat the forbidden fruit. Milton's last two lines are the image of them walking out of it, hand in hand, into the ordinary world.",to:"bible"},
  "xenia":{name:"xenia",home:"odyssey",v:"Guest-friendship: the sacred Greek duty of a host to shelter and feed a stranger, and of the guest not to abuse it. The gods enforce it personally. Break it — as the Cyclops does by eating guests, or the suitors by looting their host — and catastrophe follows.",to:"iliad"},
  "grace":{name:"grace",home:"confessions",v:"In Christian thought, rescue you did not earn and cannot earn — help freely given by God rather than won by effort. It is the exact hinge on which Augustine breaks with the Greek philosophers: Aristotle says you build yourself by practice; Augustine says the will is broken and only grace can mend it.",to:"nicomachean-ethics"},
  "agamemnon":{gk:"Agamemnon",home:"iliad",v:"Commander-in-chief of the Greek army at Troy and king of Mycenae, the most powerful city in Greece. Proud and grasping — the quarrel that opens the Iliad is his fault. He comes home from the war only to be murdered in his bath by his wife and her lover, the crime that sets the Oresteia in motion.",to:"oresteia"},
  "achilles":{gk:"Achilles",home:"iliad",v:"The greatest warrior of the Greek army, and its most dangerous man. Half-divine, doomed young, and monstrous in his pride and grief — the Iliad is, in its first word, the poem of his rage. In the underworld he tells Odysseus he would rather be a living slave than king of all the dead.",to:"odyssey"},
  "odysseus":{gk:"Odysseus",rom:"Ulysses",home:"odyssey",v:"The cunning Greek — soldier, liar, strategist, survivor. At Troy his mind wins the war (the wooden horse is his idea); in his own epic his mind gets him home across ten years of sea. The Romans called him Ulysses.",to:"iliad"},
  "helen":{gk:"Helen",home:"iliad",v:"'The face that launched a thousand ships.' Wife of the Spartan king Menelaus, carried off to Troy by Paris — the act that starts the war. Homer treats her not as a prize but as a bitter, self-aware woman ashamed of the ruin around her."},
  "tiresias":{gk:"Tiresias",home:"oedipus-rex",v:"The blind prophet of Thebes who appears across Greek myth — always right, rarely believed. Ovid explains the blindness: he had lived seven years as a woman, and when the gods asked him to settle which sex enjoys love more, his answer cost him his sight and won him prophecy.",to:"ovid"},
  "menelaus":{gk:"Menelaus",home:"iliad",v:"King of Sparta and Helen's abandoned husband; brother of Agamemnon. The war is nominally fought to win her back for him."},
  "paris":{gk:"Paris",home:"iliad",v:"Trojan prince, brother of Hector, who ran off with Helen and caused the war — then largely avoids the fighting. He fights with a bow rather than a spear: Homer's shorthand for a lesser sort of warrior."},

  // — poets who recur as figures —
  "homer":{gk:"Homer",home:"iliad",v:"The name attached to the Iliad and the Odyssey — whether one poet, many, or a whole oral tradition is the oldest question in literary scholarship. Every later epic in the West measures itself against him.",to:"odyssey"},
  "virgil":{gk:"Virgil",home:"aeneid",v:"Rome's national poet, author of the Aeneid. Fourteen centuries later Dante makes him a character — his guide through Hell and Purgatory — and the noblest damned soul in the poem, shut out of Heaven only for having been born before Christ.",to:"dante"},

  // — Roman-facing entries (the Aeneid uses Roman names; Greek noted where it helps) —
  "jupiter":{name:"Jupiter",equiv:"Zeus",side:"gk",home:"aeneid",v:"King of the gods. In the Aeneid he holds the long view: he reveals to Venus the whole imperial future of Rome, the destiny Aeneas suffers to fulfil."},
  "juno":{name:"Juno",equiv:"Hera",side:"gk",home:"aeneid",v:"Queen of the gods, and the engine of the Aeneid. She hates the Trojans and everything they will become, and spends the poem hurling storms, wars and delays at Aeneas. The epic opens by asking how a goddess can hold a grudge this deep."},
  "venus":{name:"Venus",equiv:"Aphrodite",side:"gk",home:"aeneid",v:"Goddess of love, and Aeneas's own mother. She protects and manoeuvres on his behalf throughout, even engineering his doomed love affair with Dido to keep him safe.",to:"ovid"},
  "neptune":{name:"Neptune",equiv:"Poseidon",side:"gk",home:"aeneid",v:"God of the sea. In the Aeneid, unusually, he calms the storm Juno raises, quieting the waters 'as a statesman quiets a riot' — Virgil's first and most famous simile."},
  "mercury":{name:"Mercury",equiv:"Hermes",side:"gk",home:"aeneid",v:"The messenger god. Jupiter sends him down to Carthage to break the spell of Dido and order Aeneas to leave — the voice of duty interrupting love."},
  "cupid":{name:"Cupid",equiv:"Eros",side:"gk",home:"aeneid",v:"God of desire, and Venus's son. Disguised as Aeneas's little boy, he sits in Dido's lap and kindles the love that will destroy her."},
  "minerva":{name:"Minerva",equiv:"Athena",side:"gk",home:"ovid",v:"Goddess of wisdom and craft. In Ovid she is the weaver who challenges the mortal Arachne, cannot fault the girl's work, and turns her into a spider out of wounded pride.",to:"ovid"},
  "diana":{name:"Diana",equiv:"Artemis",side:"gk",home:"ovid",v:"Goddess of the hunt and the moon. In Ovid, the hunter Actaeon stumbles on her bathing; she turns him into a stag and his own hounds tear him apart."},

/* ============================================================
   SEARCH — index built once from WORKS. Everything is searchable;
   names outrank prose, always.
   ============================================================ */
const _sd = document.createElement("div");
const strip = h => { _sd.innerHTML = String(h); return (_sd.textContent || "").replace(/\s+/g, " ").trim(); };

const TYPES = [
  {id:"all",    label:"All"},
  {id:"person", label:"People"},
  {id:"place",  label:"Places"},
  {id:"term",   label:"Terms"},
  {id:"sticky", label:"Sticky bits"},
  {id:"echo",   label:"Echoes"},
  {id:"work",   label:"Works"},
  {id:"text",   label:"Text"}
];
const PLURAL = {person:"People", place:"Places", term:"Terms", sticky:"Sticky bits",
                echo:"Echoes", work:"Works", text:"In the text"};
const ORDER = ["work","person","sticky","term","place","echo","text"];

const INDEX = [];
Object.entries(WORKS).forEach(([slug, w]) => {
  const base = {slug, file:w.file, work:w.title};
  INDEX.push({...base, type:"work", tier:"brief", sec:"top",
    label:w.title, gloss:strip(w.oneline), body:strip(w.oneline)+" "+w.author});
  (w.sticky||[]).forEach(s => INDEX.push({...base, type:"sticky", tier:"brief", sec:"sticky",
    label:strip(s.h), gloss:strip(s.p), body:strip(s.h)+" "+strip(s.p)}));
  const pushRow = (arr, type, sec) => (w[arr]||[]).forEach(r => {
    if (r.ref) return;
    INDEX.push({...base, type, tier:"deep", sec,
      label:strip(r.k), gloss:strip(r.v), body:strip(r.k)+" "+strip(r.v)});
  });
  pushRow("people","person","people");
  pushRow("places","place","places");
  pushRow("terms","term","terms");
  (w.echoes||[]).forEach(r => INDEX.push({...base, type:"echo", tier:"deep", sec:"echoes",
    label:strip(r.k), gloss:strip(r.v), body:strip(r.k)+" "+strip(r.v)}));
  const prose = [
    ["spine", w.spineLabel, w.spine, "brief"],
    ["why", "Why anyone cares", w.why, "brief"],
    ["idea", "The one idea", w.idea, "brief"],
    ["wrong", "What people get wrong", (w.wrong||[]).map(x=>x.b+" "+x.p).join(" "), "brief"],
    ["take", "A take / the counter-take", (w.take||"")+" "+(w.counter||""), "brief"],
    ["context", "The room it was written in", w.context, "deep"]
  ];
  prose.forEach(([sec, label, html, tier]) => INDEX.push({
    ...base, type:"text", tier, sec, label, gloss:"", body:strip(html)
  }));
});

// canonical figures: one search entry each, pointing at their home work
Object.values(GLOSSARY).forEach(g => {
  const home = WORKS[g.home] || {};
  const name = g.name || g.gk;
  const eq = g.equiv || g.rom || "";
  const label = eq && eq !== name ? `${name} (${eq})` : name;
  INDEX.push({
    slug: g.home, file: home.file || "", work: home.title || "",
    type:"person", tier:"deep", sec:"people",
    label, gloss: strip(g.v), body: `${name} ${eq} ${strip(g.v)}`
  });
});

let FILTER = "all";

function snippet(body, q){
  const i = body.toLowerCase().indexOf(q);
  if (i < 0) return body.slice(0, 130) + "…";
  const s = Math.max(0, i - 55);
  return (s > 0 ? "…" : "") + body.slice(s, i + q.length + 90) + "…";
}
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hl(text, q){
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i, i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
}

function score(e, q){
  const l = e.label.toLowerCase(), b = e.body.toLowerCase();
  let s = 0;
  if (l === q) s = 120;
  else if (l.startsWith(q)) s = 100;
  else if (l.includes(q)) s = 70;
  else if (b.includes(q)) s = 20;
  else return 0;
  if (e.type !== "text") s += 12;          // names outrank prose, always
  if (e.type === "work") s += 6;
  return s;
}

function runSearch(){
  const q = $("#q").value.trim().toLowerCase();
  const box = $("#hits");

  if (!q){                                  // empty state = the full index
    const groups = ORDER.filter(t => t !== "text");
    box.innerHTML = `<p class="count">${INDEX.filter(e=>e.type!=="text").length} entries</p>` +
      groups.filter(t => FILTER === "all" || FILTER === t).map(t => {
        const items = INDEX.filter(e => e.type === t)
          .sort((a,b) => a.label.localeCompare(b.label));
        if (!items.length) return "";
        return `<div class="grp"><h3>${PLURAL[t]} · ${items.length}</h3>
          ${items.map(e => hitHTML(e, "")).join("")}</div>`;
      }).join("");
    return;
  }

  let res = INDEX.map(e => ({e, s: score(e, q)})).filter(x => x.s > 0);
  if (FILTER !== "all") res = res.filter(x => x.e.type === FILTER);
  res.sort((a,b) => b.s - a.s || a.e.label.localeCompare(b.e.label));

  if (!res.length){ box.innerHTML = `<p class="empty">Nothing for “${esc(q)}”.</p>`; return; }

  const byType = {};
  res.forEach(x => (byType[x.e.type] = byType[x.e.type] || []).push(x.e));
  box.innerHTML = `<p class="count">${res.length} result${res.length>1?"s":""}</p>` +
    ORDER.filter(t => byType[t]).map(t =>
      `<div class="grp"><h3>${PLURAL[t]} · ${byType[t].length}</h3>
        ${byType[t].map(e => hitHTML(e, q)).join("")}</div>`).join("");
}

function hitHTML(e, q){
  const gloss = e.type === "text" ? snippet(e.body, q) : e.gloss;
  return `<a class="hit" role="link" tabindex="0" data-go="${e.slug}" data-tier="${e.tier}" data-sec="${e.sec}"
             data-label="${esc(e.label).replace(/"/g,"&quot;")}">
    <span class="h1"><span class="nm">${hl(e.label, q)}</span>
      <span class="src">${esc(e.work)}</span></span>
    ${pron(e.label) ? `<span class="pron">${esc(pron(e.label))}</span>` : ""}
    <span class="gl">${hl(gloss, q)}</span></a>`;
}

/* --- navigate to a hit: right file, right tier, right section, flash it --- */
function goTo(slug, tier, sec, label){
  closeSheet();
  navigate(slug, {tier, from: CURRENT});
  requestAnimationFrame(() => {
    const target = document.querySelector(`section[data-sec="${sec}"]`);
    if (!target) return;
    let el = target;
    if (label){
      const cands = target.querySelectorAll("li, .bit, p");
      for (const c of cands){
        if (c.textContent.trim().toLowerCase().startsWith(label.toLowerCase())) { el = c; break; }
      }
    }
    el.scrollIntoView({behavior:"smooth", block:"center"});
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  });
}


/* ============================================================
   ENRICHMENT — the prose already knows what every name means.
   Tap a name, get its line. Never leave the paragraph.
   ============================================================ */

// Work titles safe to auto-link. Deliberately EXCLUDES "Ulysses":
// in Dante and Homer it means Odysseus, not Joyce's novel, and linking
// it would be confidently wrong — the exact failure this app was audited for.
const WORKLINKS = [
  ["The Brothers Karamazov","karamazov"], ["the Brothers Karamazov","karamazov"],
  ["Nicomachean Ethics","nicomachean-ethics"], ["Pride and Prejudice","pride-prejudice"],
  ["the Divine Comedy","dante"], ["Paradise Lost","paradise-lost"],
  ["War and Peace","war-and-peace"], ["the Metamorphoses","ovid"],
  ["the Confessions","confessions"], ["the Oresteia","oresteia"],
  ["the Republic","republic"], ["Don Quixote","quixote"],
  ["Oedipus Rex","oedipus-rex"], ["King Lear","lear"],
  ["Moby-Dick","moby-dick"], ["the Aeneid","aeneid"],
  ["the Odyssey","odyssey"], ["the Iliad","iliad"],
  ["Antigone","antigone"], ["Hamlet","hamlet"], ["Faust","faust"]
].sort((a,b) => b[0].length - a[0].length);

// terms too generic or too short to gloss without creating noise
const NOGLOSS = new Set(["grace","rome","the fool","care (sorge)","the ships","the crossroads"]);

const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function glossary(slug){
  const w = WORKS[slug], out = [], seen = new Set();
  const add = (label, gloss, sec) => {
    label = strip(label);
    const key = label.toLowerCase();
    if (label.length < 4 || seen.has(key) || NOGLOSS.has(key)) return;
    if (/[(),]/.test(label) && label.split(" ").length > 3) return;
    seen.add(key); out.push({label, gloss: strip(gloss), sec});
  };
  [["people","people"],["places","places"],["terms","terms"]].forEach(([k, sec]) => {
    (w[k] || []).forEach(r => { if (!r.ref) add(r.k, r.v, sec); });
  });
  Object.values(GLOSSARY).forEach(g => {
    const name = g.name || g.gk;
    const eq = g.equiv || g.rom || "";
    add(name, g.v, "people");
    if (eq && eq !== name){
      const which = g.side === "gk" ? "Greek" : "Roman";
      add(eq, g.v + ` (${which} counterpart of ${name}.)`, "people");
    }
  });
  return out.sort((a,b) => b.label.length - a.label.length);
}

function enrich(container, slug){
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
    acceptNode(t){
      const p = t.parentElement;
      if (!p || !t.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      if (p.closest("a,button,h1,h2,h3,h4,.rows,.secnav,.tiers,.lbl,.tag,.legend"))
        return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  let t, nodes = [];
  while ((t = walker.nextNode())) nodes.push(t);

  const wrapFirst = (needle, build, flags) => {
    const re = new RegExp("(^|[^\\w-])(" + reEsc(needle) + ")(?![\\w-])", flags || "");
    for (const node of nodes){
      if (!node.parentElement) continue;
      const m = re.exec(node.nodeValue);
      if (!m) continue;
      const start = m.index + m[1].length;
      const after = node.splitText(start);
      after.splitText(m[2].length);
      const el = build(after.nodeValue);
      after.parentNode.replaceChild(el, after);
      nodes = nodes.filter(x => x !== after);
      return true;
    }
    return false;
  };

  // 1. work titles → links (first mention only, never to itself)
  WORKLINKS.forEach(([title, target]) => {
    if (target === slug) return;
    wrapFirst(title, txt => {
      const a = document.createElement("a");
      a.className = "wlink"; a.setAttribute("role","link"); a.tabIndex = 0;
      a.dataset.slug = target; a.textContent = txt;
      return a;
    });
  });

  // 2. names, places, terms → glosses (first mention only)
  glossary(slug).forEach(g => {
    wrapFirst(g.label, txt => {
      const b = document.createElement("button");
      b.className = "term";
      b.dataset.g = g.gloss; b.dataset.n = g.label; b.dataset.s = g.sec;
      b.textContent = txt;
      return b;
    }, "i");
  });
}

/* --- sheet wiring --- */
const sheet = $("#sheet");
const COARSE = window.matchMedia("(pointer: coarse)").matches;
let lastFocus = null;

function openSheet(){
  lastFocus = document.activeElement;
  sheet.classList.add("open");
  runSearch();
  // On touch, DON'T summon the keyboard — the index is the point, and the keyboard eats it.
  if (!COARSE) setTimeout(() => $("#q").focus(), 60);
  else setTimeout(() => $("#close").focus(), 60);
}
function closeSheet(){
  sheet.classList.remove("open");
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
// focus trap
sheet.addEventListener("keydown", e => {
  if (e.key !== "Tab" || !sheet.classList.contains("open")) return;
  const f = sheet.querySelectorAll("input, button, a[href], [tabindex]:not([tabindex='-1'])");
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest("[data-slug],[data-go],[data-back],[data-jump],[data-sec-go]");
  if (!el || el.tagName === "BUTTON" || el.hasAttribute("aria-disabled")) return;
  e.preventDefault();
  el.click();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if ((e.key === "/" || (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey)))
      && !sheet.classList.contains("open")
      && !["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){
    e.preventDefault(); openSheet();
  }
});

// direct click routing — works in sandboxed frames and from file://
document.addEventListener("click", e => {
  const b = e.target.closest("[data-back]");
  if (b){
    e.preventDefault();
    if (HAS_HISTORY && history.length > 1) history.back();
    else navigate(b.dataset.to, {from:null});
    return;
  }
  const j = e.target.closest("[data-jump]");
  if (j){
    e.preventDefault();
    const t = document.getElementById(j.dataset.jump);
    if (t) t.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  const a = e.target.closest("[data-slug]");
  if (!a) return;
  e.preventDefault();
  const fromRail = !!a.closest("#seq");          // rail = deliberate; anything else = a detour
  navigate(a.dataset.slug, {from: fromRail ? null : CURRENT});
});

window.addEventListener("popstate", e => {
  const st = e.state || {};
  const slug = st.slug || (location.hash || "").replace("#/","") || "home";
  rememberScroll();
  if (st.scroll) SCROLLMEM[memKey(slug, st.tier || "brief")] = st.scroll;
  render(slug, st);
  if (st.scroll && st.scroll > 240 && !isViewSlug(slug)) showResume();
});

/* ============================================================
   RESTORATION — remembers where you were. Nothing else.
   No counting, no progress, no read/unread. It restores; it does not judge.
   Storage: Claude artifact API → localStorage → memory (nothing persists).
   ============================================================ */
const KEY = "state:last";
const MAX_AGE = 7 * 864e5;   // after a week, go to The Threads instead

const STORE = (() => {
  if (window.storage && typeof window.storage.get === "function"){
    return {
      kind: "artifact",
      async get(k){ try { const r = await window.storage.get(k); return r ? r.value : null; } catch(e){ return null; } },
      async set(k, v){ try { await window.storage.set(k, v); } catch(e){} }
    };
  }
  try {
    const t = "__probe"; localStorage.setItem(t, "1"); localStorage.removeItem(t);
    return {
      kind: "local",
      async get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
      async set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
    };
  } catch(e){}
  const mem = {};
  return { kind:"memory", async get(k){ return mem[k] || null; }, async set(k, v){ mem[k] = v; } };
})();

let persistTimer;
function persist(){
  if (!CURRENT) return;
  STORE.set(KEY, JSON.stringify({
    slug: CURRENT, tier: CURRENT_TIER, scroll: window.scrollY, t: Date.now()
  }));
}
window.addEventListener("scroll", () => {
  clearTimeout(persistTimer); persistTimer = setTimeout(persist, 1200);
}, {passive:true});
document.addEventListener("visibilitychange", () => { if (document.hidden) persist(); });
window.addEventListener("pagehide", persist);

// installable + offline, but only when actually served (never from file://)
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

// boot — a deep link always wins; otherwise resume where you left off
(async function boot(){
  syncMasthead();
  const hash = (location.hash || "").replace("#/","");
  let saved = null;
  if (!hash){
    const raw = await STORE.get(KEY);
    if (raw){
      try {
        const s = JSON.parse(raw);
        if (s && s.slug && (Date.now() - (s.t || 0)) < MAX_AGE) saved = s;
      } catch(e){}
    }
  }
  const slug = hash || (saved && saved.slug) || "home";
  const st = {
    slug,
    tier:   (saved && !hash && saved.tier)   || "brief",
    scroll: (saved && !hash && saved.scroll) || 0,
    from:   null
  };
  try { history.replaceState(st, "", "#/" + slug); } catch(e){}
  render(slug, st);
})();
</script>
