"pride-prejudice": {
  file:"13", title:"Pride and Prejudice", author:"Jane Austen", date:"1813",
  form:"Novel · the funniest book here",
  read:"Brief: 5 min",
  spineLabel:"What happens",
  oneline:"Five sisters will be homeless when their father dies, so they must marry — and the book everybody files under 'romance' is an economic thriller about the training of judgement.",
  spine:`
  <p class="lede">The Bennets have five daughters and no son. Their estate is <b>entailed</b> — on Mr Bennet's death it passes automatically to a male cousin, and his widow and five daughters get nothing at all.</p>
  <p>That is not background. That is the clock. Every ball in this novel is a job interview, and Mrs Bennet — vulgar, shrieking, ridiculous — is the only person in the family who has correctly understood the situation.</p>
  <p>A rich young man, Bingley, rents the house next door and brings a richer, prouder friend: <b>Darcy</b>, who at his first ball looks at Elizabeth Bennet and says, within her hearing, that she is <em>tolerable, but not handsome enough to tempt me.</em></p>
  <p>Elizabeth decides she has his measure. A charming officer named Wickham confirms it — Darcy, he says, cheated him out of an inheritance. She believes him instantly, because it fits.</p>
  <p>Then Darcy proposes. Appallingly: he loves her <em>against his will, against his reason, and against his family</em>, and says so. She refuses him with contempt and tells him he is the last man in the world she could ever marry.</p>
  <p>He writes her a letter. Wickham tried to elope with Darcy's fifteen-year-old sister for her money. Every fact Elizabeth was certain of is wrong. She reads it, and reads it again, and then — alone, in a room, with nobody watching — she says the sentence the entire novel exists to produce: <b><em>Till this moment, I never knew myself.</em></b></p>
  <p>Later, her fifteen-year-old sister Lydia runs off with Wickham, which will destroy the reputation of every woman in the family. Darcy hunts them down and quietly pays Wickham to marry her, and tells no one. Elizabeth finds out by accident.</p>
  <p>He proposes again. This time she says yes — and she says it to a man she has revised her entire judgement of, twice.</p>`,
  why:`
  <p class="lede">Two reasons, and neither of them is the wedding.</p>
  <p><b>First: the technique.</b> Austen perfects <em class="g">free indirect style</em> — third-person narration that slides, without warning or quotation marks, into a character's own private idiom, so you cannot always tell where the narrator stops and Elizabeth begins. It gives you irony and intimacy <em>at the same time</em>, which had never been possible before. Flaubert, James, and Joyce all build on it. Critics have called it the most important technical development in the history of the novel, and it happens in a book about country dances.</p>
  <p><b>Second: it is the <em>Nicomachean Ethics</em> in a dress.</b> Nobody in this novel is converted by an argument. Elizabeth and Darcy are <b>trained</b> out of their faults — slowly, by experience, through humiliation — and what changes is not their feelings but their <em>judgement</em>. That is Aristotle's account of how character actually changes, dramatised more convincingly than Aristotle managed himself.</p>`,
  sticky:[
    {h:"The first sentence is a lie.", p:"<em>It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.</em> It is not universally acknowledged and it is not true. It is what Mrs Bennet thinks, delivered in the voice of God. Austen opens the book by putting a foolish opinion inside a magisterial sentence — and that trick is the entire novel."},
    {h:"'Till this moment I never knew myself.'", p:"The climax of the book is a woman sitting alone in a room, realising she was wrong. No music, no rain, no man in a wet shirt. Every adaptation moves the climax somewhere else, because this one cannot be filmed."},
    {h:"Charlotte marries the ridiculous clergyman with her eyes open.", p:"Elizabeth's best friend, twenty-seven, plain, and poor, accepts the odious Mr Collins the week after Elizabeth refuses him — and explains, without a flicker of self-pity, that she is not romantic and asks only for a comfortable home. Austen neither punishes her nor pities her. It is the coldest and truest passage in the book."},
    {h:"The romantic climax is a rich man paying a blackmailer.", p:"Darcy's great act of love is finding Wickham and quietly buying him — money, a commission, debts cleared — to make him marry a fifteen-year-old girl he has ruined. That is what rescues the Bennets. Austen shows you exactly what respectability costs and who pays for it."},
    {h:"Mr Bennet is the villain nobody notices.", p:"He is witty, ironic, and the most likeable person in the book — and he is a catastrophic father who retreats into his library and makes jokes while his daughters walk toward destitution. Austen indicts the character the reader likes best, and does it so gently that most readers never register the charge."}
  ],
  idea:`
  <p class="lede">Love is a judgement, not a feeling — and your judgement is exactly as good as your willingness to be humiliated.</p>
  <p>The novel's original title was <em>First Impressions</em>, and the joke is that a first impression is not information. It is your own vanity, reflected back at you, wearing someone else's face.</p>
  <p>Portable version: <b>the people who are certain fastest are wrong most.</b> Elizabeth is the cleverest person in the book, and her cleverness is precisely what makes her wrong — because being right quickly felt so good.</p>`,
  wrong:[
    {b:"It is not a romance novel.", p:"It is an economic and ethical novel that ends in a wedding. Nobody in it follows their heart; the one person who does — Lydia — is destroyed, and only rescued by a cheque."},
    {b:"Austen is not gentle.", p:"She is savage. Mr Collins, Lady Catherine, Mrs Bennet and Mr Bennet are all dismantled without mercy. She is closer to Swift than to anything sold with a pastel cover."},
    {b:"'Pride' isn't his and 'prejudice' isn't hers.", p:"Both characters have both, and swap them around. The title is a chiasmus, not a pair of labels."},
    {b:"She was a professional, not a hobbyist.", p:"She wrote the first draft at twenty-one, was rejected by a publisher who never opened it, and revised it for sixteen years. Then she sold the copyright outright: she <b>asked £150 and settled for £110</b>, and earned nothing further, ever. Egerton made roughly <b>£450</b> from the first two editions alone. Walter Scott, the bestselling novelist alive, wrote in his diary that she could do the thing he could not do."}
  ],
  take:`<p>The book people file under romance is a book about the education of judgement, and its emotional peak is a woman alone, discovering she has been a fool. That discovery — private, unwitnessed, and irreversible — is Austen's actual subject, and it is unfilmable, which is why the culture that adores this novel has quietly replaced its climax with a man emerging from a lake.</p>`,
  counter:`<p>There is something faintly embarrassed in that reading — a wish to rescue Austen from the readers who love her for the weddings. It <b>is</b> a romance. Austen wanted the wedding, wrote it with enormous pleasure, and made it earned. There is something slightly suspect about insisting that a novel which has given more delight than almost any other is <em>really</em> a treatise on epistemology — that move is its own species of vanity, and Elizabeth Bennet would have recognised it immediately.</p>`,
  people:[
    {k:"Elizabeth Bennet", v:"Clever, quick, proud of being quick — and wrong about the two most important judgements she makes. The first heroine in English whose intelligence is her flaw."},
    {k:"Darcy", v:"Ten thousand a year, no small talk, and genuinely arrogant. He is not misunderstood; he is <em>rude</em>, and he has to be told so before he changes."},
    {k:"Mr and Mrs Bennet", v:"Elizabeth's parents: a witty, detached father who has given up on his marriage and hides in his library, and a nervous, foolish mother whose sole aim is to marry off five daughters before the estate passes to a male cousin. A comic marriage that is also a warning."},
    {k:"Jane &amp; Bingley", v:"Elizabeth's gentle elder sister and Darcy's amiable rich friend — the couple whose easy, sincere love runs parallel to the thornier Elizabeth–Darcy plot. Darcy's meddling to separate them is one of his early crimes."},
    {k:"Charlotte Lucas", v:"Twenty-seven, sensible, and out of options. Marries for a house, says so out loud, and is neither punished nor rescued. The novel's reality check."},
    {k:"Mr Collins", v:"A clergyman of monumental, oblivious self-regard. One of the funniest characters ever written — and he will inherit the house the moment Mr Bennet dies."},
    {k:"Lydia", v:"Fifteen, thoughtless, and one bad week away from destroying five women's lives. She never grasps it, and the novel does not forgive her for it."},
    {k:"Wickham", v:"Charming, plausible, and a predator of teenage heiresses. Elizabeth believes him for exactly as long as it flatters her to."},
    {k:"The Gardiners", v:"Elizabeth's aunt and uncle, who are <em>in trade</em> and therefore beneath the gentry — and who have the only sane, warm, functioning marriage in the entire book. Austen puts the moral centre in the vulgar commercial class on purpose."}
  ],
  places:[
    {k:"Longbourn", v:"The house. Entailed away. Everything is happening on borrowed time."},
    {k:"Pemberley", v:"Darcy's estate. Elizabeth sees it and admits, half-joking, that this is when she began to love him — and Austen lets the joke stand, because it is not entirely a joke."},
    {k:"Rosings", v:"Lady Catherine's. Where rank is displayed, and where Darcy proposes so badly."},
    {k:"Brighton", v:"Where Lydia goes with the regiment, and where a family's respectability is lost in a fortnight."}
  ],
  terms:[
    {k:"free indirect style", v:"The narrator borrows the character's voice without saying so. The whole modern novel walks through this door."},
    {k:"the entail", v:"The legal instrument that makes the plot inevitable: property passes to the nearest male heir, and the women get nothing. Not a metaphor — the law."},
    {k:"'in trade'", v:"The unforgivable stain. You may be rich, but if you earned it, the gentry will not quite receive you. Half the novel's cruelty is class, not manners."},
    {k:"ten thousand a year", v:"Darcy's income. It places him among a few hundred families in England. Austen's readers did that arithmetic instantly, and so does Mrs Bennet."}
  ],
  context:`
  <p class="lede">Written during the Napoleonic Wars, which are never mentioned.</p>
  <p>The militia are billeted at Meryton because England is expecting a French invasion. Two of Austen's own brothers were naval officers in the war. And the war does not appear — the officers are only interesting as dance partners and sons-in-law.</p>
  <p>Charlotte Brontë complained that Austen showed no passion; later critics complained she showed no empire and no war. The counter-charge is that she wrote about the only arena in which the women she knew had any power at all, and reported it with the precision of a war correspondent. She published anonymously, as 'A Lady,' and died at forty-one.</p>`,
  echoes:[
    {k:"→ Nicomachean Ethics", to:"nicomachean-ethics", v:"Nobody is argued into virtue. Elizabeth and Darcy are <em>trained</em> out of their faults by experience — which is Aristotle's <em>phronesis</em>, dramatised better than he managed."},
    {k:"→ Don Quixote", to:"quixote", v:"A reader whose picture of the world is wrong, colliding with the world. Elizabeth's romances are Wickham's stories, and reality corrects her the hard way."},
    {k:"→ War and Peace", to:"war-and-peace", v:"Tolstoy puts the same marriage plot inside an invasion, and lets the war in. Natasha is Elizabeth with the walls taken down."},
    {k:"→ Every romantic comedy since", v:"Two people who dislike each other, are wrong about each other, and are corrected. The form was finished on the first attempt, and everything after is a variation."}
  ]
},

"moby-dick": {
  file:"14", title:"Moby-Dick", author:"Herman Melville", date:"1851",
  form:"Novel · encyclopaedia · sermon",
  read:"Brief: 6 min",
  spineLabel:"What happens",
  oneline:"God refuses to answer Job. Ahab decides to go and get the answer out of him with a harpoon.",
  spine:`
  <p class="lede"><em>Call me Ishmael.</em> A man with a damp, drizzly November in his soul goes to sea because the alternative is stepping deliberately into the street and knocking people's hats off.</p>
  <p>In New Bedford he is forced to share a bed with a tattooed Polynesian harpooneer, a cannibal called <b>Queequeg</b>, and by morning they are — Melville's word — bosom friends. It is the warmest relationship in nineteenth-century American literature, and it is between a white American and a man his country would have put in a freak show.</p>
  <p>They sign onto the <em>Pequod</em>, named for a tribe the colonists exterminated. And for a hundred and thirty pages the captain does not appear.</p>
  <p>Then <b>Ahab</b> comes on deck: a man with a leg of polished whale-jaw and a livid scar running down him like lightning down a tree. He nails a gold coin to the mast and tells the crew what this voyage is actually for. Not oil. Not money. <b>One whale.</b> The white one, that took his leg.</p>
  <p>Starbuck, the first mate, objects — and he is right, and everyone knows he is right: <em>vengeance on a dumb brute? To be enraged with a dumb thing seems blasphemous.</em></p>
  <p>And Ahab answers him with the passage the whole book turns on. All visible objects are <b>pasteboard masks</b>. Behind them there may be something — or there may be nothing at all, which is worse. And if a man is to strike, he must strike <em>through</em> the mask. <em>To me the white whale is that wall.</em></p>
  <p>Then: a third of the book is whale anatomy. Taxonomy. Rope. Blubber. The mechanics of the try-works. And a chapter arguing that the most terrifying thing about the whale is not that it is huge, but that it is <b>white</b>.</p>
  <p>Three days of chase. The whale smashes the boats, then turns and rams the ship. Ahab throws his harpoon, is caught around the neck by his own line, and is dragged down by the thing he was trying to kill.</p>
  <p>Everyone dies. Ishmael floats out of the vortex on <b>Queequeg's coffin</b>, and is picked up by a ship searching for its captain's lost son.</p>`,
  why:`
  <p class="lede">It is <em>Job</em> with a harpoon, and it is the reply.</p>
  <p>When God finally answers Job out of the whirlwind, what he actually does is describe <b>Leviathan</b> — a creature you cannot catch, cannot argue with, cannot understand. The answer is: <em>you are small; stop asking.</em></p>
  <p>Ahab hears that answer and refuses it. He goes to catch Leviathan and demand an explanation. He converts a commercial voyage into a metaphysical assault, and he takes thirty men with him.</p>
  <p>And Melville's formal solution is the strangest and best thing in American literature: he assembles <b>everything humans know</b> about whales — the science, the history, the anatomy, the trade, the art, the etymology — and demonstrates, page after exhaustive page, that <b>none of it touches the thing.</b> The encyclopaedia is the argument. The more completely you know about the whale, the less you understand it. That's what those 'boring' chapters are doing, and it is why they cannot be cut.</p>`,
  sticky:[
    {h:"It failed completely, and destroyed him.", p:"It sold <b>3,715 copies</b> in his lifetime and earned him about <b>$1,260</b>. He stopped publishing novels and spent nineteen years as a customs inspector on the New York docks. When he died in 1891, the brief <em>New York Times</em> death notice called the book <b>'Mobie Dick.'</b> It was rediscovered in the 1920s. Greatness is not a market signal."},
    {h:"'Strike through the mask.'", p:"Starbuck says: it's an animal, it meant nothing by it, this is madness. Ahab's answer is that everything visible is a mask, and behind it there is either something that hates us or <em>nothing at all</em> — and he cannot live without knowing which. He does not hunt the whale because it hurt him. He hunts it to find out whether the universe means anything."},
    {h:"The terror is the whiteness, not the whale.", p:"There is an entire chapter arguing that white is the most frightening colour in existence — because it is not a colour. It is a blank, an absence, the colourless all-colour, the suggestion that behind the painted world there is nothing to find. That chapter is the intellectual centre of the book and most readers skim it."},
    {h:"Ahab appears on page 130.", p:"The most famous character in American fiction is offstage for a fifth of the novel. Melville makes you wait, and hear about him, and dread him, before the man with the ivory leg finally comes up the hatch."},
    {h:"He survives on his friend's coffin.", p:"Queequeg has a coffin built when he expects to die. He recovers, and it's converted into a life-buoy. When the ship goes down, the coffin shoots out of the vortex and Ishmael clings to it for a day and a night. The only survivor of the hunt for meaning is a man holding on to a friend's coffin."}
  ],
  idea:`
  <p class="lede">Ahab is not mad because he hunts the whale. He is mad because he <b>needs the whale to mean something.</b></p>
  <p>The pursuit of meaning and the pursuit of revenge turn out to be the same motion, performed at the same speed, and both will take the ship down with them.</p>
  <p>Portable version: <b>the demand that suffering be <em>about</em> something is itself a form of violence</b>, and it is usually pointed at other people.</p>`,
  wrong:[
    {b:"The whale is not evil.", p:"It is a whale. Melville is scrupulous about this — it behaves exactly as a sperm whale behaves. Every drop of malice in it is projected by a man who needs it to be there."},
    {b:"Ishmael is not a reliable narrator, and eventually not really a narrator.", p:"He vanishes for long stretches. The book slides into omniscience, into stage directions, into essays, into soliloquies Ishmael could not have heard. Melville simply does not care, and the not-caring is part of the design."},
    {b:"The whaling chapters are not padding.", p:"They are the proof. Skipping them to get to the plot is like skipping the evidence to get to the verdict."},
    {b:"It wasn't ignored — it was disliked.", p:"It was reviewed and dismissed. The English edition accidentally left out the epilogue, so British critics complained, reasonably, that the narrator dies and then goes on narrating."}
  ],
  take:`<p>Melville read the Book of Job and refused its answer. God tells Job: look at Leviathan, you cannot catch it, be quiet. Ahab says: <em>watch me.</em> The book is what happens when a human being will not accept that there may be nothing behind the mask — and it destroys him, and Melville never once tells you he was wrong to try. That refusal to condemn Ahab is one of the most radical things in nineteenth-century literature.</p>`,
  counter:`<p>Cast Ahab as the tragic metaphysical hero and you flatter the reader with the grandeur of despair. Look at what the book actually shows you. Ahab hijacks other men's livelihoods for a private grudge. He refuses to help a fellow captain search the sea for his drowned son. He ignores every duty he has to his owners and his crew, and he kills thirty men, including a boy who has already lost his mind. <b>Starbuck is right</b>, and the novel knows he is right, and the moral centre of the book may simply be a decent man who fails to stop a maniac. The grandeur is real. So is the body count. And admiring the grandeur is precisely the mistake the crew made.</p>`,
  people:[
    {k:"Ishmael", v:"The outcast son, named for the boy sent into the desert in Genesis. Melville expects you to know that before the second sentence."},
    {k:"Ahab", v:"Named for a king in the Book of Kings who did evil in the sight of the Lord. Melville tells you that too, in advance, and does it anyway."},
    {k:"Queequeg", v:"Prince, harpooneer, cannibal, and the most decent human being in the book. He dives into freezing water to save a man who had been mocking him ten minutes earlier."},
    {k:"Starbuck", v:"First mate. Sane, brave, devout, correct — and unable to act on it. He stands over the sleeping Ahab with a loaded musket and cannot pull the trigger. Everything that follows is in that hesitation."},
    {k:"Pip", v:"The small Black cabin boy who jumps overboard, is left alone in the open ocean for hours, and comes back mad — having seen, Melville says, God's foot upon the treadle of the loom. Ahab, who is tender to no one else on earth, is tender to him."},
    {k:"Moby Dick", v:"A white sperm whale. That is all we ever actually learn about it, and that is the point."}
  ],
  places:[
    {k:"New Bedford", v:"Then the richest city per capita in America, on whale oil. The lamps of the world ran on this."},
    {k:"The Pequod", v:"Named after a tribe destroyed by New England colonists. The ship is a floating republic — crewed by men from every continent — hijacked by one man's private grievance. America has been reading itself into that sentence since 1941."},
    {k:"The try-works", v:"The furnace on deck where blubber is boiled down. Ishmael steers by its light at night, is hypnotised, and nearly capsizes the ship. Melville warns you: do not look too long into the fire."}
  ],
  terms:[
    {k:"the pasteboard mask", v:"Ahab's metaphysics in a phrase. The visible world is a painted screen and something may be standing behind it."},
    {k:"the whiteness", v:"Not purity. Blankness. The colour of the void, and — Melville notes — of the shark, the albatross, and the shroud."},
    {k:"cetology", v:"The science of whales. The book contains a full, wrong, beautiful taxonomy, and Melville knows it will be superseded, and includes it anyway."},
    {k:"'I only am escaped alone to tell thee'", v:"The epilogue's epigraph. It is the line spoken four times, by four messengers, in the Book of Job."}
  ],
  context:`
  <p class="lede">He had actually done it.</p>
  <p>Melville shipped on a whaler at twenty-one, deserted in the Marquesas, lived among people his readers thought were cannibals, took part in a mutiny, and came home. He wrote travel books about it and they sold. Then he read Shakespeare in a large-print edition — his eyes were bad — and met Hawthorne, and something opened, and he wrote <em>this</em> instead of the sea adventure everybody wanted.</p>
  <p>It ruined him. His next book was worse received. He gave up, took a government job, and wrote poetry nobody read for the rest of his life. He left a short novel in a drawer, unfinished. It was found in 1924 and it is called <em>Billy Budd</em>.</p>`,
  echoes:[
    {k:"→ The Bible", to:"bible", v:"Job, Leviathan, the whirlwind, Ishmael, Ahab, and the last line of the epilogue. This book is a wrestling match with the Book of Job, and it does not pretend otherwise."},
    {k:"→ King Lear", to:"lear", v:"Melville was reading Shakespeare while writing it and said so. Ahab's defiance shouted into an indifferent sky <em>is</em> Lear on the heath, moved to the Pacific."},
    {k:"→ Paradise Lost", to:"paradise-lost", v:"The unconquerable will, the wounded pride, the refusal to submit to a power that cannot be beaten. Ahab is Satan with a boat."},
    {k:"→ Faust", to:"faust", v:"Ahab baptises his harpoon in blood, in the name of the devil, and drags a crew to the bottom for knowledge he will not get."},
    {k:"→ Oedipus Rex", to:"oedipus-rex", v:"The man who has to know, who is warned repeatedly to stop, and who destroys everything around him getting his answer. Oedipus, at sea."}
  ]
}

"karamazov": {
  file:"15", title:"The Brothers Karamazov", author:"Fyodor Dostoevsky", date:"1880",
  form:"Novel · murder mystery · theology",
  read:"Brief: 6 min",
  spineLabel:"What happens",
  oneline:"A devout Christian writes the most devastating argument against God ever put on paper, gives it to his atheist, and then does not answer it — because he thinks it cannot be answered, only outlived.",
  spine:`
  <p class="lede">Fyodor Karamazov is a repellent old man: a lecher, a buffoon, a swindler, a father who forgot he had children. He has three legitimate sons and, probably, a fourth.</p>
  <p><b>Dmitri</b> — soldier, sensualist, broke, generous, violent. He is fighting his father over money and over a woman, and he says out loud, in public, that he could kill him.</p>
  <p><b>Ivan</b> — the intellectual. Cold, brilliant, and in agony. He does not believe, and it is destroying him.</p>
  <p><b>Alyosha</b> — a novice in the monastery, and the book's declared hero, though nobody remembers him.</p>
  <p>And <b>Smerdyakov</b> — the epileptic servant, the son of a homeless mute woman the old man almost certainly raped. He listens to everything Ivan says.</p>
  <p>Two chapters make the book immortal, and both are Ivan talking to Alyosha in a tavern. In the first — <b>Rebellion</b> — Ivan piles up documented atrocities committed against children, ending with a general who sets his hounds on a serf boy and tears him apart in front of his mother. Ivan says he is not denying God. He is <b>returning his ticket.</b> If the price of some final harmony is one child in agony, he declines to attend. <em>It's not God I don't accept; it's the world he made.</em></p>
  <p>In the second — <b>The Grand Inquisitor</b> — Christ returns to Seville during the Inquisition and is arrested. The old Cardinal visits his cell at night and explains, calmly, that he was <em>wrong</em>: you offered people freedom, and freedom is unbearable, and we have spent fifteen centuries correcting your mistake. We give them bread, and mystery, and someone to obey, and they are happy. Go away.</p>
  <p>And Christ says <b>nothing at all.</b> He kisses the old man on his bloodless lips, and the Inquisitor opens the door and lets him out into the dark.</p>
  <p>Then the father is murdered. Dmitri is arrested and convicted on evidence that is overwhelming and wrong. Smerdyakov did it — and he tells Ivan so, and adds: <em>you taught me that everything is permitted, you wanted him dead, you made sure to be out of town. I was only the instrument. <b>You are the murderer.</b></em> Then he hangs himself, and the proof dies with him.</p>
  <p>Ivan goes mad. Dmitri accepts a sentence for a crime he did not commit. And the book ends with Alyosha and a group of schoolboys, at a stone, after a child's funeral, promising to remember one good thing.</p>`,
  why:`
  <p class="lede">Because Dostoevsky stages the fight fairly — and he was terrified of the result.</p>
  <p>He was a devout Orthodox Christian. He wrote, in Ivan, the single most powerful indictment of God in world literature. And he knew he had. He wrote to his editor worrying that his own reply would not be strong enough.</p>
  <p>It is also the greatest novel of ideas for a precise reason: <b>the ideas are people.</b> Ivan's atheism is not a position he holds; it is a wound he cannot close. Bakhtin's word for what Dostoevsky invented is <em class="g">polyphony</em> — the characters are not the author's puppets. They argue back, and sometimes they win.</p>`,
  sticky:[
    {h:"Ivan returns his ticket.", p:"He does not say God doesn't exist. He says that if the entrance fee to eternal harmony is one small girl locked in a freezing outhouse, beating her chest and praying to 'dear kind God' — then he respectfully hands the ticket back. It is the most unanswerable page in literature and a believer wrote it."},
    {h:"Christ says nothing to the Grand Inquisitor.", p:"The old Cardinal tells him, for twenty pages, that he was wrong about human beings — that they don't want freedom, they want bread and mystery and someone to obey. And the defence is given <b>no lines at all.</b> Christ kisses him on the mouth and walks out. The kiss burns in the old man's heart. <em>He adheres to his idea.</em>"},
    {h:"The saint's body stinks.", p:"When the holy Elder Zosima dies, his corpse begins to rot — fast, and badly — and the whole monastery is scandalised, because a saint's body is supposed to smell sweet. Alyosha's faith cracks on that smell. Dostoevsky's most religious novel turns on an <b>anti-miracle</b>."},
    {h:"Ivan's devil wears a shabby checked suit.", p:"When Ivan finally breaks, the devil who visits him is not majestic. He is a middle-aged sponger with rheumatism who chats about the weather and will not leave, and Ivan cannot tell whether he is real. The direct heir of Mephistopheles — and the discovery, before the twentieth century needed it, that evil is <b>boring.</b>"},
    {h:"'You killed him.'", p:"Smerdyakov, who held the knife, tells Ivan he was merely the instrument — Ivan supplied the idea, wanted the outcome, and arranged to be elsewhere. Then he hangs himself. Ivan is guilty of a murder he did not commit, cannot be convicted of, and cannot escape."}
  ],
  idea:`
  <p class="lede">The person who supplies the idea is not innocent of what is done with it.</p>
  <p>Ivan never touches his father. He simply makes the murder <em>thinkable</em>, in the hearing of a man who is listening very carefully — and then leaves town so as not to see it. He is not the killer, and he is the murderer, and both are true, and the novel refuses to let him off either hook.</p>
  <p>Portable version: <b>you are responsible for what your ideas do in the hands of people less protected than you are.</b></p>`,
  wrong:[
    {b:"'If God does not exist, everything is permitted' is not in the book.", p:"Not as a sentence. It is a compression of ideas in the novel, made famous by Sartre. It is the most quoted line Dostoevsky never wrote."},
    {b:"Alyosha is the hero, and nobody remembers him.", p:"Dostoevsky says so in his own preface. Readers walk away with Ivan — which is precisely the outcome the author was afraid of. The novel was to be the first of two; the second, following Alyosha, was never written, because he died."},
    {b:"It is not gloomy.", p:"It is <em>funny.</em> The father is a comic monster, the monastery scenes are farce, and Dostoevsky is one of the great writers of embarrassment. People who describe it as heavy Russian gloom have not opened it."},
    {b:"There is no rebuttal to Ivan, and people keep hunting for one.", p:"Dostoevsky does not refute him. He answers with a life — Zosima's — and a folk tale about an onion, and a group of boys at a stone. If you came for an argument, you will leave thinking the atheist won."}
  ],
  take:`<p>The book's greatness is that its author loses control of it and knows he has. Dostoevsky built the strongest case against his own God that anyone has ever built, and then declined to knock it down — and the reply, a kiss with no words in it, is not an argument in any sense that Ivan would accept. He staged the fight honestly and let his own side lose on points, and the honesty is why the novel is still alive when the apologetics of that century are dust.</p>`,
  counter:`<p>That is the reading of someone who wants the debate to <em>be</em> a debate. Dostoevsky's entire claim is that Ivan cannot be answered <b>in Ivan's terms</b> — and that this is the point, not the failure. You cannot out-argue a man who has decided that suffering makes the universe unacceptable. You can only live in front of him. The kiss is not a weak reply to the Inquisitor; it is a <em>refusal of the format</em>. And the novel's real answer is structural: Ivan's ideas produce a corpse, a suicide, and a madman, while Alyosha's produce a dozen boys at a stone promising to remember one good thing. If you think the essay beat the novel, you read the essay and skipped the novel.</p>`,
  people:[
    {k:"Ivan", v:"The most compelling atheist in literature, written by a Christian who understood him from the inside and was frightened by how well."},
    {k:"Dmitri", v:"Guilty of everything except the crime. He is convicted, and he accepts it, and says he will go and suffer for all — which is either the deepest thing in the book or the most Russian."},
    {k:"Alyosha", v:"The declared hero. Loves people rather than ideas, and is therefore invisible to everyone who reads for ideas."},
    {k:"Fyodor Karamazov", v:"The father — a gross, drunken, buffoonish sensualist whose murder is the centre of the novel. He humiliates his sons, competes with Dmitri for the same woman, and is loathed by everyone. Whoever killed him, all four sons wished him dead. The parricide the whole book circles.",to:"oedipus-rex"},
    {k:"Smerdyakov", v:"The listener. Takes a clever man's theory literally and acts on it, and then explains, with terrible logic, whose theory it was."},
    {k:"Zosima", v:"The Elder. His answer to Ivan is not an argument but a biography: that we are each responsible to all, for all, and that this is the only door out of Ivan's room."},
    {k:"Grushenka", v:"The woman both father and son want. She tells the fable of the onion — a wicked woman almost hauled out of hell by the one onion she once gave a beggar, until she kicks at the others clinging to her and it snaps. That is the whole theology, in a folk tale, told by a woman everyone despises."},
    {k:"Ilyusha &amp; the boys", v:"A dying schoolboy and the gang of children Alyosha gathers around him. Their story runs alongside the murder plot and closes the novel — Dostoevsky's deliberate answer to all the horror: a group of children promising to remember one another in love."},
    {k:"The devil", v:"Middle-aged, sponging, in a checked suit, with a cold. Wants only to be believed in."}
  ],
  places:[
    {k:"The monastery", v:"Where Alyosha lives — and which Zosima orders him to <em>leave</em>, because holiness done in a cell is worth nothing."},
    {k:"Seville", v:"Sixteenth century, the day after a hundred heretics have been burned. Christ comes back and the Church arrests him."},
    {k:"The stone", v:"Where the novel ends. A dozen boys, a dead friend, and a promise to remember. After eight hundred pages of parricide, courtrooms, and metaphysics, that is the last thing Dostoevsky wanted you to see."}
  ],
  terms:[
    {k:"'returning the ticket'", v:"Ivan's move: not denying God's existence, but refusing his world on moral grounds. It has never been answered and it is asked afresh every generation."},
    {k:"the Grand Inquisitor", v:"The chapter that escaped the book. Read on its own by people who never read the novel, which is exactly the mistake it was designed to expose."},
    {k:"polyphony", v:"Bakhtin's term. The characters have voices genuinely independent of their author's. Nobody else has managed it, before or since."},
    {k:"Karamazovism", v:"The family disease: appetite, intensity, and the capacity to be both utterly degraded and genuinely holy — usually within the same hour."}
  ],
  context:`
  <p class="lede">At twenty-eight, Dostoevsky was taken out to be shot.</p>
  <p>22 December 1849, Semyonovsky Square. Swords broken over their heads, white shirts, the cross to kiss. They were taken out in <b>threes</b>. Dostoevsky was in the second three, which meant he had perhaps a minute to live — and he spent it, he told his brother, embracing the two men beside him. Then the reprieve arrived, having been arranged in advance, as theatre. <b>One of the men tied to the posts went permanently insane on the spot.</b> Dostoevsky went to a Siberian prison camp for four years, where the only book permitted was the Gospels.</p>
  <p>He had epilepsy. He gambled everything away, repeatedly. And in 1878, while planning this novel, his three-year-old son died of a seizure. The boy's name was Alyosha.</p>
  <p>He finished the book in November 1880 and died in January 1881.</p>`,
  echoes:[
    {k:"→ The Bible", to:"bible", v:"Job is read aloud in the novel, and Zosima says it shattered him as a child. Ivan's rebellion is Job's question with the whirlwind removed."},
    {k:"→ Oedipus Rex", to:"oedipus-rex", v:"Freud, in his 1928 essay <em>Dostoevsky and Parricide</em>: it can scarcely be chance that three of the masterpieces of the literature of all time — <em>Oedipus Rex</em>, <em>Hamlet</em>, and this — all deal with the same subject, the killing of the father. (He also called this novel the most magnificent ever written, and then dismissed his own essay as trivial.) The same crime, three times — and only here is the son both innocent <em>and</em> guilty."},
    {k:"→ Faust", to:"faust", v:"The devil in the checked suit is Mephistopheles' direct descendant, and Dostoevsky knew it."},
    {k:"→ Don Quixote", to:"quixote", v:"Dostoevsky called it the saddest book ever written, and said it was his model for the hardest thing in fiction: a genuinely good man who is not a bore. Alyosha is the attempt."},
    {k:"→ Nietzsche and after", v:"Nietzsche said Dostoevsky was the only psychologist from whom he had anything to learn — and then spent his career answering Ivan's question with a yes. Camus and Sartre both begin here."}

"war-and-peace": {
  file:"16", title:"War and Peace", author:"Leo Tolstoy", date:"1869",
  form:"Not a novel — Tolstoy's word for it",
  read:"Brief: 6 min",
  spineLabel:"What happens",
  oneline:"Everything. That's the point — and the argument buried inside it is that history is not made by great men, and meaning is not found by thinking.",
  spine:`
  <p class="lede">Russia, 1805 to 1812. Napoleon is coming. Three families, five hundred and fifty-nine characters, and half a million words.</p>
  <p><b>Pierre</b> — fat, illegitimate, clumsy, honest — inherits a colossal fortune overnight and becomes the most eligible man in Russia. He marries a beautiful woman who does not love him, fights a duel he does not understand, joins the Freemasons, reads everything, and cannot find a single reason to be alive.</p>
  <p><b>Andrei</b> — brilliant, cold, ashamed of his marriage, contemptuous of everyone — goes to war looking for glory. At Austerlitz he is knocked flat, and lies on his back, and sees <b>the sky.</b> Just the sky, enormous and quiet. And every single thing he wanted — Napoleon, rank, fame — dissolves. Napoleon himself rides up, looks at him, and says something about a fine death, and Andrei finds him <em>small.</em></p>
  <p><b>Natasha</b> — thirteen when we meet her, and the most alive person in fiction. She sings, she dances, she loves Andrei, she is engaged to him — and then she is nearly abducted by a handsome idiot, and destroys her own engagement, and wants to die. It is the most humiliating and most human sequence Tolstoy ever wrote.</p>
  <p>Then 1812. Napoleon invades. Pierre, a civilian in a white hat, <b>wanders onto the battlefield at Borodino</b> to see what a war looks like, and stands in the middle of one of the bloodiest days of the century.</p>
  <p>Moscow burns. Pierre stays behind to assassinate Napoleon, is arrested instead, watches men shot, and is marched across a frozen country barefoot. And in that column, starving, he meets a round little peasant called <b>Platon Karataev</b>, who never asks why anything happens — and Pierre, who has spent a thousand pages searching for the meaning of life, is <em>happy.</em></p>
  <p>Andrei dies. Natasha nurses him. Pierre marries her.</p>
  <p>And in the epilogue, Natasha — the girl who danced — is a stout, distracted mother who no longer sings and does not care how she looks. Tolstoy did that on purpose. Readers have never forgiven him.</p>`,
  why:`
  <p class="lede">It is the most complete simulation of being alive that anyone has attempted.</p>
  <p>Not because it is long. Because it refuses to <b>subordinate</b> anything. A dance, a hunt, a death in childbirth, a cavalry charge, a bad marriage, a card game, a boy's first battle, the burning of a city, and forty pages on the philosophy of history all sit in the same book at the same weight — because that is how a life arrives, without a hierarchy.</p>
  <p>And beneath it is a hard argument. Tolstoy denies that <b>great men exist.</b> His Napoleon is a vain fool who believes he is directing events — 'like a child holding a ribbon tied inside a carriage and imagining he is driving it.' His hero is Kutuzov, the fat, one-eyed old general who <em>sleeps through the war council</em>, refuses to make plans, and wins by understanding that the commander's real job is to <b>not interfere.</b></p>`,
  sticky:[
    {h:"The sky at Austerlitz.", p:"Andrei falls, wounded, and looks up, and sees nothing but sky. <em>How is it I never saw that sky before?</em> Everything he has organised his life around evaporates in one sentence — and then Napoleon, his idol, rides up and turns out to be a small man saying something conventional."},
    {h:"Napoleon is a fool.", p:"Tolstoy's Napoleon fusses over his portrait, issues orders that arrive too late to matter, and believes he is moving history. Half of this book is a sustained argument that the great man is a passenger who has mistaken himself for the driver."},
    {h:"Pierre goes to a battle as a tourist.", p:"A civilian, in a white hat and a good coat, wandering around Borodino to see what it's like — and Tolstoy uses him to show you that nobody in a battle, at any rank, has the faintest idea what is happening. There is no map. There is only noise, and smoke, and men running."},
    {h:"The richest man in Russia is happiest barefoot, starving, in a prison column.", p:"Pierre spends a thousand pages searching philosophy, Freemasonry, and books for the meaning of life, and finds it while being marched across a frozen country with no shoes, from a peasant who has never once asked what anything means."},
    {h:"Natasha gets fat and stops singing.", p:"In the epilogue, the most dazzling girl in literature is a preoccupied mother with a stained blouse who has let herself go and does not care. Tolstoy meant it as a triumph. Readers have been furious about it for a hundred and fifty years, and their fury is itself the argument."}
  ],
  idea:`
  <p class="lede">Meaning arrives sideways, unearned, while you were looking at something else.</p>
  <p>Andrei goes to war to find glory and finds the sky. Pierre reads every philosophy on earth and finds an illiterate peasant. Napoleon believes he is making history and is being carried by it. Nobody in this book gets what they were aiming at, and the ones who end up whole are the ones who <b>stopped aiming.</b></p>
  <p>Portable version: <b>you are not the author of your life. You are a participant in something much larger, and the sane response is to stop demanding an explanation and go and live.</b></p>`,
  wrong:[
    {b:"It is not mostly about war.", p:"The battles are a minority of the book. It is a domestic novel — dinners, debts, engagements, hunts, childbirth — with a war running through the house."},
    {b:"Tolstoy said it is not a novel.", p:"His words: 'not a novel, still less a poem, still less a historical chronicle.' He meant it. He was inventing a form that could hold everything and refused to be filed."},
    {b:"The part everybody skips is the part he cared most about.", p:"The second epilogue is forty pages of philosophy of history arguing that free will is an illusion and great men do not exist. Nobody reads it. Tolstoy thought it was the point of the book, and anyone who has actually read <em>War and Peace</em> knows this, which makes it an excellent thing to know."},
    {b:"It is not difficult.", p:"It is a page-turner. The only real obstacle is the names: every character has a first name, a patronymic, a surname, a nickname, and a French version, and Tolstoy uses all five."}
  ],
  take:`<p>The greatness is the refusal to be <em>about</em> anything. Tolstoy denies that history has a shape, that great men matter, that the intellect can arrive at truth — and then writes thirteen hundred pages demonstrating that meaning comes sideways and unbidden, while you were watching a battle or a girl dancing. It is the most anti-intellectual masterpiece ever produced by an intellectual, and its argument is that the novel, and not philosophy and not history, is the only instrument fine enough to hold a human life.</p>`,
  counter:`<p>Then notice who is telling you this. Tolstoy is the <b>least humble narrator who ever lived</b>. He knows everything. He judges everyone. He tells you exactly what a dying man is thinking, and then stops the book to lecture you for forty pages about why your view of history is wrong. He preaches the futility of the intellect from a position of total intellectual mastery — and Karataev, the wise peasant who never asks why, is a fantasy of the simple life composed by a count who owned human beings. Isaiah Berlin put it exactly: <b>Tolstoy was a fox who believed he ought to be a hedgehog</b> — and everything great in this book comes from the fox, and everything preachy comes from the hedgehog he wished he was.</p>`,
  people:[
    {k:"Pierre", v:"Illegitimate, enormous, short-sighted, sincere. Searches everywhere and finds it in a prison column. The most lovable man in fiction, and Tolstoy knew he was writing himself."},
    {k:"Andrei", v:"Cold, proud, and hungry for a greatness he despises himself for wanting. Gets his answer twice — once under the sky at Austerlitz, once while dying — and cannot hold on to it either time."},
    {k:"Natasha", v:"Thirteen, then sixteen, then a wife. Tolstoy simply <em>puts a living person on the page</em>, and no one has ever satisfactorily explained how."},
    {k:"Kutuzov", v:"Fat, one-eyed, elderly, and asleep. Refuses to plan. Gives up Moscow without a fight and wins the war. Tolstoy's real hero — the man who understands that he controls nothing and therefore does not pretend to."},
    {k:"Platon Karataev", v:"A peasant prisoner, round as a loaf, who tells stories, mends boots, and never asks why. Pierre's answer — and, for many readers, the one false note in the book."},
    {k:"Napoleon", v:"A vain little man, fussing about his portrait, convinced that he is driving. Tolstoy hates him with a thoroughness that is itself a kind of art."},
    {k:"The Rostovs &amp; the Bolkonskys", v:"The two families the novel follows: the warm, chaotic, generous Rostovs (Natasha's family) and the cold, rigorous, aristocratic Bolkonskys (Andrei's). Tolstoy tells the whole age through them — one family runs on feeling, the other on duty."},
    {k:"Nikolai &amp; Hélène", v:"Nikolai Rostov, Natasha's soldier brother, earnest and ordinary; and Hélène Kuragina, the beautiful, corrupt woman who traps Pierre into a loveless marriage. The novel's pattern of who marries whom is half its moral argument."},
    {k:"Sonya", v:"The poor cousin who does everything right, sacrifices everything, and is rewarded with nothing at all. Tolstoy calls her a sterile flower and moves on. It is the cruellest thing in the book, and probably deliberate."}
  ],
  places:[
    {k:"Petersburg", v:"The salons, where everyone speaks French while a French army marches on the country. Artificial, brilliant, and hollow."},
    {k:"Bald Hills", v:"The Bolkonsky estate. Old Russia: an appalling father, a bullied daughter, a fixed daily routine, and real love underneath it all."},
    {k:"Borodino", v:"One day. Roughly seventy thousand casualties. Tolstoy walked the field himself before writing it."},
    {k:"The road from Moscow", v:"Where Pierre, barefoot, finds what a thousand pages of philosophy could not give him."}
  ],
  terms:[
    {k:"the second epilogue", v:"The forty-page essay on history. Skipped by everyone. Considered essential by the author. Knowing this is the single fastest way to sound like someone who has actually read the book."},
    {k:"the great man theory", v:"The idea that history is driven by Napoleons and Caesars. Tolstoy spends half a million words demolishing it, and he is at least half right."},
    {k:"the hedgehog and the fox", v:"Isaiah Berlin's essay, from the Greek fragment: the fox knows many things, the hedgehog one big thing. His verdict on Tolstoy is the best single sentence written about him."},
    {k:"the patronymic", v:"Ivan's son is Ivanovich; his daughter is Ivanovna. Once you know that, half of Russian literature stops being confusing."}
  ],
  context:`
  <p class="lede">He was writing about 1812 from fifty years' distance — the distance between us and the 1970s.</p>
  <p>His own father had fought in that war. Veterans were still alive, and he interviewed them. He walked the battlefield at Borodino with a notebook. And his wife Sofya copied the manuscript out by hand, night after night by candlelight, deciphering handwriting only she could read, while raising their children.</p>
  <p><span class="legend">disputed</span> Everyone says she copied the whole novel out <em>seven times.</em> The claim is everywhere — and what her son Ilya actually wrote was that she copied <em>parts</em> of it seven times. The real figure is unknown and probably enormous. Knowing the story is inflated is worth more than the story.</p>
  <p>He was in his late thirties, at the height of his powers, and he did not yet believe any of the things that would later make him famous. Afterwards he had a religious crisis, renounced this book as a work of vanity, gave away his copyrights, dressed as a peasant, and died in a railway station at eighty-two, running away from home.</p>`,
  echoes:[
    {k:"→ The Iliad", to:"iliad", v:"He was consciously writing a modern one. Isaac Babel said that if the world could write by itself, it would write like Tolstoy — which is exactly what people have always said about Homer."},
    {k:"→ Pride and Prejudice", to:"pride-prejudice", v:"The marriage plot, intact, with an invasion running through it. Natasha is Elizabeth Bennet with the walls taken down and the war let in."},
    {k:"→ The Brothers Karamazov", to:"karamazov", v:"The two poles of the Russian novel, and of the novel itself. Tolstoy sees the surface of life more clearly than anyone who has ever lived. Dostoevsky sees what is underneath it. Nobody has ever had both."},
    {k:"→ Nicomachean Ethics", to:"nicomachean-ethics", v:"Pierre's search ends where Aristotle said it would: not in a doctrine, but in a way of living, arrived at by practice and by suffering rather than by thought."},
    {k:"→ Ulysses", to:"ulysses", v:"The other total book. Tolstoy gives you a whole society over seven years; Joyce gives you one mind for one day. Both are claiming the novel can hold everything."}
  ]
}

"ovid": {
  file:"00.2", title:"Metamorphoses", author:"Ovid", date:"AD 8",
  form:"Background layer · fifteen books · 250 stories",
  read:"Brief: 5 min",
  spineLabel:"What you actually need",
  oneline:"This is where the pictures come from. Dante, Shakespeare and Milton all assume you have read it, the same way they assume you have read Genesis.",
  spine:`
  <p class="lede">Not a book of Greek myths. A <b>Roman poem</b> — fifteen books, two hundred and fifty stories, running from the creation of the world to the death of Julius Caesar — and the only rule is that <em>everything turns into something else.</em></p>
  <p>The stories are the ones you already half-know, and this is where they got their final shape:</p>
  <p><b>Daphne</b>, fleeing Apollo, turning into a laurel tree while he still has his hands on her. <b>Narcissus</b>, unable to leave his own reflection, dying beside it, becoming a flower — and <b>Echo</b>, who can only repeat what other people say. <b>Icarus</b> and the wings and the sun. <b>Midas</b> and the golden touch. <b>Pygmalion</b>, who carves a woman and wakes her up. <b>Orpheus</b>, who turns around. <b>Actaeon</b>, who sees a goddess bathing and is turned into a stag and torn apart by his own dogs, who no longer know him.</p>
  <p>And the darker ones, which nobody puts in the children's edition. <b>Arachne</b>, a mortal weaver who beats the goddess Minerva in a contest — with a tapestry depicting, in accurate detail, the gods raping mortal women. Minerva cannot find a flaw in the work, so she destroys it and turns the girl into a spider.</p>
  <p><b>Philomela</b>, raped by her sister's husband, who cuts out her tongue so she cannot tell. She weaves the story into a cloth and sends it to her sister. They take their revenge, and all three of them end as birds.</p>
  <p>The last word of the poem is <em class="g">vivam</em>. <b>I shall live.</b></p>
  <p>Within a year of writing it, Augustus banished him to the edge of the empire, and he died there.</p>`,
  why:`
  <p class="lede">Because this is the image bank, and half of everything else here is drawing on it without saying so.</p>
  <p>Medieval and Renaissance Europe did not learn Greek myth from the Greeks. <b>They learned it from Ovid</b> — in Latin, and then in Arthur Golding's 1567 English, which is the version <b>Shakespeare</b> had on his desk. <em>Romeo and Juliet</em> is Pyramus and Thisbe. <em>Titus Andronicus</em> puts Philomela on stage. Milton's Eve, in her first moments alive, sees her reflection in a pool and prefers it — that is Narcissus, moved into Genesis, on purpose. Dante meets Ovid in Limbo and then, in the pit of the thieves, stops the poem to say: <em>let Ovid be silent — I can do this better.</em></p>
  <p>And there is a sharper reason. Ovid is <b>the anti-Virgil</b>, and they are one generation apart, in the same city, under the same emperor. <em>The Aeneid</em> is the poem Rome wanted: duty, cost, empire, a hero who surrenders everything he loves and obeys. The <em>Metamorphoses</em> is written in the same metre and says that the gods are predators, that power is arbitrary, that the victims are usually women, and that <b>nothing keeps its shape.</b></p>
  <p>Two Augustan poets. One regime. Two verdicts. We inherited Virgil's as the official one and Ovid's as the fun one, and that is exactly backwards.</p>`,
  sticky:[
    {h:"Daphne turns into a tree while he is still holding her.", p:"The first love story in the poem is an attempted rape that fails only because the girl becomes <em>wood</em>. And Apollo, entirely undeterred, presses his hand to the bark, feels her heart still beating under it, and announces that she will be <b>his tree</b> — which is why poets and generals wear laurel. He is still wearing her."},
    {h:"Narcissus and Echo.", p:"She is cursed to repeat only the ends of other people's sentences. He is cursed to love only himself. They are on the same page, and two words in your language came out of it — and note which one we kept as a compliment and which one we kept as a diagnosis."},
    {h:"Arachne weaves the truth, and is destroyed for it.", p:"A mortal girl out-weaves the goddess — and the winning tapestry is a detailed, accurate catalogue of the gods raping mortal women. Minerva can find <em>no flaw in the work.</em> So she tears it up and turns the girl into a spider. Ovid put that in a poem, in Augustus's Rome, deliberately."},
    {h:"Philomela weaves the story of her own rape.", p:"Tereus rapes her and cuts out her tongue so she cannot accuse him. She has no voice, so she puts it in a cloth, and sends the cloth to her sister. It is the oldest picture we have of <b>testimony surviving the attempt to silence it</b>, and it is two thousand years old, and it is still the one everybody reaches for."},
    {h:"The last word is 'I shall live.'", p:"<em>Vivam.</em> He wrote it, and then Augustus banished him to a freezing town on the Black Sea where nobody spoke his language, and he spent ten years writing letters begging to come home, and he died there. <b>He was right and the emperor was wrong</b>, and it took about fifteen hundred years to become obvious."}
  ],
  idea:`
  <p class="lede">Nothing stays what it is — and in Ovid, the transformation is almost never magic. It is what happens to a body when someone more powerful wants something.</p>
  <p>Count them: Daphne becomes a tree to escape a god. Io becomes a cow because Jupiter is hiding the evidence. Arachne becomes a spider for telling the truth. Actaeon becomes prey for seeing something he wasn't meant to see. Philomela becomes a bird because a man cut her tongue out.</p>
  <p>Portable version: <b>metamorphosis is what power does to people who cannot resist it</b> — and Ovid, who was about to find that out personally, wrote it down first.</p>`,
  wrong:[
    {b:"It is not a collection of Greek myths.", p:"It's a Roman poem, with a design and an argument, written seven hundred years after Homer for an urbane, ironic, imperial audience. Ovid reshaped and in places invented what we now think of as 'the ancient myth.'"},
    {b:"It is not charming.", p:"It is a catalogue of rape, mutilation, and cannibalism, told in the most beautiful Latin ever written — and the beauty is the trap. It is exactly what allows people to read it for four centuries and describe it as delightful."},
    {b:"Nobody knows why he was exiled.", p:"He says only: <em>carmen et error</em> — a poem and a mistake. The poem was probably his how-to guide for seducing married women, published just as Augustus was criminalising adultery. The <b>mistake</b> he never names, and two thousand years of scholars have failed to work it out."},
    {b:"Kafka's Metamorphosis is a different thing.", p:"Different book, different century, no relation beyond the word. If someone says 'Metamorphosis' and means a man waking up as an insect, they are not talking about this."}
  ],
  take:`<p>Ovid is the anti-Virgil, and it destroyed him. Virgil gave Rome the poem it wanted — obedience, sacrifice, the cost worth paying. Ovid, one generation on, wrote a poem in the same metre in which the gods are rapists, the state is dangerous, truthful artists get turned into spiders, and the only law in the universe is that nothing holds its shape. Then the emperor sent him to the edge of the world, and he died there begging. We inherited Virgil as the serious one and Ovid as the entertainment. That is exactly backwards.</p>`,
  counter:`<p>Ovid-as-dissident is a flattering invention, and he almost certainly wasn't one. He was a wildly successful society poet who wrote a seduction manual in a city where the emperor had just made adultery a crime, and then did something else stupid that we cannot identify. The <em>Metamorphoses</em> is playful, virtuosic, and frequently frivolous, and reading it as a coded indictment of tyranny flatters us at least as much as it flatters him.</p>
  <p>And notice the shape of that take, because it is the same shape I have reached for in nearly every file in this app: the sceptical, cost-counting, against-the-powerful reading. It may well be right here. It is also <b>my reflex</b>, and you should discount it accordingly.</p>`,
  people:[
    {k:"Ovid", v:"Publius Ovidius Naso. Rich, funny, fashionable, and the most naturally gifted poet in Latin. Exiled at fifty and never allowed back."},
    {ref:"augustus", here:"Legislates morality with one hand and destroys the poet of pleasure with the other. He never explained the exile."},
    {k:"Apollo &amp; Daphne", v:"The god and the tree. Bernini carved the moment — her fingers already sprouting leaves — and it is the most famous thing in the Villa Borghese."},
    {k:"Arachne", v:"The weaver. The patron saint of every artist who told the truth about power and got flattened for it."},
    {k:"Philomela, Procne &amp; Tereus", v:"The rape, the severed tongue, the woven cloth, the revenge, and the three birds. The most brutal story in classical literature and the least often reprinted."},
    {k:"Pygmalion", v:"Carves an ideal woman out of ivory and prays her into life. Every story about a man who builds a woman — <em>My Fair Lady</em>, <em>Frankenstein</em>, most of what people now write about AI — comes out of this page."},
    {k:"Orpheus", v:"Turns around. That is the whole thing. Two thousand years of art on a single glance."},
    {k:"Baucis &amp; Philemon", v:"The poor old couple who fed the disguised gods and were rewarded by being turned into two trees, intertwined. Note what <b>Goethe</b> does with them: in <em>Faust</em>, a developer has them killed to improve his view. He expected you to know this page."},
    {ref:"tiresias", here:"Ovid tells the origin the tragedians never do: seven years lived as a woman, then the verdict that women enjoy love more, then Juno's blinding and Jupiter's gift of prophecy in recompense."},
    {ref:"minerva", here:"Weaves against the mortal Arachne, can find no flaw in the girl's truthful tapestry, and turns her into a spider out of spite."},
    {ref:"diana", here:"The hunter Actaeon glimpses her bathing; she turns him into a stag, and his own hounds tear him apart."},
    {ref:"jove", here:"The poem's chief predator: most transformations begin with Jove wanting a mortal woman and taking a disguise to reach her."},
    {ref:"venus", here:"In Ovid's telling she brings the ivory statue to life for Pygmalion, and turns the story toward tenderness rather than terror."},
    {k:"Actaeon", v:"A young hunter who accidentally sees the goddess Diana bathing. She turns him into a stag; his own fifty hounds, no longer knowing him, run him down and tear him to pieces while he weeps, unable to speak. Ovid's picture of a punishment wholly out of proportion to the crime."},
    {k:"Narcissus & Echo", v:"He falls in love with his own reflection in a pool and dies unable to leave it, becoming the flower that bears his name. She, cursed to repeat only others' last words, wastes away loving him until only her voice is left. Two of the most-used words in English, born on one page.", to:"paradise-lost"},
    {k:"Midas", v:"The king granted his wish that everything he touch turn to gold — then unable to eat, drink, or embrace his daughter without killing her. The oldest parable of getting exactly what you asked for."},
    {k:"Icarus & Daedalus", v:"The inventor Daedalus builds wings of wax and feathers to escape imprisonment; his son Icarus, thrilled, flies too near the sun, the wax melts, and he falls into the sea. The father can only watch. The image of ambition outrunning limit."},
    {k:"Orpheus & Eurydice", v:"The musician whose playing could move stones descends to the underworld to reclaim his dead wife, wins her release on one condition — do not look back until you reach the light — and, a step from safety, looks. He loses her twice. The whole story turns on a single glance."},
    {k:"Arthur Golding", v:"Translated the poem into English in 1567. That translation — not the Latin — is the Ovid that Shakespeare read and mined for a dozen plays. Ezra Pound called it the most beautiful book in the language."}
  ],
  places:[
    {k:"Rome", v:"At its most sophisticated, most confident, and most censorious. Ovid was the wittiest man in it, until he wasn't."},
    {k:"Tomis", v:"His exile — a cold garrison town on the Black Sea, in what is now Romania, where nobody spoke Latin and the river froze. He wrote home for ten years. Nobody let him back."},
    {k:"The Villa Borghese", v:"Where Bernini's <em>Apollo and Daphne</em> stands. If you ever want to feel what this poem does, stand in front of it for two minutes."}
  ],
  terms:[
    {k:"metamorphosis", v:"Not a magic trick. In Ovid it is what happens to you when something stronger than you wants something, and there is nowhere left to run."},
    {k:"carmen et error", v:"'A poem and a mistake.' The only explanation he ever gave for the thing that ended his life."},
    {k:"vivam", v:"'I shall live.' The last word of the poem, and — as it turned out — correct."},
    {k:"narcissism / echo", v:"Two ordinary English words that are, in fact, footnotes to one page of a Roman poem."},
    {k:"the laurel", v:"Poet laureate. Nobel laureate. Caesar's crown. All of it is Daphne, still running."}
  ],
  context:`
  <p class="lede">He finished it around AD 8. In the same year, Augustus destroyed him.</p>
  <p>The exile was to Tomis, on the Black Sea — the far edge of the empire, cold, dangerous, and Latin-less. He was about fifty. He wrote begging poems for a decade, first to Augustus and then to Tiberius, and neither of them relented, and he died out there.</p>
  <p>He claimed to have burned his own copy of the <em>Metamorphoses</em> before he left. It made no difference: it was already all over Rome. That is the last joke in the story, and it is on the emperor.</p>`,

    {k:"→ The Aeneid", to:"aeneid", v:"The other Augustan poem. Same city, same metre, same emperor, opposite verdict. Read them as a pair or you have read neither."},

    {k:"→ Paradise Lost", to:"paradise-lost", v:"Eve's first act on earth is to look into a pool and fall for her own reflection. Milton is quoting Narcissus, and he expects you to catch it."},
    {k:"→ Faust", to:"faust", v:"Philemon and Baucis — Ovid's rewarded old couple — are murdered by a property developer at the end of Goethe's poem. The horror only lands if you know they were the ones the gods blessed."},
    {k:"→ Oedipus Rex", to:"oedipus-rex", v:"Tiresias is blind because of a fight about sex between Jupiter and Juno. Ovid tells you why. Sophocles never does."}

}

const CLUSTERS = [
  {slugs:["hamlet","quixote","lear"], label:"The same six years",
   note:"Hamlet, then Don Quixote, then King Lear — 1600, 1605, 1606. Cervantes and Shakespeare never met, never read each other, and were making the same discovery in two countries at once: that a person can be a stranger to himself. No numbered list can show you this. Notice also that Hamlet comes <em>first</em>."}
];

function timelineHTML(){
  const ordered = Object.keys(WORKS)
    .filter(s => YEARS[s])
    .sort((a,b) => YEARS[a].y - YEARS[b].y);

  const clusterOf = s => CLUSTERS.find(c => c.slugs.includes(s));
  const rowHTML = s => {
    const w = WORKS[s];
    return `<a class="tl-row" role="link" tabindex="0" data-slug="${s}">
      <span class="tl-yr">${YEARS[s].d}</span>
      <span class="tl-main">
        <span class="tl-t">${w.title}</span>
        <span class="tl-a">${w.author}</span>
      </span></a>`;
  };

  let html = "", done = new Set();
  ordered.forEach(s => {
    if (done.has(s)) return;
    const c = clusterOf(s);
    if (c){
      html += `<div class="cluster"><span class="cl-lbl">${c.label}</span>
        <p class="cl-note">${c.note}</p>
        ${c.slugs.map(x => { done.add(x); return rowHTML(x); }).join("")}</div>`;
      return;
    }
    html += rowHTML(s); done.add(s);
    const g = GAPS.find(g => g.after === s);
    if (g) html += `<div class="gap"><span>${g.label}</span><em>${g.note}</em></div>`;
  });

  return `<div class="col">
    <header class="hero">
      <span class="lbl">The Timeline · ${WORK_COUNT} works · 4,000 years</span>
      <h1>There is no <em>first</em>.<br>There is only <em>when</em>.</h1>
      <p>Numbered lists imply a relay race — first this, then that, each one leading to the next. These works were not written that way. Sorted by when they were actually composed, three things a numbered list hides become visible at once:</p>
      <p><b>Antigone was written before Oedipus Rex.</b> <b>War and Peace was written before Karamazov.</b> And <b>Hamlet, Don Quixote and King Lear happened inside six years</b>, in two countries, between men who never met.</p>
      <div class="rule"></div>
    </header>
    <div class="tl">${html}</div>
    <footer class="lbl">There is no order. There is only when.</footer>
  </div>`;
}

/* ============================================================
   SHELL
   ============================================================ */
const $ = s => document.querySelector(s);
// resolve a row: canonical {ref} entries pull from GLOSSARY; plain {k,v} pass through
function resolveRow(r){
  if (r.ref){
    const g = CANON(r.ref);
    if (!g) return {name:r.ref, equiv:"", side:"", to:r.to, gloss:"(missing)", plain:r.ref};
    const name = g.name || g.gk;
    const gloss = g.v + (r.here ? ` <span class="inwork"><b>In this work —</b> ${r.here}</span>` : "");
    // legacy gk/rom → name + equiv(rom); new schema uses name + equiv + side
    const equiv = g.equiv || g.rom || "";
    const side  = g.side  || (g.rom ? "rom" : "");
    return {name, equiv, side, to:g.to || r.to, gloss, plain:name};
  }
  return {name:r.k, equiv:"", side:"", to:r.to, gloss:r.v, plain:strip(r.k)};
}
function nameHead(rr){
  let core = rr.to
    ? `<a role="link" tabindex="0" data-slug="${rr.to}" class="xlink">${rr.name}</a>`
    : rr.name;
  if (rr.equiv && rr.equiv !== rr.name){
    const tag = rr.side === "gk" ? "Gk" : "Rom";
    const cls = rr.side === "gk" ? "gk2" : "rom";
    core += ` <span class="equiv"><span class="etag ${cls}">${tag}</span> ${rr.equiv}</span>`;
  }
  return core;
}
const rows = a => a.map(r => {
  const rr = resolveRow(r);
  const p = pron(rr.plain);
  return `<li><span class="k">${nameHead(rr)}${p ? `<span class="pron">${p}</span>` : ""}</span>` +
         `<span class="v">${rr.gloss}</span></li>`;
}).join("");

function railHTML(active){

    const kids = w.kids ? `<ol class="sub">${w.kids.map(k=>`<li>${link(k)}</li>`).join("")}</ol>` : "";
    return `<li>${link(w)}${kids}</li>`;
  }).join("");
}
