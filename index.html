"confessions": {
  file:"07", title:"Confessions", author:"Augustine", date:"c. AD 400",
  form:"Autobiography · thirteen books · addressed to God",
  read:"Brief: 5 min",
  spineLabel:"What happens",
  oneline:"The first person in history to write down what it actually feels like to be a person — and he does it in the second person, because he's talking to God, not to you.",
  spine:`
  <p class="lede">A brilliant, ambitious, self-deceiving man from a provincial town in North Africa spends twenty years chasing sex, status, and answers, and finds all three insufficient in ways he cannot stop analysing.</p>
  <p>He is clever early and knows it. He goes to Carthage — <em>where a cauldron of unholy loves seethed and bubbled all around me</em> — and takes a lover at seventeen. He lives with her for thirteen years. They have a son. He never tells us her name.</p>
  <p>He reads Cicero at nineteen and catches fire for philosophy. He joins the Manichees, who explain evil as a rival substance, an invading darkness — which is comfortable, because it means the badness in him is not <em>his</em>. He believes it for nine years, teaches rhetoric, climbs, moves to Rome, then to Milan and the imperial court, and slowly realises the Manichees cannot answer a single hard question.</p>
  <p>Then the Neoplatonists give him the thing he needs: evil is not a substance at all. It is an <b>absence</b> — a hole where good should be. Which means the darkness in him is not an invader. It is his own.</p>
  <p>His mother Monica, who has been praying and weeping and following him across the Mediterranean for two decades, is still there. His career requires a respectable marriage, so he <b>sends the woman away</b>, back to Africa, and keeps the son, and records that his heart was torn and dragging blood — and then takes another mistress while he waits for the bride to come of age, because he cannot do without.</p>
  <p>And then, in a garden in Milan, at thirty-two, weeping under a fig tree, he hears a child's voice from the next house, singing what might be a game: <em class="g">tolle, lege</em> — take up and read. He opens Paul at random. He reads one verse. It is over.</p>
  <p>He is baptised. Monica dies at Ostia on the way home, content. And then — where every modern reader expects the book to end — Augustine writes four more books, about <b>memory</b>, and about <b>time</b>, and about the first chapter of Genesis. Almost nobody reads them.</p>`,
  why:`
  <p class="lede">Before this book, nobody had written an inside.</p>
  <p>The classical world produced biography, memoir, letters, self-praise. What it did not produce was a man sitting down to describe, without flattering himself, <b>what it is like to want the wrong thing and know it.</b> Augustine invents the interior life as a subject: the self-deception, the excuse-making, the wanting and not-wanting of the same object at the same moment, the appalling gap between seeing the good and doing it.</p>
  <p>Everything confessional in the West runs from here. Rousseau, Wordsworth, the memoir, the therapy hour, the journal, the 2 a.m. text you didn't send. All of it descends from a North African bishop deciding that the truest account of himself had to be addressed to <b>someone who already knew.</b></p>
  <p>And it is the answer to the <em>Nicomachean Ethics</em>. Aristotle says: character is habit, so practise. Augustine — who has practised, who has resolved, who has meant it every time — says: <b>I tried that, and the will itself is the thing that's broken.</b> That argument has never been settled and never goes away.</p>`,
  sticky:[
    {h:"He stole pears he didn't even want.", p:"Sixteen, with friends, he robs a neighbour's pear tree — not from hunger, and not because the pears were good. They weren't. He threw them to the pigs. He devotes pages to it, obsessively, because it is the only crime he can find in his life with <b>no motive whatsoever</b> — and a sin with no motive is proof that the will is bent in itself. Every modern account of doing wrong for its own sake starts in that orchard."},
    {h:"'Grant me chastity and continence — but not yet.'", p:"He prayed it. Sincerely. And he tells you he knew, while he was praying it, exactly what he was doing. It is the funniest and most human sentence in Christian literature, and it is fifteen centuries old."},
    {h:"He sent her away, and never tells us her name.", p:"Thirteen years. The mother of his son. Dismissed so he could make a respectable marriage. He writes that his heart was torn and bleeding — and then, in the next breath, that he immediately found another woman, because he could not wait. She goes back to Africa vowing never to know another man, and leaves the book. It is arguably the greatest silence in literature, and he almost certainly did not intend it as one."},
    {h:"Take up and read.", p:"A child's voice in the next garden, singing a phrase he doesn't recognise from any game he knows. He runs to the book and opens it at random and reads a single verse of Paul, and the man he had been for thirty-two years stops."},
    {h:"'What, then, is time? If nobody asks me, I know. If I have to explain it, I don't.'", p:"Book XI. And then he proves that time exists only in the mind: the past is memory, the future is expectation, the present is attention — and there is nothing else. Philosophers have been arguing with him about it for sixteen hundred years, and they have not won."}
  ],
  idea:`
  <p class="lede">You are not one thing. You want and do not want the same thing, in the same instant, and both are you.</p>
  <p>He calls it the <b>divided will</b>, and he takes it from one verse of Paul, and it is the foundation of every psychology the West has had since. Not weakness. Not ignorance. Not a failure of information. A <em>self at war with itself</em> — and, in his account, unable to end the war from the inside.</p>
  <p>Portable version: <b>knowing the good is not sufficient to do it, and neither is trying.</b> That's the claim. Whether you accept the rescue he says is required is a separate question — but the diagnosis has outlived the cure.</p>`,
  wrong:[
    {b:"'Confessions' does not mainly mean confessing sins.", p:"<em>Confessio</em> in Latin also means <b>testimony</b> and <b>praise</b>. The book is simultaneously an admission, a profession of faith, and an act of worship. Reading it as a tell-all is reading a third of it."},
    {b:"It is not an autobiography.", p:"Not in the modern sense. The narrative stops at Book IX. The last four books are an analysis of memory, a demolition of the ordinary idea of time, and a line-by-line reading of Genesis. The book you think you're reading is nine-thirteenths of the book he wrote."},
    {b:"He was not a great libertine.", p:"By the standards of a fourth-century Roman gentleman he was almost dull: one long-term partner, one son, a good career. There are no orgies. The entire scandal is <b>interior</b>, and that is precisely the invention — he is the first person to treat his own inner life as the crime scene."},
    {b:"Original sin is largely his.", p:"It is not spelled out in Genesis. He constructed it — late, in a bitter fight with a British monk called Pelagius who thought people could simply choose to be good. Augustine won, and the West has had a broken will ever since, whether or not it believes in the theology."}
  ],
  take:`<p>The formal discovery in this book has nothing to do with theology, and it's why the form outlived the belief: <b>the truest thing you can say about yourself has to be said to someone else.</b> The Confessions is addressed to God — every page is second person — and that is exactly why it is honest. A diary lies. A diary is where you rehearse your defence. An audience that already knows everything makes the defence pointless, and what's left is the truth.</p>`,
  counter:`<p>And that is precisely the modern move that guts the book: turning a prayer into a technique. Augustine is not deploying a clever rhetorical device for accessing authenticity. He thinks he is being <em>held</em>. Remove the addressee and you do not get a purer, more literary Augustine — you get Rousseau, which is self-display with no judge, and it is unbearable. The honesty everyone admires is not a method. It is a consequence of believing that someone already knows, so there is no point lying. You may borrow the form. Just notice that you have left behind the thing that made it work.</p>`,
  people:[
    {k:"Augustine", v:"Berber, North African, provincial, brilliant, insufferable, and the most influential writer in Western Christianity. Bishop of Hippo. Dies in 430 with the Vandals at the walls."},
    {k:"Monica", v:"His mother — devout, relentless, and the co-author of his conversion. She prays for him for decades, follows him across the Mediterranean, and dies at Ostia just after seeing him become a Christian. Later canonised as a saint; the city in California is named for her. Not simply his mother. Prays, weeps, follows him across the sea, refuses to let go. She is either the heroine of the book or the most successfully suffocating parent in literature, and the honest answer is that Augustine thinks she is the first and the text keeps suggesting the second."},
    {k:"The unnamed woman", v:"Thirteen years, one son, no name. She is dismissed in a sentence and mourned in a sentence, and every reader since has noticed the hole."},
    {k:"Adeodatus", v:"'Given by God.' The son. Brilliant, Augustine says. Dies at seventeen, and gets about a paragraph."},
    {k:"Ambrose", v:"Bishop of Milan. Reads <em>silently</em>, which astonishes Augustine enough that he records it — one of our best pieces of evidence that silent reading was strange in the ancient world."},
    {k:"Cicero", v:"His <em>Hortensius</em>, now lost, is what set Augustine on fire at nineteen. The book that changed everything is a book we no longer have."},
    {k:"Pelagius", v:"The opponent. Held that human beings can simply choose to be good without divine help — which is roughly Aristotle's position, restated in Christian terms. He lost, and was condemned, and the West's picture of the self was fixed by the verdict."}
  ],
  places:[
    {k:"Thagaste", v:"His home town in Roman North Africa — modern Algeria. He is not a European, and it is worth remembering how thoroughly the map has been redrawn since."},
    {ref:"carthage", here:"Where the young Augustine studied, sinned, and wept over Dido's death in the <em>Aeneid</em> — later flagellating himself for crying at a poem while ignoring his own soul."},
    {k:"The garden in Milan", v:"Where it happens. A fig tree, a child's voice, a book of Paul, and one verse."},
    {k:"Ostia", v:"The port. Where he and Monica have a shared vision at a window, and where she dies days later. He weeps, and then is ashamed of weeping, and then writes about the shame."},
    {k:"Hippo", v:"His bishopric for thirty-five years. He dies in it, under siege, as the Roman world ends around him."}
  ],
  terms:[
    {k:"the divided will", v:"To want and not want the same thing at once. From Paul, Romans 7. The engine of everything after."},
    {k:"concupiscence", v:"Disordered desire — wanting things in the wrong order and the wrong amount. Not merely lust; the whole appetite pointed at the wrong objects."},
    {k:"privation", v:"Evil as an <em>absence</em> of good rather than a thing in itself — the Neoplatonic idea that gets him out of Manichaeism and lets him take responsibility."},
    {ref:"grace", here:"The precise point where Augustine parts company with the philosophers: help you did not earn, versus character you had to build."},
    {k:"'our heart is restless until it rests in you'", v:"Book I, first page. The entire thesis, delivered before the story starts."},
    {k:"tolle lege", v:"'Take up and read.' Two words, and a life turns."}
  ],
  context:`
  <p class="lede">Written as the classical world was ending, by a man who is both its last great inheritor and the architect of what replaced it.</p>
  <p>Rome was sacked in 410 — the unthinkable happening to people who had thought it unthinkable — and Augustine wrote <em>The City of God</em> in response. He died in 430 while the Vandals besieged his own city. The <em>Confessions</em> comes just before all of that: the private book, written around 400, by a man who had no idea he was standing at the hinge.</p>
  <p>He is the bridge. Plato goes into him, and Christianity comes out.</p>`,
  echoes:[
    {k:"→ The Symposium", to:"symposium", v:"Augustine and Monica at Ostia, rising 'step by step' past all created things toward God, is Diotima's ladder in Christian dress — longing for the eternal, climbing past the world that only points to it."},
    {k:"→ Meditations", to:"meditations", v:"The other answer to the rescue question. Marcus: reason is enough, fix your own judgments. Augustine: the will is broken and only grace can mend it. Stoic self-sufficiency against Christian surrender."},
    {k:"→ Montaigne", to:"montaigne", v:"Montaigne inherits Augustine's inward gaze and removes the altar — self-examination with no God as audience and no salvation at the end. The secular sequel to the Confessions."},
    {k:"→ The Republic", to:"republic", v:"He is a Platonist who found a church. The Forms become thoughts in the mind of God; the Cave becomes the world; the Good becomes God. The Republic is his intellectual furniture."},
    {k:"→ Nicomachean Ethics", to:"nicomachean-ethics", v:"The great argument of the whole shelf. Aristotle: practise, and you will become good. Augustine: I practised, and the will is the broken part."},
    {k:"→ The Aeneid", to:"aeneid", v:"He wept over Dido as a boy and never forgave himself. The most quoted self-accusation in the book is about crying at a poem."},
    {k:"→ The Bible", to:"bible", v:"Paul's divided will, and the Psalms — which give him the second-person voice the whole book is written in."},
    {k:"→ Dante", to:"dante", v:"The interior journey, the guide, the confession, the tears, and the woman who is also the way up."},
    {k:"→ Everything confessional since", v:"Rousseau, Wordsworth, Dostoevsky, memoir, therapy, the personal essay. All of it is this book with the addressee removed."}
  ]
},

"dante": {
  file:"08", title:"The Divine Comedy", author:"Dante Alighieri", date:"c. 1308–1321",
  form:"Epic poem · 100 cantos · in Italian",
  read:"Brief: 6 min",
  spineLabel:"What happens",
  oneline:"A bankrupt exile with a death sentence writes a poem in which he tours the entire universe, meets God, and puts his enemies — including a pope who isn't dead yet — in Hell.",
  spine:`
  <p class="lede">Easter week, 1300. A man of thirty-five — halfway through the biblical lifespan — finds himself lost in a dark wood, and cannot get out.</p>
  <p>Three beasts block the path. Then a figure appears: <b>Virgil</b> — in person, stepped out of his own epic — sent to guide him, because the direct route is closed and the only way up is down.</p>
  <p><b>Inferno.</b> They descend through nine circles, a funnel to the centre of the earth. The sins are sorted, and the filing system is <em>Aristotle's</em>: appetite at the top (lust, gluttony, greed, rage), then violence, then — worse than violence, because it perverts the one faculty that makes us like God — <b>fraud</b>. And at the very bottom, treachery, in ice.</p>
  <p>Every punishment is a <em class="g">contrapasso</em>: a picture of the sin itself. The lustful are blown on a wind forever, because that is what passion did to them. The fortune-tellers have their heads twisted around backwards, so they walk forward weeping down their own spines, having tried to see ahead. Satan is at the centre — not burning, but <b>frozen</b>, stuck at the waist, weeping from six eyes, chewing Judas in one of three mouths, and beating six wings whose wind is what keeps the ice frozen. He is the engine of his own prison, and he never speaks.</p>
  <p><b>Purgatorio.</b> They climb out the other side of the world onto a mountain, and everything changes. Here there is <em>time</em>, and effort, and hope. The souls <b>want</b> to be here. They are being sanded down, terrace by terrace, and they sing.</p>
  <p>At the top, in the earthly paradise, Virgil vanishes — a pagan cannot go further — and <b>Beatrice</b> arrives. And she does not comfort him. She tears him apart in public, forces him to confess, and calls him by name. It is the only time the word 'Dante' appears in fourteen thousand lines, and it is an accusation.</p>
  <p><b>Paradiso.</b> Up through the spheres, into light that language keeps failing to hold, until the last vision: three circles, and inside them, a human face. The poem ends on the word <em>stars</em> — as all three of its parts do.</p>`,
  why:`
  <p class="lede">It is the total integration of everything you have read so far, and it is one object.</p>
  <p>Aristotle's ethics is the floor plan of Hell — Dante says so out loud in Canto XI, pausing the story to cite the <em>Nicomachean Ethics</em> by name. Virgil is the guide, in person, and the underworld of <em>Aeneid</em> VI is the architectural template. The Bible is the frame. Augustine's divided self is the mechanism inside every damned soul. Plato is in the light. Nothing in the medieval mind is left out, and none of it is decoration.</p>
  <p>And the formal risk is enormous: he wrote it in <b>Italian</b>, not Latin — the language people actually spoke, which serious writers did not use — and in doing so he invented Italian as a literary language. He also put <em>himself</em> in it, as the protagonist, with his own soul as the stake, which nobody had done.</p>
  <p>T. S. Eliot: Dante and Shakespeare divide the modern world between them; there is no third.</p>`,
  sticky:[
    {h:"He puts a living pope in Hell.", p:"Boniface VIII was still alive in 1300, so Dante has a damned soul <em>prophesy his arrival</em> and holds the slot open for him. The poem is, among many other things, an act of revenge by a man who had been sentenced in his absence to be burned alive if he ever came home."},
    {h:"Contrapasso.", p:"The fortune-tellers walk with their heads screwed on backwards, sobbing down their own backs. The flatterers are immersed in excrement. The schismatics — who divided others — are sliced open and heal, and are sliced open again. The punishment is not a penalty. It is a <b>portrait</b>."},
    {h:"The bottom of Hell is ice, and Satan is silent.", p:"Everyone expects fire. It's frozen. Satan is trapped at the waist in a lake of ice, weeping, and the six wings he beats to escape are what freeze it. He has three faces and three mouths and in them he chews Judas, Brutus, and Cassius forever, and he does not say one word in the entire poem."},
    {h:"Beatrice arrives and destroys him.", p:"He has climbed out of Hell and up a mountain to see her. She appears — and immediately, publicly, indicts him: for his failures, his cheap loves, his wasted years. She makes him weep until he faints. He met the real woman perhaps twice in his life. She died at twenty-four."},
    {h:"Every part ends on the word 'stars.'", p:"<em>Stelle.</em> Hell ends with them, Purgatory ends with them, Paradise ends with them — and the very last line of the poem is 'the love that moves the sun and the other stars.' He came up out of the pit to see them again, and he tells you so three times."}
  ],
  idea:`
  <p class="lede">Hell is not a punishment inflicted on you. It is what you made yourself into, continued forever.</p>
  <p>Nobody in Dante's Hell is being tortured by an external agent. They are simply <b>being what they chose</b>, permanently, with the pretence removed. The gate stands open. Nobody leaves.</p>
  <p>Which means this poem is Aristotle's <em>hexis</em> — the settled disposition built by repetition — taken to its terminus. Character is habit; habit hardens; and eternity is just the last state, held. <b>Hell is a habit that finished setting.</b></p>`,
  wrong:[
    {b:"'Divine' isn't his.", p:"He called it the <em>Comedy</em> — a comedy because it ends well and is written in common speech, not because it is funny. Boccaccio added the 'Divine' later, and it stuck."},
    {b:"Beatrice was not his wife.", p:"He married Gemma Donati, had children with her, and does not mention her <b>once</b> in fourteen thousand lines. Beatrice was a real Florentine woman he saw at nine, saw again at eighteen, may have spoken to twice, and who married someone else and died at twenty-four."},
    {b:"Virgil doesn't get to stay.", p:"The wisest, kindest, most patient figure in the poem is <em>damned</em> — parked in Limbo, no torment, no hope, forever, for the crime of having been born before Christ. Dante clearly finds this unbearable. He does it anyway. It is the hardest fact in the book and he does not flinch from it."},
    {b:"It is not mainly about the afterlife.", p:"It is about <b>Florence.</b> A large fraction of Hell is local politics, settled scores, and men Dante knew personally. He is writing from exile, broke, with a death sentence, and it shows on every page."}
  ],
  take:`<p>The reason the <em>Inferno</em> eclipses the other two thirds isn't that it's better. It's that damage is easier to picture than joy, and Dante says so himself, apologising over and over that language cannot hold what he saw. But the poem's actual subject is <b>Purgatory</b> — the only one of the three worlds where time exists, where effort changes anything, where people are still becoming something. Hell is a museum of finished people. Purgatory is where the living actually are, and it is the part nobody reads.</p>`,
  counter:`<p>The trouble is that this is not the poem he wrote. Dante did not spend fourteen years and fourteen thousand lines in exile to arrive at self-improvement. The entire apparatus is aimed at the <b>Paradiso</b>, at something he insists actually happened to him and repeatedly says he cannot describe. Routing around the destination because you find it less vivid than the pit is reading a pilgrimage as a walking tour. His claim is not that the journey is the meaning. It is that there is somewhere to <em>arrive</em> — and that when you get there, it has a human face.</p>`,
  people:[
    {k:"Dante", v:"Florentine, exiled in 1302 on fabricated corruption charges, sentenced to be burned alive if he returned. He never returned. He wrote the poem on other men's floors."},
    {k:"Virgil", v:"The author of the <em>Aeneid</em>, walking and talking. Guide, teacher, protector — and damned. He must be left behind, and the moment Dante turns to speak to him and finds him gone is one of the great losses in literature."},
    {k:"The three realms", v:"The poem's architecture: <em>Inferno</em> (Hell, a funnel of nine descending circles), <em>Purgatorio</em> (Purgatory, a mountain climbed to be cleansed), and <em>Paradiso</em> (Heaven, nine ascending spheres to God). One hundred cantos, three realms, one week at Easter, 1300."},
    {k:"Beatrice", v:"Theology, in the shape of a girl he barely met. She replaces Virgil because reason can only take you so far, and then something else must."},
    {k:"Francesca", v:"Canto V. Adulterous lovers blown on the eternal wind, still together. She explains that they fell in love while reading a romance aloud — <em>and that day we read no further.</em> Dante faints from pity, and the whole poem's problem is contained in that faint: he agrees with the sentence and cannot bear it."},
    {k:"Ulysses", v:"Canto XXVI, a flame that speaks. In Dante's version — invented, because he had never read Homer — Ulysses <b>never goes home.</b> He sails past Gibraltar into the empty Atlantic out of pure hunger to know, telling his crew they were not made to live like brutes. Five months later a whirlwind takes them. He is in Hell for it, and it is impossible not to hear Dante's fear about himself in it."},
    {k:"Charon &amp; the classical damned", v:"Dante fills his Christian afterlife with pagan machinery — Charon the ferryman of the dead, Minos who judges sinners, the river Styx. The old myths survive as the furniture of Hell."},
    {k:"Satan (Dante's)", v:"Not the eloquent rebel Milton will later invent. Dante's Satan is frozen to the waist in ice at the very bottom of Hell, weeping from six eyes, mindlessly chewing the three worst traitors in history. Evil here is not grand — it is frozen, stupid, and silent."},
    {k:"Count Ugolino", v:"Canto XXXIII, frozen, gnawing the skull of the man who locked him in a tower with his children and let them starve. His account of what happened in that tower ends with a line that has been argued about for seven hundred years: <em>then hunger did what grief could not.</em>"},
    {k:"Boniface VIII", v:"The pope. Alive at the time the poem is set, and already assigned a hole."}
  ],
  places:[
    {k:"The dark wood", v:"Where it starts. Midway through the journey of our life — <em>our</em>, not <em>my</em>. He means you as well."},
    {k:"The gate", v:"'Abandon every hope, you who enter.' The most famous sign in literature."},
    {k:"Limbo", v:"A noble castle, a green meadow, and quiet sighing. Homer, Aristotle, Plato, Socrates, Saladin, Averroes, and Virgil live there — no fire, no punishment, and no hope, forever. Dante's whole education is in that room, and he has to walk out of it."},
    {k:"Mount Purgatory", v:"An island mountain in the southern hemisphere, made of the earth that was displaced when Satan fell. The only geography in the poem that is <em>going somewhere</em>."},
    {k:"Florence", v:"The city that exiled him. He died of malaria in <b>Ravenna</b> in 1321, and Florence has been trying to get the body back ever since — in 1396, in 1429, and in 1519, when a Medici pope sent a delegation to collect it. They opened the tomb and it was <b>empty</b>: the friars had quietly removed the bones through a hole in the wall. In 1830 Florence built him a magnificent tomb in Santa Croce anyway. <b>It has stood empty for two hundred years.</b>"}
  ],
  terms:[
    {k:"contrapasso", v:"The punishment as an image of the sin. Dante's invention, and the reason the Inferno is unforgettable."},
    {k:"terza rima", v:"aba, bcb, cdc — an interlocking chain that can never be closed off cleanly. He invented it, and it is almost impossible in English, which is why every translation is a compromise."},
    {k:"the vernacular", v:"He wrote it in Tuscan, not Latin. Serious men did not do this. It is why modern Italian exists, and why Italians can still read it."},
    {k:"Guelphs and Ghibellines", v:"The two factions tearing Florence apart — papal and imperial. Dante was a White Guelph, and the Blacks won, which is the reason for everything."},
    {k:"'nel mezzo del cammin di nostra vita'", v:"'Midway upon the journey of <em>our</em> life.' Six words, and you are implicated."}
  ],
  context:`
  <p class="lede">Written by a man with nothing left. Exiled at thirty-seven, condemned to death in absentia, dependent on the charity of other men's households for the rest of his life.</p>
  <p>He wrote about how salty another man's bread tastes, and how hard it is to climb another man's stairs. He was offered a way home once, on humiliating terms — a public penance — and refused it, and stayed out, and died out. And in that condition he built the most complete and confident architecture in European literature, a universe in perfect order, with a place for every soul and a reason for every place.</p>
  <p>A man whose own city had thrown him into chaos wrote the most orderly poem ever made. It is worth sitting with that for a second.</p>`,
  echoes:[
    {k:"→ The Symposium", to:"symposium", v:"Diotima's ladder of love, made Christian and given a face: Dante's love for Beatrice becomes the force that lifts him through Paradise to God — the erotic ascent of the Symposium with a name on the bottom rung."},
    {k:"→ The Aeneid", to:"aeneid", v:"Virgil is not an influence here. He is a <em>character</em>, and Aeneid VI is the blueprint for the descent."},
    {k:"→ Nicomachean Ethics", to:"nicomachean-ethics", v:"Inferno XI stops the poem to explain that Hell is organised according to Aristotle. The architecture of damnation is a reading list."},
    {k:"→ Confessions", to:"confessions", v:"The confessional first person, the tears, the woman who is the way up, the interior journey as the real one."},
    {k:"→ The Odyssey", to:"odyssey", v:"Dante had never read Homer, and invented a Ulysses who refuses to stay home and drowns for it. Tennyson took <em>that</em> Ulysses, not Homer's."},
    {k:"→ Paradise Lost", to:"paradise-lost", v:"Milton's Satan is the answer to this one. Dante's is frozen, mute, and pathetic. Milton gives him a voice — and the argument between those two Satans is the whole argument about evil."}
  ]
}

"meditations": {
  file:"04.5", title:"Meditations", author:"Marcus Aurelius", date:"c. AD 170–180",
  form:"Philosophy · Stoic notebook · twelve books",
  read:"Brief: 5 min",
  spineLabel:"What it is",
  oneline:"The private journal of a Roman emperor, written in a war tent and never meant for anyone's eyes — the most powerful man alive reminding himself, night after night, that almost nothing is under his control.",
  spine:`
  <p class="lede">Not a book. A notebook — the private, unpublished diary of <b>Marcus Aurelius</b>, emperor of Rome, written in Greek, to himself, in army camps on the frozen Danube frontier, while fighting a war and a plague at once.</p>
  <p>He never titled it, never shared it, never prepared it for anyone. The Greek name we give it, <em>Ta eis heauton</em>, just means <b>'to himself.'</b> It survived by pure accident. What it records is the most powerful person on earth, at the end of long days of war and administration, talking himself back into sanity using one idea.</p>
  <p>The idea, inherited from the ex-slave philosopher <b>Epictetus</b>, is a hard line drawn straight through the middle of your life: <b>some things are up to you, and some are not.</b> Up to you: your judgments, your choices, what you decide things mean. Not up to you: your body, your reputation, your standing, other people, the past, the future, whether you live to morning. Peace comes from wanting only the first kind and releasing your grip, completely, on the second.</p>
  <p>So he writes himself reminders. That the man who wronged you was only doing what he thought was good. That fame is noise you won't hear once you're dead. That you could leave life right now. That the obstacle is the way. That the whole cosmos is one thing, and you are a small rational part of it doing its small part. Over and over, for twelve books, the emperor tells himself to <b>stop wanting the world to be other than it is.</b></p>`,
  why:`
  <p class="lede">Because it is the third answer to the question this whole shelf keeps asking — <em>can you fix yourself, or must you be rescued?</em> — and it is neither.</p>
  <p>Aristotle says you build a good character slowly, by practice, over a lifetime, with some luck and good circumstances required. Augustine says you can't — the will is broken, and only God's grace can mend it. The Stoic says: <b>you are asking the wrong question.</b> You do not need to be built or rescued, because the only thing that was ever truly yours — your own judgment — is already entirely in your power, right now, this second. You are not broken. You are just gripping the wrong things.</p>
  <p>And there is the fact that makes it unique in this collection. Plato spent the <em>Republic</em> dreaming of a <b>philosopher-king</b> — the impossible ruler who is wise and does not want power. Marcus Aurelius is the one time in recorded history it actually happened: a genuine philosopher who was handed absolute power over seventy million people. The <em>Meditations</em> is the record of what that was like from the inside — and it is mostly exhaustion, duty, and the daily effort not to become a monster. The dream came true exactly once, and this is the diary.</p>`,
  sticky:[
    {h:"The most powerful man alive spent his nights reminding himself he controlled almost nothing.", p:"There is no stranger book. An emperor who could have anything writes, again and again, that he can keep nothing — not his body, not his throne, not tomorrow, not the good opinion of a single soul. The only thing he owns is what he does with his own mind. It is the opposite of what power is supposed to feel like, written by the man with the most of it."},
    {h:"'You have power over your mind — not outside events.'", p:"The most quoted line, and the whole system in one sentence. Everything that hurts you, the Stoic claims, is not the event but your <em>judgment</em> about the event — and the judgment is the one thing you can change. Twenty centuries later this became the core mechanism of cognitive behavioural therapy, more or less unaltered."},
    {h:"Book One is a thank-you list.", p:"The diary opens with the emperor cataloguing what he learned from each person who shaped him — his mother, his teachers, his adoptive father — naming the specific virtue each one gave him. Before any philosophy, gratitude, itemised. It is quietly one of the most moving things in ancient literature."},
    {h:"He wrote it, and then his son wrecked everything.", p:"The philosopher-emperor's heir was <b>Commodus</b> — vain, cruel, and incompetent, the villain of <em>Gladiator</em>, and the end of the golden age of Rome. The one man who actually was Plato's philosopher-king handed the empire to exactly the kind of ruler the whole tradition warns against. The <em>Meditations</em> is serene; history's punchline is not."},
    {h:"It is 1,900 years old and reads like it was written this morning.", p:"Strip the Roman names and the Meditations is indistinguishable from a modern self-help journal — because it is the source most modern self-help is quietly drawing from. Stoicism is, right now, the most alive dead philosophy in the world, and this thin notebook is why."}
  ],
  idea:`
  <p class="lede">Draw one line through everything: what is up to you, and what is not. Then invest your whole self in the first and let go, entirely, of the second.</p>
  <p>Almost all suffering, the Stoic claims, comes from wanting to control things that were never yours — other people, outcomes, reputation, the length of your life — and neglecting the one thing that is: the quality of your own judgment and choice. Fix that boundary in the right place and you become, in the Stoic word, <em>free</em> — not because your circumstances improve, but because you have stopped staking your peace on them.</p>
  <p>Portable version: <b>you don't control what happens; you control what you make it mean</b> — and that, and only that, is where a good life is built.</p>`,
  wrong:[
    {b:"Stoicism is not being emotionless.", p:"The modern word 'stoic' — cold, unfeeling — is almost a slander. The goal is not to kill emotion but to stop being jerked around by false judgments, so that what remains is steadiness, not numbness. Marcus feels grief, exhaustion, and disgust all over the book; he just refuses to be governed by them."},
    {b:"It is not passive resignation.", p:"'Accept what you can't control' is only half of it. The other half is a fierce insistence on doing your duty — acting justly, working hard, showing up — precisely <em>because</em> the action is up to you even when the outcome isn't. Marcus wrote it while personally leading a war, not while withdrawing from one."},
    {b:"It was not written to teach you.", p:"These are not lessons for a reader; there was no reader. They are one man's repeated attempts to make himself believe things he already knew but kept failing to live by. The repetition that can feel tedious is the whole point: this is a person practising, not a teacher explaining."},
    {b:"The emperor was not a plaster saint.", p:"He persecuted Christians, kept the machinery of slavery and conquest running, and chose a catastrophic heir. The serenity on the page coexists with an ordinary Roman ruler's cruelties. Reading him as a flawless sage is its own kind of mistake."}
  ],
  take:`<p>What makes the Meditations almost unbearably poignant is the gap between the power and the plea. Here is a man who could order anything in the world, writing to himself in the dark, over and over, the way you would coach a frightened friend — be patient, they don't know better, it won't last, you'll be dead soon too, do the right thing anyway. All the power in the world, and the only battle that mattered to him was the one inside his own skull, which he had to fight again every single night. The most powerful person in this entire collection turns out to have wanted exactly what the least powerful wants: to not be ruled by his own mind.</p>`,
  counter:`<p>The seductive reading — Stoic serenity as timeless wisdom for busy moderns — is also how Stoicism gets defanged. Critics have always noted its convenient politics: a philosophy that tells you your circumstances don't matter, only your attitude to them, is a very comfortable creed for an emperor and a potentially paralysing one for the enslaved and the oppressed, who might reasonably want to change their circumstances rather than accept them. 'It's not the event, it's your judgment' can shade into 'stop complaining.' Marcus's inner freedom was underwritten by other people's very external chains. The book is wise; it is also, unavoidably, the wisdom of a man on top.</p>`,
  people:[
    {k:"Marcus Aurelius", v:"Roman emperor from AD 161 to 180, last of the 'Five Good Emperors,' and the only one who was also a serious philosopher. Reluctant, dutiful, and perpetually at war on the frontier — the <em>Meditations</em> is the private voice behind the public statue."},
    {k:"Epictetus", v:"The former slave whose Stoic teaching is the engine of the whole book. Marcus never met him — he read the lecture notes — but the core move, dividing the world into what is and isn't 'up to us,' is Epictetus's, taken straight into the emperor's diary."},
    {ref:"socrates", here:"The distant model behind all of it — the philosopher who feared nothing, questioned everything, and met his own death with calm. Stoicism took Socratic self-mastery and built a system on it."},
    {k:"Commodus", v:"Marcus's son and heir — vain, brutal, and incompetent, later the villain of <em>Gladiator</em>. The philosopher-king's single worst decision, and the hinge on which Rome's golden age turned to decline. Proof that wisdom does not inherit."},
    {k:"Zeno of Citium", v:"The founder of Stoicism, around 300 BC, who supposedly turned to philosophy after a shipwreck cost him everything — and taught in a painted colonnade, the <em>Stoa</em>, that gave the school its name. Marcus is the last great voice of the tradition Zeno began."}
  ],
  places:[
    {k:"The Danube frontier", v:"The war zone where most of the book was written — army camps at Carnuntum and among the Quadi, on the frozen edge of the empire, during the long Marcomannic Wars. The serenity on the page was composed in mud, cold, and plague."},
    {k:"Rome (the empire)", v:"The empire Marcus governed from a distance and mostly from the saddle — seventy million people, an army, a treasury, a plague. The <em>Meditations</em> is what its ruler told himself to stay sane under the weight of it."},
    {k:"The Stoa", v:"Not a place in the book, but the one it comes from: the 'painted porch' in Athens where Zeno first taught. Stoicism is named after a covered walkway — the philosophy of the colonnade."}
  ],
  terms:[
    {k:"the dichotomy of control", v:"The heart of Stoic practice: sorting everything into 'up to us' (our judgments, choices, will) and 'not up to us' (everything else), and investing only in the first. Get the line in the right place and you are free; put it in the wrong place and you suffer."},
    {k:"logos (Stoic)", v:"The rational order the Stoics believed runs through the whole cosmos — reason as the structure of reality itself. To live well is to live 'according to nature,' meaning in agreement with that order rather than fighting it.", to:"bible"},
    {k:"amor fati", v:"'Love of fate' — not merely accepting what happens but embracing it, willing it, treating each event as necessary and right. Nietzsche later took the phrase and made it his own, but the posture is pure Stoic."},
    {k:"memento mori", v:"'Remember you will die.' For the Stoic, not morbid but clarifying: constant awareness of death strips away vanity and fear and forces attention onto what actually matters, now, while there is time."},
    {k:"apatheia", v:"Not apathy — freedom from being <em>controlled</em> by the passions. The Stoic sage still feels, but is no longer dragged around by false judgments about good and bad. Steadiness, not coldness."}
  ],
  context:`
  <p class="lede">Written on campaign at the end of the Roman golden age, lost, and recovered by luck.</p>
  <p>Marcus Aurelius (AD 121–180) inherited a Stoic training and an empire, and spent the last decade of his life defending the Danube frontier against Germanic tribes while a plague — the Antonine Plague — killed millions. The <em>Meditations</em> was composed in those years, in Greek, as private notes to steady himself. He died on campaign in 180, and his death is conventionally marked as the end of the <em>Pax Romana</em>.</p>
  <p>The notebook was never published in his lifetime and could easily have vanished entirely. It survived through a thin chain of manuscripts to its first printed edition in 1559 — after which it slowly became one of the most beloved books in the world. Its current status is strange and telling: a private Roman diary is, right now, one of the best-selling works of philosophy on earth, because Stoicism has become the working creed of a great many people who have never heard of Epictetus.</p>`,
  echoes:[
    {k:"→ Nicomachean Ethics", to:"nicomachean-ethics", v:"The rival account of the good life. Aristotle says virtue needs practice, time, and some external luck — health, friends, fortune. The Stoic says no: virtue alone is enough, it is fully in your power, and you can have it on the rack. Two ancient answers, directly opposed."},
    {k:"→ Confessions", to:"confessions", v:"The rescue question, head on. Marcus: you have everything you need already — reason is enough, fix your judgments yourself. Augustine, two centuries later: no, the will is broken and only grace can save it. Self-sufficiency versus surrender."},
    {k:"→ The Republic", to:"republic", v:"Plato imagined the philosopher-king and thought it nearly impossible. Marcus Aurelius <em>was</em> one — the dream made real exactly once — and the Meditations is the unglamorous view from inside the fantasy: duty, exhaustion, and the daily effort not to be corrupted by power."},
    {k:"→ The Epic of Gilgamesh", to:"gilgamesh", v:"The oldest answer meets a later one. Siduri tells Gilgamesh to stop chasing immortality and love the life he has; Marcus, memento mori in hand, says the same — accept that you will die, and it frees you to live now."}
  ]
}

"montaigne": {
  file:"09.5", title:"The Essays", author:"Michel de Montaigne", date:"1580–1588",
  form:"Essays · three books · 107 attempts",
  read:"Brief: 5 min",
  spineLabel:"What it is",
  oneline:"A French nobleman retires to a tower at 38 and, by writing about himself with total honesty, accidentally invents a whole form of writing — the essay — and the modern secular self along with it.",
  spine:`
  <p class="lede">Not a treatise, not a memoir, not a confession to God. Something genuinely new: a man sitting in a room, watching his own mind work, and writing down what he finds — including that most of it is contradictory, changeable, and unsure.</p>
  <p>In 1571, at <b>thirty-eight</b>, Michel de Montaigne quit public life and shut himself in the tower of his château near Bordeaux, its library of a thousand books, its beams carved with Greek and Latin maxims. He meant to think. What came out instead was a running, lifelong act of self-examination he called <em>essais</em> — <b>'attempts' or 'trials'</b>, because that is all they are: tries, not conclusions.</p>
  <p>He wrote about everything, but always circling back to the only subject he trusted himself on — <em>himself.</em> His kidney stones. His fear of death. His terrible memory. His bowels, his sex life, his cat (<em>'when I play with my cat, how do I know she is not playing with me?'</em>). <b>'I am myself the matter of my book,'</b> he warns the reader on page one, half-apologising.</p>
  <p>The stance under all of it is a question, carved on his medal: <b><em>Que sais-je?</em> — 'What do I know?'</b> Not despair — humility as a method. He distrusts every system, every certainty, every cruelty done in the name of one. Writing through the French wars of religion, with Catholics and Protestants slaughtering each other over doctrine, he keeps insisting that a man who is honestly unsure is less dangerous than a man who is sure.</p>
  <p>He never finished. He kept adding to the essays until he died, layering second and third thoughts over the first, so the book physically grows more uncertain, more qualified, more human, the longer he lives with it.</p>`,
  why:`
  <p class="lede">Because he invented the form you are reading right now — and, arguably, the way you experience being a person.</p>
  <p>Augustine had turned the gaze inward eleven hundred years earlier, but he did it kneeling, addressing God, narrating a single arc from sin to salvation. Montaigne takes the inward gaze and <b>removes the altar.</b> No God as audience, no conversion at the end, no shape at all — just a mind observing itself honestly, changing its opinions, admitting confusion. That is the secular self, and we still live inside it.</p>
  <p>And the influence is direct and traceable. <b>Shakespeare read him</b> in John Florio's 1603 English translation — <em>Hamlet's</em> skeptical, self-watching mind is often laid beside him, and the borrowing in <em>The Tempest</em> and <em>King Lear</em> is a scholarly 'smoking gun': Gonzalo's whole speech about the ideal commonwealth is lifted almost word for word from Montaigne's essay 'Of Cannibals.' Pascal spent his life arguing with him. Descartes built his certainty specifically to answer Montaigne's doubt. The essay itself — the thing every columnist and blogger and student now writes — is his single invention.</p>
  <p>If Thread 04 of this shelf is 'how did people get an inside,' Montaigne is the moment the inside stops needing God to be worth writing down.</p>`,
  sticky:[
    {h:"He invented the word 'essay.'", p:"<em>Essai</em> is French for a try, a test, an attempt — and he chose it precisely because he was <em>not</em> claiming to have the answer. Every essay you have ever been assigned, every op-ed, every personal blog post, descends from a bored nobleman deciding that 'here is my unfinished attempt at thinking about this' was a thing worth writing down. It was a radical act of humility that conquered the world."},
    {h:"'Because it was he, because it was I.'", p:"The great love of his life was his friend Étienne de La Boétie, who died young. Asked why the friendship ran so deep, Montaigne wrote the most famous sentence ever written about friendship: <em>'If you press me to say why I loved him, I feel it can only be expressed by answering: because it was he, because it was I.'</em> No reason. No utility. Just those two particular people. He never got over the loss, and some read the whole vast book as a conversation continued with the dead."},
    {h:"'What do I know?'", p:"His motto — <em>Que sais-je?</em> — struck on a medal beside a balance. In an age of people burning each other alive over religious certainty, he built an entire philosophy out of the sentence 'I might be wrong.' It is the least glamorous and possibly the most useful idea in this whole shelf."},
    {h:"Shakespeare stole from him, and we can prove it.", p:"Gonzalo's utopian speech in <em>The Tempest</em> — no trade, no letters, no magistrate, no wine or corn or metal — is copied, almost phrase for phrase, from Florio's translation of the essay 'Of Cannibals.' It is one of the very few places we can catch Shakespeare with a specific open book on his desk. And the book was Montaigne."},
    {h:"He asked who the real savages were, in 1580.", p:"In 'Of Cannibals,' having heard about the Tupinambá people of Brazil, he flips the whole colonial frame: yes, they eat their dead enemies — but Europeans torture the living, break them on wheels, and burn them at the stake in the name of God, which is worse. 'Each man calls barbarism whatever is not his own custom.' The 'noble savage' starts here — and so, quietly, does cultural relativism."}
  ],
  idea:`
  <p class="lede">The self is not a fixed thing you report on — it is a shifting, contradictory process you can only ever <em>attempt</em> to catch, and honesty about that is worth more than false certainty.</p>
  <p>Montaigne keeps discovering that he does not hold still. He believes one thing in the morning and its opposite at night; he is brave and cowardly, generous and petty, the same man and a different one. Rather than hide this behind a tidy argument, he makes it the subject. The book's form — endless, self-revising, inconclusive — <em>is</em> its philosophy.</p>
  <p>Portable version: <b>'I do not portray being. I portray passing.'</b> He was the first writer to treat a human being as a verb rather than a noun — and the novel, three centuries of it, is essentially that discovery worked out at length.</p>`,
  wrong:[
    {b:"The essays are not essays in the modern school sense.", p:"No thesis, no five paragraphs, no conclusion. They wander, digress, contradict themselves, quote Latin for pages, and stop when he loses interest. The word we inherited from him has become far more rigid than the thing he actually did."},
    {b:"He was not a hermit or a depressive.", p:"He was a working magistrate, twice mayor of Bordeaux, a diplomat trusted by kings on both sides of a civil war. The tower was a retreat, not a cell. The detachment in the writing is a hard-won public man's, not a recluse's."},
    {b:"'Que sais-je?' is not lazy relativism.", p:"His doubt is a discipline, aimed at cruelty and fanaticism, not a shrug. He is skeptical <em>so that</em> he will not kill anyone over an idea — a very different thing from not caring what is true."},
    {b:"He did not think he was inventing anything.", p:"He thought he was a minor nobleman writing self-indulgent notes to pass the time, and repeatedly apologises for the triviality of his subject. He had no idea he was founding a literary form and modelling a new kind of self. The most influential thing here was written by a man who thought it barely mattered."}
  ],
  take:`<p>Montaigne is the quiet hinge of this whole shelf, and the easiest to underrate because he never raises his voice. Homer, Dante, Milton reach for the cosmos; Montaigne reaches for his own kidney stone and his dead friend, and somehow that turns out to be the more radical move. By insisting that one ordinary, changeable, uncertain private self was a fit subject for serious writing — with no God required to justify it — he quietly authorised everything that came after: the novel, the memoir, the personal essay, the entire modern assumption that your inner life is interesting and real. The loudest thing in the modern world was started by the most modest voice in this collection.</p>`,
  counter:`<p>The flattering story — Montaigne as the first modern, the genial skeptic who invented us — can be overdone. He was a slave-era aristocrat of leisure whose famous tolerance had real limits, whose skepticism some read as a convenient way of endorsing the established order (don't rock the boat, since you can't be sure of anything anyway), and whose endless self-attention can tip into the self-absorption he is sometimes accused of fathering in all of us. And crediting one Frenchman with 'the modern self' is exactly the tidy origin-story this app keeps warning you about — the interior was built by many hands over centuries, and Montaigne is a landmark in it, not a sole inventor.</p>`,
  people:[
    {k:"Michel de Montaigne", v:"The author, and his own main character — a Périgord nobleman, magistrate, and twice mayor of Bordeaux who turned self-observation into a literary form. Watches himself for twenty years and reports, with a candour nobody had risked before, that a person is a moving target."},
    {k:"Étienne de La Boétie", v:"Montaigne's beloved friend, a brilliant young magistrate and writer who died of illness at 32 in 1563. His loss is the wound at the centre of the book; the essay 'Of Friendship' is his monument, and some read the entire <em>Essays</em> as a conversation Montaigne could no longer have with him."},
    {ref:"socrates", here:"Montaigne's hero and model — the philosopher who knew that he knew nothing, questioned everything, and wrote none of it down. 'Que sais-je?' is Socratic ignorance turned into a way of life."},
    {k:"John Florio", v:"The Italian-English scholar whose 1603 translation carried Montaigne into English — and onto Shakespeare's desk. Without Florio there is no Montaigne in <em>The Tempest</em> or <em>King Lear</em>, and English has a different word for 'essay.'"},
    {k:"Raymond Sebond", v:"A medieval theologian whose book Montaigne translated, and whose 'defence' became the pretext for his longest, most corrosive essay — the 'Apology for Raymond Sebond,' which defends religion so weakly and doubts human reason so thoroughly that it ends up undermining nearly all certainty. Home of 'Que sais-je?'"}
  ],
  places:[
    {k:"The tower", v:"Montaigne's round library-study in his château near Bordeaux, lined with a thousand books, its ceiling beams carved with Greek and Latin sayings. He retreated here in 1571 to think — and, without planning to, invented a form of writing. One of the most productive rooms in literary history."},
    {k:"Bordeaux", v:"The city Montaigne served as mayor, twice, during the French wars of religion — proof that the great skeptic was also a capable public official, negotiating between Catholic and Protestant factions bent on each other's destruction."},
    {k:"The New World", v:"Brazil, reached only in report and in the persons of three Tupinambá men Montaigne met in Rouen. From that thin contact he wrote 'Of Cannibals' and turned the mirror back on Europe: the true barbarians, he suggests, are the civilised."}
  ],
  terms:[
    {k:"essai", v:"French for 'attempt, trial, test' — and Montaigne's name for what he was doing: trying out thoughts, not delivering verdicts. The entire modern genre of the essay, and its built-in humility, lives in that one chosen word."},
    {k:"Que sais-je?", v:"'What do I know?' — Montaigne's motto and method. Doubt raised to a principle: he is uncertain on purpose, as a guard against the fanatical certainty that was burning his country down."},
    {k:"Pyrrhonism", v:"The ancient Greek skepticism Montaigne revived — the practice of suspending judgment, since every argument can be met by a counter-argument. In his hands it becomes less a doctrine than a temperament: tolerant, curious, and slow to condemn."},
    {k:"the noble savage", v:"The idea — traceable to 'Of Cannibals' — that peoples living closer to nature may be more virtuous than 'civilised' ones. Hugely influential, frequently misused, and later pinned (a little unfairly) on Rousseau. It starts with Montaigne asking who the real barbarians are."}
  ],
  context:`
  <p class="lede">Written in retirement, during a civil war, by a man watching his country tear itself apart over certainty.</p>
  <p>Montaigne (1533–1592) lived through the French Wars of Religion — decades of massacre between Catholics and Protestants, including the St Bartholomew's Day slaughter of thousands. That is the shadow the <em>Essays</em> are written against, and it explains their deepest commitment: a horror of cruelty, and a suspicion of anyone certain enough to kill for an idea.</p>
  <p>He published Books I and II in 1580, added Book III in 1588, and went on annotating his own copy until he died in 1592 — so the book grows more layered and self-questioning to the end. It was placed on the Catholic Index of banned books in the following century, which did nothing to slow it: by then it was already loose in the bloodstream of Europe, remaking how people wrote and, slowly, how they understood themselves.</p>`,
  echoes:[
    {k:"→ Confessions", to:"confessions", v:"Augustine turned the gaze inward first — but on his knees, addressed to God, arced toward salvation. Montaigne keeps the inward gaze and removes the altar. The self becomes worth writing down for its own sake."},
    {k:"→ Hamlet", to:"hamlet", v:"Shakespeare read Montaigne in Florio's translation, and Hamlet's self-watching, skeptical, unresolved mind is the closest thing on stage to an essay thinking itself. The borrowing in <em>The Tempest</em> and <em>Lear</em> is provable; the kinship in <em>Hamlet</em> is everywhere."},
    {k:"→ King Lear", to:"lear", v:"Scholars catch Shakespeare mining Florio's Montaigne for <em>Lear</em> as well as <em>The Tempest</em> — the play's raw questions about nature, cruelty, and 'unaccommodated man' breathe the same air as the essays."},
    {k:"→ Ulysses", to:"ulysses", v:"The endpoint of the road Montaigne opens: if one ordinary private mind, watched honestly as it wanders, is a fit subject for literature, then Joyce's seven hundred pages inside Leopold Bloom's head are the form taken to its limit."}
  ]
}
