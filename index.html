<style>
  :root{
    --ink:#0D1316; --ink-2:#141C21;
    --bone:#E6E4DE;
    --verdigris:#4E9585; --oxblood:#B03A32;
    --bg:var(--ink); --surface:var(--ink-2); --fg:var(--bone); --fg-dim:#94A0A6;
    --rule:rgba(230,228,222,.14); --accent:var(--verdigris); --mark:var(--oxblood);
    --mark-lite:#E08272;
    --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,"Times New Roman",serif;
    --body:"Literata","Charter","Iowan Old Style","Palatino",Georgia,serif;
    --util:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --fs:1;
  }
  html[data-theme="light"]{
    --bg:#DEDCD5; --surface:#E9E7E1; --fg:#141C21; --fg-dim:#5C666B;
    --rule:rgba(20,28,33,.16); --accent:#2F6B5F; --mark:#9A2E27; --mark-lite:#8F2A23;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:calc(17px * var(--fs));line-height:1.65;
       -webkit-font-smoothing:antialiased;transition:background .3s ease,color .3s ease}
  .lbl{font-family:var(--util);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-dim)}
  a{color:inherit}
  ::selection{background:var(--accent);color:var(--bg)}

  .wrap{display:flex;min-height:100vh}
  .rail{width:272px;flex:0 0 272px;border-right:1px solid var(--rule);padding:26px 0 40px;
        position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface)}
  .main{flex:1;min-width:0;padding:0 0 100px}
  .col{max-width:660px;margin:0 auto;padding:0 26px}

  .brand{padding:0 22px 20px;border-bottom:1px solid var(--rule)}

  section{padding:38px 0;border-bottom:1px solid var(--rule)}

  .sheet-body .grp{padding:22px 0 4px}

    color:var(--fg-dim);border:1px solid var(--rule);border-radius:2px;padding:1px 5px}
  .hit .gl{color:var(--fg-dim);font-size:15px;margin-top:4px;line-height:1.5}
  .hit:hover .nm{color:var(--accent)}

  .empty{padding:60px 0;color:var(--fg-dim);font-size:16px;text-align:center}

  @keyframes flash{0%{background:transparent}18%{background:color-mix(in srgb,var(--accent) 26%,transparent)}100%{background:transparent}}

  /* ---------- timeline ---------- */

  /* ---------- homepage ---------- */

  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

<noscript>
  <div style="max-width:640px;margin:64px auto;padding:0 24px;font-family:Georgia,serif;line-height:1.6">

<script>
/* ============================================================
   CONTENT — separated from the shell. Becomes /content/*.js next.
   ============================================================ */
const SEQUENCE = [

const WORK_COUNT = SEQUENCE.filter(w => w.kids).reduce((n, w) => n + w.kids.length, 0);

// Keep every hand-typed corpus count downstream of SEQUENCE so it can't drift.
function syncMasthead(){
  const n = WORK_COUNT;
  const brand = document.querySelector(".brand .lbl");
  if (brand) brand.textContent = `${n} works \u00b7 4,000 years`;
  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute("content", `Briefings on ${n} foundational works of Western literature and philosophy \u2014 Gilgamesh to Joyce. Not a reading list: a 4,000-year argument that never resolves.`);
  const og = document.querySelector('meta[property="og:description"]');
  if (og) og.setAttribute("content", `${n} foundational works, from Gilgamesh to Joyce. Not a reading list \u2014 an argument that never resolves.`);
  // <title> and <noscript> can't be owned at runtime (title is replaced per-view; noscript shows only when JS is off) \u2014 warn if their hand-typed count has drifted.
  const stale = [...document.querySelectorAll("title, noscript")]
    .filter(el => /\b\d+\s+(?:works|foundational)/.test(el.textContent) && !el.textContent.includes(n + " "));
  if (stale.length) console.warn("[Long Argument] corpus-count drift: SEQUENCE has " + n + " works, but a static <title>/<noscript> shows a different number \u2014 update the hand-typed count in index.html.");
}

  <p class="lede">Thebes is dying of plague. Its king, Oedipus, is an outsider who won the throne by answering the riddle of the Sphinx when nobody else could. He is popular, competent, and certain of himself.</p>
  <p>The oracle at Delphi delivers terms: the plague lifts when the murderer of Laius — the previous king — is found and driven out. Oedipus takes the case personally. He curses the killer in public and swears to hunt him down.</p>
  <p>The blind prophet Tiresias arrives and refuses to speak. Oedipus bullies him until he does: <em>you are the man you're looking for.</em> Oedipus decides this is a coup, that Tiresias and his brother-in-law Creon are framing him, and rages on.</p>
  <p>His wife Jocasta tries to calm him by proving prophecy is worthless. Laius was once told his own son would kill him — and yet the baby was left to die on a mountain, and Laius was killed by bandits where three roads meet. That last detail catches. Years earlier, running from an oracle that said he would kill his father and marry his mother, Oedipus killed a man at a crossroads.</p>
  <p>Then a messenger arrives from Corinth with good news: the king Oedipus believed was his father has died peacefully, of old age. No murder. Relief. But the messenger, trying to be helpful, adds that Oedipus was adopted — handed over as an infant with his ankles pinned together.</p>
  <p>Jocasta works it out first and goes into the house without a word. Oedipus calls the last surviving witness anyway. He gets his answer. Jocasta has hanged herself; he takes the gold pins from her dress and drives them into his own eyes.</p>`,

  <p class="lede">First performed around 429 BC — a year or two after the real plague of Athens.</p>

"nicomachean-ethics": {
  file:"05", title:"Nicomachean Ethics", author:"Aristotle", date:"c. 340 BC",
  form:"Lecture notes · ten books", read:"Brief: 5 min",
  spineLabel:"The argument",
  oneline:"The question is not 'what should I do?' It is 'what am I becoming?' — and the answer is decided by what you do on ordinary days, not hard ones.",
  spine:`
  <p class="lede">Aristotle starts from something almost embarrassingly simple: everything we do, we do for the sake of something else. You work for money, money for security, security for… what? The chain has to stop somewhere, at a thing wanted only for itself.</p>
  <p>He calls that stopping point <em class="g">eudaimonia</em>. Usually translated "happiness," which is a small disaster — it is not a feeling and you cannot have it on a Tuesday. It means something closer to <b>a life going well, as a whole.</b></p>
  <p>So what does a life going well consist of? Here he makes his notorious move. Everything has a characteristic function — an eye sees, a knife cuts — and its good is doing that thing excellently. The characteristic activity of a human being, the one thing we do that plants and animals do not, is <b>reasoning</b>. So the good human life is one of activity governed by reason, done well, over a full lifetime.</p>
  <p>Then the turn that makes the book worth reading. Excellence of character is not a feeling and not a decision. It is a <em class="g">hexis</em> — a settled disposition, built by repetition. You do not become brave by resolving to be brave. You become brave by doing brave things, badly at first, until the doing has rewired what you are.</p>
  <p>What counts as the excellent amount? The famous mean: courage sits between cowardice and recklessness, generosity between meanness and waste. Not a midpoint — the <em>right</em> amount, which is different for each person and each situation, and can occasionally be extreme.</p>
  <p>Which means rules cannot get you there. You need <em class="g">phronesis</em> — practical wisdom, the trained perception of what this situation actually calls for. It can only be acquired by living. That is why, he says, you cannot teach ethics to the young.</p>
  <p>Two of the ten books are then about friendship, because he does not think you can live well alone. And in the last book he argues that the very highest human life is contemplation — which appears to contradict much of what came before, and people have been arguing about it for 2,300 years.</p>`,
  why:`
  <p class="lede">This is the origin of the third option in ethics.</p>
  <p>The two answers most readers have absorbed are: follow the rules (Kant — don't lie, ever, even to the murderer at the door) or count the outcomes (Mill — do whatever produces the most good). Aristotle predates both and refuses both. His question isn't <em>what act is right</em>. It's <b>what kind of person is worth becoming</b>, and how you'd build one.</p>
  <p>The consequence is bracing and unwelcome: <b>you cannot think your way into being good.</b> No amount of reading, insight, or resolution will do it. Character is laid down by repetition, the way you'd learn an instrument — which means every one of us is, right now, practising something.</p>
  <p>It is also the reason the word "character" carries the weight it does in English, and the reason your performance review talks about "habits" rather than "decisions."</p>`,

  take:`<p>The most useful thing in the Ethics is the least philosophical part of it: the claim that virtue is a skill, not a belief. If that's right, then most of what passes for self-improvement — reading, insight, resolving to be better on Monday — is theatre. You are not what you have understood. You are what you have rehearsed.</p>`,
  counter:`<p>That's a self-help flattening, and Aristotle's own ending undercuts it. In Book X he says the <em>highest</em> life is contemplation — solitary, intellectual, closer to what a god does than what a citizen does. The warm, practical, sociable Aristotle everyone quotes is arguably contradicted by his last hundred pages, and scholars have fought over the seam for centuries. Pick the practical Aristotle if you like; just know you're picking.</p>`,

  context:`
  <p class="lede">These are notes for lectures given to wealthy Athenian men with leisure, in a slave-owning city that excluded women from public life.</p>
  <p>Aristotle assumes all of that. He assumes you have time to cultivate excellence, friends of quality, and enough money that generosity is available to you — and he says outright that a life of grinding poverty makes flourishing very hard. That is either honest realism or a comfortable man's excuse, and reasonable people split on it.</p>
  <p>The reason it survived is a long detour: lost to the Latin West for centuries, preserved and argued over by Arabic philosophers — Al-Farabi, Averroes — and re-imported to Europe in the 12th century, where Aquinas made it the backbone of Christian moral thought. Which is exactly how it ends up structuring Hell.</p>`,

"ulysses": {
  file:"17", title:"Ulysses", author:"James Joyce", date:"1922",
  form:"Novel · 18 episodes · one day",
  read:"Brief: 5 min",
  spineLabel:"What happens",
  oneline:"A man spends all day walking around Dublin so he doesn't have to go home, because his wife is sleeping with someone else at four o'clock.",
  spine:`
  <p class="lede">That's it. That's the plot. It is 730 pages long and covers a single day — <b>16 June 1904</b> — in Dublin.</p>
  <p>Leopold Bloom, 38, sells advertising space. He is Jewish in a Catholic city that will not quite let him belong. He makes his wife breakfast, goes to a funeral, argues in a newspaper office, eats a gorgonzola sandwich, gets called a name in a pub, watches a girl on a beach, ends up drunk in a brothel, and comes home at two in the morning.</p>
  <p>Molly Bloom, his wife, a singer, is at home. At four o'clock she sleeps with her manager, Blazes Boylan. Bloom knows this is happening. He arranges his entire day around not being there for it.</p>
  <p>Stephen Dedalus, 22, is a would-be writer, broke, hungover, and refusing to pray at his dying mother's bedside — a refusal he cannot stop turning over. He drifts through the same city on the same day.</p>
  <p>Eleven years ago, the Blooms had a son, Rudy. He lived eleven days. Neither of them has recovered, and they have not slept together properly since.</p>
  <p>Late that night Bloom finds Stephen face-down drunk, picks him up, brings him home, and makes him a cup of cocoa. They talk. Nothing is resolved. Stephen declines the offer of a bed and walks off into the dark. Bloom climbs into bed at the wrong end, next to his wife, and sleeps.</p>
  <p>Molly wakes and thinks — for forty pages, without a single full stop — about Boylan, about her girlhood in Gibraltar, about Bloom, about the day he proposed. The last word of the book is <em>Yes</em>.</p>`,
  why:`
  <p class="lede">The nothing-happening is the argument.</p>
  <p>Every one of the eighteen episodes maps onto an episode of the <em>Odyssey</em> — the pub bully is the Cyclops, the barmaids are the Sirens, the funeral is the descent into the underworld, the brothel is Circe. The parallel is not decoration and it is not a joke. It is a <b>claim</b>: that an ad salesman's ordinary Thursday has the same shape, weight, and scale as ten years of Homeric war and wandering. Nothing had to happen, because something always is.</p>
  <p>To prove it, Joyce had to invent a way to write the inside of a head — not what a man says or does, but the whole unedited churn: half-thoughts, adverts, jingles, grudges, arousal, grocery lists, grief, all in the same second. That's the technique everyone stole.</p>
  <p>And each chapter is written in a different style, because Joyce refuses to let any one voice pretend to be neutral. One is set as newspaper headlines. One is a musical fugue. One is a hallucinatory stage play. One is a deadpan questionnaire. One reproduces the entire history of English prose, from Anglo-Saxon to Dublin slang, while a baby is being born.</p>`,
  sticky:[
    {h:"The whole book is a man avoiding his own house.", p:"Boylan is coming at four. Bloom knows. He walks, and eats, and mourns, and looks at women, and does anything at all rather than go home — and he never once confronts anybody about it."},
    {h:"June 16th, 1904 is the day Nora first went out with him.", p:"The most encyclopaedic novel ever written is set on the date of Joyce's first walk with Nora Barnacle — the day, as he told her, she made a man of him. The entire cathedral is built on a first date."},
    {h:"Rudy.", p:"Their son died at eleven days old. It is mentioned lightly, in passing, again and again. Everything soft in Bloom — his gentleness, his attaching himself to a drunk young stranger who needs a father — comes out of that hole."},
    {h:"The Cyclops is an antisemite in a pub.", p:"The one-eyed monster is a nationalist with one idea, and the boulder he hurls is a biscuit tin. Bloom, hounded, says his piece: Christ was a Jew like me. Then he's driven out of the bar."},
    {h:"It ends with 'Yes.'", p:"After 700 pages of squalor, betrayal, grief, and Dublin drizzle, the last word is affirmation, capitalised. Joyce chose it deliberately as the least negative word in the language."}
  ],
  idea:`
  <p class="lede">Heroism is being kind while being humiliated.</p>
  <p>Odysseus comes home and slaughters the suitors. Bloom comes home, finds the crumbs of another man in his bed, gets in anyway, and goes to sleep. Joyce's wager — and it is the whole point of hanging the book on Homer — is that <b>Bloom's version is harder and better</b>. He is cuckolded, mocked, excluded, and grieving, and he is never once cruel to anybody. He is decent to a stray dog, to a blind boy, to a woman in labour, to the man who is not his son.</p>
  <p>Making a good man interesting is one of the hardest problems in fiction. This is the book that solved it.</p>`,
  wrong:[
    {b:"It is not uniformly unreadable.", p:"The first six episodes are largely straightforward. The difficulty escalates on purpose. Most people quit in episode three — Stephen alone on a beach, thinking abstractly — and conclude the whole book is that. It isn't."},
    {b:"\"Stream of consciousness\" is not the whole book.", p:"It's the method of some episodes. Others are headlines, a fugue, a play script, a catechism, a parody of every English prose style ever used. The variety is the point."},
    {b:"Nobody in it is called Ulysses.", p:"The Homeric parallels are structural and mostly ironic. There is no Greek anything on the page. Joyce handed out a chart of the correspondences to critics later, partly to help them, partly to keep them busy."},
    {b:"The obscenity was mild.", p:"It was banned in the US until 1933 and Britain until 1936. The actual offending material: Bloom masturbating on a beach while fireworks go off, and a woman thinking honestly about sex."}
  ],
  take:`<p>The reason to care about Ulysses is not the technique. It's Bloom. The techniques get taught because techniques are teachable — but the achievement is the creation of an unglamorous, faintly ridiculous, entirely good man, and the demonstration that his day contains as much as any war. Almost nobody in literature has made goodness interesting. Joyce did it once and then never tried again.</p>`,
  counter:`<p>That is a sentimental rescue of a book that is, structurally, a machine built to defeat you. Joyce said he had put in so many puzzles that professors would spend centuries arguing about what he meant, and that this was how he'd secure immortality. The difficulty is not a barrier standing in front of the meaning — it <em>is</em> the meaning: the book's claim is that a mind cannot be summarised, and so it refuses to be summarised. Which makes this briefing file, precisely, the thing Ulysses was designed to make impossible. Worth knowing that you're holding the one entry here whose author would consider it a category error.</p>`,
  people:[
    {k:"Leopold Bloom", v:"38, advertising canvasser, Jewish father, baptised twice, belongs nowhere. Curious about everything, cruel to nobody. The most fully imagined human being in fiction."},
    {k:"Molly Bloom", v:"Singer, born in Gibraltar. Unfaithful that afternoon, honest at every moment, and given the last forty pages and the last word."},
    {k:"Stephen Dedalus", v:"22, brilliant, insufferable, penniless. Joyce at that age, drawn without mercy. Refused to pray at his mother's deathbed and is haunted by it."},
    {k:"Buck Mulligan", v:"Stephen's flatmate. Funny, cruel, a mocker. The friend who is not a friend."},
    {k:"Blazes Boylan", v:"Molly's manager and lover. Loud, confident, hollow. Arrives at four. Joyce gives him almost no interior life at all — that's the judgement."},
    {k:"Rudy", v:"The son who lived eleven days. Appears once, silently, as a hallucination at the end of the brothel episode. It is the emotional centre of the book."},
    {k:"The Homeric parallel", v:"Each of the eighteen episodes shadows a scene from the <em>Odyssey</em>: Bloom is Odysseus, Stephen is Telemachus (the son seeking a father), Molly is a very unfaithful Penelope. The Citizen is the Cyclops; Nighttown is Circe's island. Ordinary Dublin laid over one of the greatest voyages in literature.",to:"odyssey"},
    {k:"The Citizen", v:"Nationalist, antisemite, one-eyed in every sense. The Cyclops."},
    {k:"Nora Barnacle", v:"Not in the book; the reason for it. Joyce set the novel on the day of their first walk together, 16 June 1904."}
  ],
  places:[
    {k:"Dublin", v:"Joyce claimed that if the city were destroyed it could be rebuilt from the book. He was not entirely joking, and he wrote all of it from abroad, from memory and street directories."},
    {k:"7 Eccles Street", v:"The Blooms' house — a real address, and the home of Joyce's friend J. F. Byrne. The house was pulled down in 1967 to make room for a hospital. The <b>front door</b> was rescued by John Ryan — the man who organised the first Bloomsday — and hung in his pub, The Bailey. In 1995 it was moved to the James Joyce Centre, where you can still stand in front of it."},
    {k:"Sandymount Strand", v:"The beach. Stephen's abstract monologue in the morning; Bloom's very unabstract evening."},
    {k:"Glasnevin Cemetery", v:"The funeral of Paddy Dignam. The descent into the underworld — Bloom, alive among the dead, thinking about drainage and worms."},
    {k:"Nighttown", v:"Dublin's red-light district. Episode 15 — a 180-page hallucination written as a stage play, where everything repressed all day comes back as costume."},
    {k:"Trieste–Zurich–Paris", v:"The last line of the book, after 'Yes': the three cities he wrote it in, 1914–1921. He was in exile the whole time."}
  ],
  terms:[
    {k:"Bloomsday", v:"16 June. Celebrated annually in Dublin and elsewhere by people in period dress eating kidneys. The only novel with its own holiday."},
    {k:"interior monologue", v:"The unedited churn of a mind, rendered directly and without apology. Joyce didn't invent it; he industrialised it."},
    {k:"parallax", v:"A word Bloom chews on all day: how a thing looks different depending on where you stand. It is also the method of the entire novel."},
    {k:"metempsychosis", v:"Transmigration of souls. Molly asks Bloom what it means and mishears his answer as 'met him pike hoses,' which then recurs in her head all day. This is how the book works everywhere: mishearings, jingles, and adverts, drifting."},
    {k:"the mythical method", v:"T. S. Eliot's name for it: using an ancient myth as a scaffold for modern chaos. He said it made the modern world possible for art."},
    {k:"the schema", v:"Joyce's own chart mapping each episode to a Homeric scene, an hour, an organ, an art, a colour, a technique. He leaked it deliberately."}
  ],
  context:`
  <p class="lede">Written in exile — Trieste, Zurich, Paris — between 1914 and 1921, while Europe destroyed itself.</p>
  <p>Joyce left Ireland at 22 and never lived there again. He then wrote about nothing else for the rest of his life. The book was serialised in a small American magazine until the courts stopped it for obscenity in 1921, and published in full on 2 February 1922 — his fortieth birthday — by Sylvia Beach, an American woman who ran a Paris bookshop and had no business publishing anything.</p>
  <p>Banned in the United States until a judge ruled in 1933 that it was not pornographic, merely difficult. Ireland never formally banned it. Irish booksellers simply did not stock it.</p>`,
  echoes:[
    {k:"→ Montaigne", to:"montaigne", v:"The road Montaigne opened, taken to its limit: if one ordinary private mind watched honestly is fit matter for literature, Bloom's day is that principle at seven hundred pages."},
    {k:"→ The Odyssey", to:"odyssey", v:"The load-bearing structure. Eighteen episodes, eighteen Homeric correspondences, all ironic. The Odyssey is the blueprint — read it and this book changes shape."},
    {k:"→ Hamlet", to:"hamlet", v:"Stephen spends an entire chapter in the library arguing that Shakespeare is not the prince but the murdered father. Fathers and sons who fail to recognise each other: that is also the plot of this book."},
    {k:"→ Oedipus Rex", to:"oedipus-rex", v:"A son who cannot escape a father, a father who cannot find a son. Freud is in the air of 1922 and Joyce is playing with him, and against him."},
    {k:"→ Dante", to:"dante", v:"Both books put a whole civilisation inside a single walk. Dante needed the afterlife; Joyce only needed Thursday."},
    {k:"→ Everything after", v:"Woolf, Faulkner, Beckett, and the entire reason 'difficult' became a compliment rather than a complaint."}
  ]
}

"symposium": {
  file:"04.1", title:"The Symposium", author:"Plato", date:"c. 385 BC",
  form:"Philosophy · dialogue · seven speeches on love",
  read:"Brief: 5 min",
  spineLabel:"What it is",
  oneline:"A drinking party where seven Athenians take turns making speeches in praise of love — and between them they invent the soulmate, the word 'Platonic,' and the idea that desire is a ladder to the divine.",
  spine:`
  <p class="lede">The most charming thing Plato ever wrote, and the origin of half of how the West still talks about love. The setup is a dinner: the tragic poet <b>Agathon</b> has just won his first prize, and his guests, hungover, agree to skip the heavy drinking and instead each give a <b>speech in praise of Eros</b> — Love.</p>
  <p>The speeches climb. But two of them became immortal.</p>
  <p>First, the comic playwright <b>Aristophanes</b> tells a myth. Humans were once round, doubled creatures — <b>four arms, four legs, two faces</b> — of three kinds: male-male, female-female, and male-female. They were so strong they threatened the gods, so <b>Zeus split every one of them in half.</b> Ever since, each of us is a walking half, aching for the other half we were cut from. <b>That is where the 'soulmate' comes from</b> — the idea that somewhere out there is your missing piece. It is 2,400 years old, and it started as a joke given to a comedian.</p>
  <p>Then <b>Socrates</b> speaks — and says he is only repeating what a wise priestess, <b>Diotima</b>, once taught him. Her image is the <b>ladder of love</b>: you begin by loving one beautiful body, then realise beauty is in all beautiful bodies, then in beautiful minds, then in laws and ideas, then in knowledge itself — until at the top you glimpse <b>Beauty itself</b>, eternal and pure. Desire is not a trap. It is a staircase, and the bottom rung is a person you want to touch, and the top rung is God, more or less.</p>
  <p>And then the doors bang open and a beautiful, brilliant, drunk <b>Alcibiades</b> falls in, and instead of praising Love he praises Socrates — the ugliest and most irresistible man in Athens — and admits, to a room full of people, that he once tried to seduce the philosopher and was gently, devastatingly turned down.</p>`,
  why:`
  <p class="lede">Because two ideas that everyone alive still uses were both minted in this one room, and most people have them backwards.</p>
  <p><b>'Soulmate'</b> is Aristophanes': the other half, the missing piece, the person who completes you. It is intoxicating — and Plato frames it as the <em>comedian's</em> speech, and then has Diotima quietly overturn it. Because on the ladder, the beloved is not your destination; the beloved is the <b>first step</b>. Loving one person is where you start, not where you stop — the point is to let that love lift you toward something that cannot die.</p>
  <p>And <b>'Platonic love'</b> is Diotima's — except almost everyone now uses it to mean 'love without the sex,' a friendship, and that is nearly the opposite of what Plato meant. Platonic love <em>starts</em> with physical desire for a beautiful body; it just refuses to stop there. It is erotic longing rerouted and climbing, all the way up. The phrase we use for de-sexed affection was coined for the most intense sublimation of eros ever described.</p>
  <p>Under both is the move that makes Plato Plato: the visible, particular, perishable thing you want — this body, this person — is a rung toward the invisible, universal, eternal thing behind it. Love, like everything in Plato, points past the world to the <b>Forms.</b></p>`,
  sticky:[
    {h:"The soulmate was invented as a joke.", p:"The four-armed rolling proto-humans, split by Zeus, each searching forever for their lost half — the most romantic idea in Western culture — is given to <b>Aristophanes</b>, the comedian, as the funny speech. Plato believed in a higher love than this, and he stages the soulmate myth precisely so Diotima can climb past it. We kept the joke and forgot the correction."},
    {h:"'Platonic love' means almost the opposite of what you think.", p:"It does not mean 'just friends.' Diotima's ladder <em>begins</em> in physical desire — wanting to touch one beautiful body — and treats that desire as the raw fuel for an ascent toward Beauty itself. Platonic love is sublimated eros at full burn, not the absence of it. The modern meaning is a 2,000-year-old misunderstanding."},
    {h:"The ladder of love.", p:"One beautiful body → all beautiful bodies → beautiful souls → beautiful laws and institutions → beautiful knowledge → <b>Beauty itself.</b> Each rung is a widening, a letting-go of the particular for the general, until the lover is in contact with something eternal. It is the same shape as the cave and the divided line in the Republic — desire made into an escape route from the changing world."},
    {h:"The wisest voice in Plato is a woman who may not have existed.", p:"Socrates claims he learned everything he knows about love from <b>Diotima of Mantinea</b>, a priestess. She is very likely Plato's invention — and it is striking that he puts the dialogue's highest teaching in the mouth of a woman, when women were absent from this world of male drinking parties. The summit of the argument is spoken by the one person who could not have been in the room."},
    {h:"Alcibiades' entrance.", p:"The golden boy of Athens — beautiful, gifted, and destined to betray his city — crashes the party drunk and delivers a love speech not to Love but to Socrates, whom he compares to an ugly little statue that opens to reveal gods inside. He confesses he tried to seduce Socrates and failed. It is the most human scene in Plato: desire, wounded pride, and hero-worship, all at once."}
  ],
  idea:`
  <p class="lede">Desire is not the enemy of the higher life — it is the engine of it. What you do with wanting decides everything.</p>
  <p>Plato's rivals treated bodily desire as a distraction from wisdom. The <em>Symposium</em>'s radical claim is that they are the same energy: the pull you feel toward a beautiful face is the <em>bottom</em> of a staircase whose top is the love of truth. You do not kill desire to become wise; you educate it, rung by rung, until it is aimed at something that will not die.</p>
  <p>Portable version: <b>love is a ladder, not a destination</b> — the person you long for is where the climb begins, not where it ends.</p>`,
  wrong:[
    {b:"'Platonic' does not mean non-sexual.", p:"The most common error about this book. Plato's ladder is built <em>out of</em> erotic desire and rises by transforming it, not by denying it. Using 'platonic' to mean a sexless friendship inverts his actual meaning."},
    {b:"The soulmate speech is not Plato's own view.", p:"Aristophanes' beautiful myth of the other half is set up to be surpassed. Diotima explicitly corrects it: the goal is not reunion with one lost person but ascent toward Beauty. People quote the romantic half and skip the philosophical rebuttal."},
    {b:"A 'symposium' was not a conference.", p:"The word means 'drinking together' — a Greek after-dinner party with wine, music, flute-girls, and talk. The modern academic 'symposium' is a very tame descendant of a considerably rowdier institution."},
    {b:"It is not a dry treatise.", p:"It is funny, dramatic, and a little scandalous — full of hangovers, flirtation, interruptions, and a drunk gate-crash at the end. Plato is a great writer here first and an arguer second."}
  ],
  take:`<p>The <em>Symposium</em> is where you can watch a civilisation decide what love is going to mean — and then watch most of posterity keep the wrong half. Aristophanes gives us the soulmate: intoxicating, consoling, and, in Plato's hands, a beautiful error. Diotima gives us the ladder: colder, harder, and the thing Plato actually believed — that every desire for a particular beautiful thing is secretly a desire for the eternal, and that a life spent climbing that recognition is the best life there is. We took the soulmate and the word 'platonic' and got both of them backwards, which is its own kind of proof of how good a writer Plato was: the wrapping outlived the gift.</p>`,
  counter:`<p>It is easy to side entirely with Diotima and treat Aristophanes as the sweet mistake — but that is arguably to miss what the dialogue gains by keeping both. The ladder can look chillingly impersonal: it uses the beloved as a stepping-stone and climbs off them toward an abstraction, which is not obviously how love at its best actually feels. Aristophanes' myth, for all its comedy, honours the stubborn particularity of loving <em>this</em> person and no substitute — something Diotima's ascent seems ready to leave behind. Plato may want us to choose the ladder. He was too good a writer to make the soulmate easy to give up, and readers have been refusing to give it up for 2,400 years.</p>`,
  people:[
    {ref:"socrates", here:"The last and highest speaker — who, characteristically, claims to know nothing himself and merely repeats what the priestess Diotima taught him. Then Alcibiades arrives and makes Socrates himself the object of a love speech."},
    {k:"Diotima", v:"The priestess of Mantinea whom Socrates credits with teaching him the true nature of love — and the source of the ladder of love. Almost certainly Plato's invention, and pointedly a woman: the dialogue's deepest wisdom is placed in the one voice that could not have been at the party."},
    {k:"Aristophanes", v:"The great comic playwright of Athens, here given the dialogue's most famous speech — the myth of the split humans searching for their other half. The origin of the soulmate, delivered by a comedian, and set up by Plato to be surpassed."},
    {k:"Alcibiades", v:"The brilliant, beautiful, doomed golden boy of Athens — future traitor to his city — who crashes the party drunk and praises Socrates instead of Love, confessing he tried and failed to seduce him. Charisma and ruin in one person."},
    {k:"Agathon", v:"The tragic poet hosting the party to celebrate his first prize. Young, handsome, and gracious — his own speech is the most polished and the emptiest, all style, teeing up Socrates to puncture it."}
  ],
  places:[
    {k:"Agathon's house", v:"The setting: a private Athenian home the night after Agathon's tragedy won at the festival, 416 BC. The whole dialogue is one dinner party, remembered and retold at several removes — Plato frames it as a story about a story about that night."},
    {k:"Athens", v:"The city at its glittering, dangerous height — and on the edge of catastrophe. Several men at this cheerful party, Alcibiades above all, will soon be caught up in the disasters that end Athens's golden age. The wine is warm; the dark is coming."}
  ],
  terms:[
    {k:"Eros", v:"Not the cute cherub but the Greek force of desire — longing, want, the pull toward what one lacks. The whole dialogue is speeches in its praise, and Diotima redefines it as the soul's drive toward beauty and, ultimately, the eternal."},
    {k:"the ladder of love (scala amoris)", v:"Diotima's ascent: from one beautiful body, to all bodies, to beautiful souls, to beautiful laws and knowledge, to Beauty itself. Desire educated upward until it touches the eternal. The erotic version of the climb out of the cave."},
    {k:"Platonic love", v:"In its true sense: love that begins in physical desire and rises past it toward the Form of Beauty — sublimated eros, not sexless affection. The modern meaning ('just friends') nearly reverses Plato's."},
    {k:"the other half", v:"Aristophanes' image: since Zeus split the original doubled humans, each person seeks the missing half they were cut from. The soulmate, in its original form — and, in the dialogue, the beautiful idea Diotima climbs past."},
    {k:"symposium", v:"Literally 'drinking together' — an aristocratic Greek after-dinner party of wine, entertainment, and talk. The refined modern 'symposium' is its distant, sober descendant."}
  ],
  context:`
  <p class="lede">A dialogue of Plato's middle period, set a generation before he wrote it, looking back at a golden Athens about to fall.</p>
  <p>Plato wrote the <em>Symposium</em> around 385 BC but set it in 416 BC — before the disastrous Sicilian expedition, before Athens lost its long war, before Socrates was executed. The party's glow is deliberately backlit by everything the reader knows is coming, especially for Alcibiades, whose brilliance and betrayal helped bring Athens down.</p>
  <p>It belongs to the same period as the <em>Republic</em>, and shares its engine: the conviction that the beautiful, changing things of this world are shadows or steps, and that the philosopher's task is to climb from them to the eternal Forms behind them. The <em>Republic</em> climbs through justice and knowledge; the <em>Symposium</em> climbs through desire. They are the same staircase, entered by different doors.</p>`,
  echoes:[
    {k:"→ The Republic", to:"republic", v:"The same ascent, through a different passion. The Republic climbs from shadows to the Form of the Good; the Symposium climbs from one beautiful body to the Form of Beauty. Plato's whole philosophy is this move — from the particular thing you can see to the eternal thing behind it."},
    {k:"→ The Divine Comedy", to:"dante", v:"Diotima's ladder, made Christian and made flesh. Dante's love for one specific woman, Beatrice, becomes the force that lifts him rung by rung through Paradise to the vision of God. The ladder of love with a name and a face on the bottom step."},
    {k:"→ Confessions", to:"confessions", v:"Augustine and his mother at Ostia, ascending together in conversation 'step by step' past all created things toward God, is Diotima's ladder in Christian dress — desire for the eternal, climbing past the world that merely points to it."},
    {k:"→ Meditations", to:"meditations", v:"Two ancient routes to the eternal: Plato climbs toward it through love and beauty; the Stoic Marcus steadies himself by accepting the cosmic order as it is. Ascent versus acceptance — the two postures ancient philosophy leaves us."}
  ]
}
,

"republic": {
  file:"04", title:"The Republic", author:"Plato", date:"c. 375 BC",
  form:"Dialogue · ten books",
  read:"Brief: 5 min",
  spineLabel:"The argument",
  oneline:"If you could get away with anything — if nobody could ever see you — would you still be decent? Everything else in the book is an attempt to answer that.",
  spine:`
  <p class="lede">The first word in Greek is <em class="g">kateben</em>: <b>I went down.</b> It's the word Homer uses for descending into the underworld. Socrates walks down to the port, gets cornered by friends, and doesn't get out again for ten books.</p>
  <p>They ask what justice is. The easy answers get taken apart. Then a sophist called Thrasymachus loses patience and says the true thing out loud: <b>justice is whatever the strong say it is</b>, and the unjust man, if he's any good at it, has the better life. Everyone honest knows this.</p>
  <p>Socrates fends him off, but Plato's own brother Glaucon isn't satisfied. He sharpens the knife: imagine a ring that makes you invisible. Nobody sees, nobody knows, nothing costs. <em>Now</em> tell me why I should be just. And don't tell me about reputation — I want to know if justice is good for its <b>own</b> sake, stripped of every reward.</p>
  <p>Socrates' answer takes the rest of the book, and it opens with a swerve. Justice in one soul is too small to read. So let's build a city instead — the same thing in larger letters — and read it off there.</p>
  <p>So they build one. Everyone does the single job they're suited for. A warrior class is raised on strict education. A tiny ruling class is bred, selected, and stripped of property and family. The population is told a founding myth about metals in their souls, to keep them content — Plato calls it a <b>noble lie</b> and does not blush. The poets, Homer included, are exiled for lying about the gods and stirring up feelings that reason should govern. And the rulers must in the end be philosophers, because only they have seen what is actually there.</p>
  <p>Then the payoff: the city has three parts, and <b>so do you.</b> Reason, spirit, appetite. Justice is not a behaviour — it's an <em>arrangement</em>. Each part does its own work and doesn't seize the others' jobs. Injustice is civil war inside a person.</p>
  <p>The last books watch it come apart: how aristocracy rots into honour-seeking, then money, then democracy, then tyranny — and how a soul rots the same way, in the same order.</p>`,
  why:`
  <p class="lede">This is where Western philosophy gets its shape, and where the West gets its distrust of the crowd.</p>
  <p>Glaucon's challenge — <em>be just when no one is watching, and show me it was worth it</em> — is still the hardest question in ethics. Every moral philosophy since is an answer to him, whether it admits it or not.</p>
  <p>But the move that made the book immortal is the analogy: <b>the city is the soul, enlarged.</b> Once you accept that, politics becomes psychology and psychology becomes politics, permanently. Plato's account of democracy sliding into tyranny — freedom widening until the crowd wants a champion, and the champion becomes the thing they feared — isn't really a political forecast. It's a description of what happens inside a person who has stopped governing their own appetites, projected outward onto a state. Which is why it never stops sounding like this week.</p>`,
  sticky:[
    {h:"The Ring of Gyges.", p:"A shepherd finds a ring that turns him invisible. He walks into the palace, seduces the queen, murders the king, takes the throne. Glaucon's point: <em>anyone would.</em> Justice is something we perform while being watched. Now prove me wrong."},
    {h:"The Cave — and nobody remembers the ending.", p:"Prisoners chained facing a wall, watching shadows, certain they're real. One is dragged out into the sun. He comes back down to tell the others. <b>They kill him.</b> Plato wrote that about twenty-five years after Athens executed Socrates."},
    {h:"He bans Homer.", p:"Homer — the first two works in the tradition — is thrown out of the ideal city by Plato. Poetry lies about the gods and feeds the feelings that reason should be governing. Plato loved Homer and exiled him anyway. He calls it 'the ancient quarrel between philosophy and poetry' — a quarrel he started."},
    {h:"The noble lie.", p:"Citizens are told a founding myth: you were born from the earth with gold, silver, or bronze in your soul, and that is why you rule, or fight, or farm. Plato thinks the state should lie to hold itself together. He is entirely calm about it."},
    {h:"The just man is 729 times happier than the tyrant.", p:"Book IX. He does the arithmetic. It is a real number in a real philosophy book, arrived at by cubing nine — and the fact that he could not resist making it precise tells you almost everything about him."}
  ],
  idea:`
  <p class="lede">The state you would build is a picture of the soul you have.</p>
  <p>Justice isn't a rule you obey. It's an <b>arrangement</b> — reason governing, spirit enforcing, appetite obeying — and a society is that arrangement written large enough to read. Your politics is a projection of how your own wanting is organised. A tyrant is not a man with too much power; he is a man who has been conquered from the inside.</p>
  <p>Portable version: <b>whatever is winning inside you is what you will eventually demand outside you.</b></p>`,
  wrong:[
    {b:"It is not primarily a book about politics.", p:"The city is a diagram. Socrates says so outright — the soul is too small to read, so write it out large. Reading the Republic as a policy proposal is like reading an architect's scale model as a house you're meant to live in."},
    {b:"Plato is not Socrates.", p:"The historical Socrates claimed to know nothing and only asked questions. The Socrates of the Republic has a complete metaphysical system and lectures for hours. Somewhere between the early dialogues and this one, the puppet started speaking for the puppeteer."},
    {b:"The Cave is not a story about enlightenment.", p:"Every popular retelling stops at the sunlight. The actual ending is that he goes back down to help, and the people he came to save would tear him apart if they could get their hands free."},
    {b:"Plato did not think philosopher-kings were an obvious idea.", p:"He calls it the third and most ridiculous of three 'waves' of absurdity about to drown him. Then he sailed to Syracuse twice to try it on a real tyrant — Dionysius II — and failed both times, the second time badly enough to fear for his life."}
  ],
  take:`<p>The Republic is a diagnostic instrument, not a blueprint. Its living content isn't the eugenics or the censorship — that's the scaffolding of an analogy — it's the claim that political disorder is psychological disorder made visible, and that a people gets the regime its own inner arrangement demands. Which is why the descent from democracy into tyranny reads like journalism in every generation that picks it up. Plato isn't telling you what to build. He's telling you what you already are.</p>`,
  counter:`<p>Karl Popper, writing in exile while the Second World War burned, read this book as the fountainhead of totalitarianism, and the charge sheet is not silly: a hereditary ruling caste, state-manufactured myths, rigged breeding, abolished families, banned art, and the premise that a qualified few know better than everyone else what everyone else needs. "It's only an analogy" is exactly what an admirer says to avoid the fact that Plato meant a great deal of it — enough to get on a boat to Syracuse and try. Defend the book if you like. Defend it knowing what you're defending.</p>`,
  people:[
    {ref:"socrates", here:"The narrator of the whole dialogue — and the man Athens executed in 399 BC. That death stands behind every page of the Republic."},
    {k:"Glaucon", v:"Plato's actual older brother. Asks the best question in the history of philosophy and refuses to take a soft answer."},
    {k:"Adeimantus", v:"Plato's other brother. Adds the harder half: nobody praises justice, they praise the <em>appearance</em> of it. Even our parents teach us to look good rather than be good."},
    {k:"Thrasymachus", v:"The sophist. Bursts in 'like a wild beast,' says might makes right, sulks when contradicted. Everyone since has had to answer him and almost nobody has done it cleanly."},
    {k:"Cephalus &amp; Polemarchus", v:"The old man and his son who open the dialogue — the host whose remark about justice and old age starts the whole argument, and the son who inherits the conversation before Thrasymachus bursts in. The civilised surface before the real fight."},
    {k:"Gyges", v:"The shepherd with the ring. Ancestor of every invisible-man story, and of the question inside every one of them."},
    {k:"Er", v:"A soldier who dies, sees the afterlife, and comes back. In his vision souls choose their next lives — and almost all choose badly, out of habit. Odysseus, last to pick, chooses the life of an ordinary private man, cured of ambition. That's the closing page."},
    {k:"Karl Popper", v:"<em>The Open Society and Its Enemies</em>, 1945. Filed the charges: Plato as the first totalitarian. Still the most serious attack on the book."}
  ],
  places:[
    {k:"The Piraeus", v:"Athens' port. Socrates 'goes down' there for a festival and is detained by friends — an abduction disguised as hospitality."},
    {k:"The Academy", v:"Plato's school, in a grove outside Athens. It ran for nine centuries. Aristotle spent twenty years inside it. The word 'academic' is a real-estate accident."},
    {k:"Syracuse", v:"Sicily. He went <b>three times</b>. The first trip (c. 387) was to Dionysius I and ended in disaster — and the lurid story that he was sold into slavery on Aegina and ransomed by a stranger attaches to <em>that</em> visit. <span class=\"legend\">disputed</span> It comes from late sources and Plato never mentions it in his own Seventh Letter. The actual philosopher-king experiment was the later pair of trips, to <b>Dionysius II</b>, in 367 and 361. Both failed, and the second nearly got him killed."},
    {k:"The Cave", v:"The most famous image in philosophy. Prisoners are chained facing a wall, watching shadows cast by puppets behind them, believing the shadows are reality. One is dragged out into the sunlight, sees the real world, and returns to free the others — who, comfortable with their shadows, would kill him. The sun is the Good; the freed prisoner is the philosopher; the killing is Socrates."},
    {k:"The divided line", v:"Plato's ladder of knowledge: from shadows, to physical objects, to mathematical truths, to the Forms themselves. Each rung is more real than the last. The cave is this diagram turned into a story."},
    {k:"Kallipolis", v:"'Beautiful city' — the thing they build in speech. Socrates admits it exists nowhere: it is a pattern laid up in heaven, for a man to look at while ordering himself."}
  ],
  terms:[
    {k:"the Forms", v:"The real things. A chair is a shabby copy of the Chair. Everything solid you know is downstream of this idea — including the word 'ideal.'"},
    {k:"the Good", v:"The Form above the Forms. Like the sun: it lets you see everything else, and you cannot look straight at it."},
    {k:"thumos", v:"Spirit. Not reason, not appetite — the part that gets indignant, wants honour, can be shamed. The enforcement arm of the soul, and the part modern psychology mislaid."},
    {k:"philosopher-king", v:"Plato's answer to the question 'who should rule?': not the strong, not the rich, not the many, but the few who have seen the Good and do not want power. The city will be just only when the wise are made to govern against their own wishes."},
    {k:"the tripartite soul", v:"Reason, spirit, appetite. Freud's remix is late, and he knew it."},
    {k:"the noble lie", v:"<em>gennaion pseudos</em>. A useful founding myth, told on purpose. The phrase has since defended a great many things Plato never imagined."},
    {k:"mimesis", v:"Imitation. Art copies the world, which already copies the Forms — so a painting is third-hand goods. The charge on which poetry is convicted in Book X."},
    {k:"aporia", v:"The dead end. The productive confusion Socrates leaves people in. Book I ends there; the other nine books are Plato refusing to."}
  ],
  context:`
  <p class="lede">Athens killed Socrates in 399 BC, by vote, democratically. Plato was about thirty. Everything he wrote afterwards runs downhill from that morning.</p>
  <p>And it's worse than a grudge. Plato was an aristocrat: his relatives Critias and Charmides were leaders of the Thirty Tyrants, the oligarchy that seized Athens after its defeat by Sparta and murdered its way through the citizenry. So Plato watched tyranny up close, through his own family — and then watched the restored democracy execute the best man he knew.</p>
  <p>He distrusted both. The Republic is what a man builds when he has seen the mob and the strongman and refuses to pick one.</p>`,
  echoes:[
    {k:"→ The Symposium", to:"symposium", v:"The same climb through a different passion — the Symposium ascends from one beautiful body to the Form of Beauty, as the Republic ascends from shadows to the Form of the Good. Two doors onto one staircase."},
    {k:"→ Meditations", to:"meditations", v:"Plato dreamed of the philosopher-king; Marcus Aurelius actually was one. The Meditations is the view from inside the fantasy — and it turns out to be mostly duty, exhaustion, and the effort not to be corrupted."},
    {k:"→ Nicomachean Ethics", to:"nicomachean-ethics", v:"Aristotle sat in the Academy for twenty years and then rejected the Forms as useless to anyone actually trying to live: a doctor treating a patient does not need the Form of Health. The Nicomachean Ethics is the argument they never finished."},
    {k:"→ Homer", to:"iliad", v:"The <em>Iliad</em> and the <em>Odyssey</em> — expelled from the city. The quarrel between philosophy and poetry begins here and never ends."},
    {k:"→ The Aeneid", to:"aeneid", v:"Plato banned the poets for making us weep at fictions. Virgil then wrote the fiction Augustine wept at."},
    {k:"→ Augustine", to:"confessions", v:"Platonism is the vehicle Christianity arrives in. The Forms become thoughts in the mind of God; the Good becomes God; the Cave becomes the world. The <em>Confessions</em> is a Platonist finding a religion."},
    {k:"→ Ulysses", to:"ulysses", v:"On the last page of the Republic, Odysseus chooses the life of an ordinary private man, cured of ambition. Two and a half thousand years later, Joyce gives him that life: an ad salesman in Dublin."},
    {k:"→ The Matrix, and the 'red pill'", v:"The Cave, rebuilt shot for shot, then flattened into a slogan by people who skipped the part where he goes back down and is killed for it."}
  ]
}

"iliad": {
  file:"01", title:"The Iliad", author:"Homer", date:"c. 750 BC",
  form:"Epic · 24 books · sung",
  read:"Brief: 5 min",
  spineLabel:"What happens",
  oneline:"The greatest war poem ever written is about a man who refuses to fight, sulking in a tent, because someone took his girl.",
  spine:`
  <p class="lede">The first word of the poem, in Greek, is <em class="g">rage</em>. Not Troy. Not war. Not Achilles. The poem announces that its subject is an emotion.</p>
  <p>It is year ten of the siege of Troy. Agamemnon, the commander, is forced to give up a captive girl, so he takes Briseis — the prize of Achilles, the best fighter in the army — to save face. Achilles, publicly humiliated, walks off the field and stays off it.</p>
  <p>He asks his mother, a sea-goddess, to have Zeus make the Greeks lose. She does. They lose. Men Achilles has known his whole life are slaughtered while he sits by his ships, and when an embassy comes offering the girl back and a fortune besides, <b>he says no.</b> He has worked out that no amount of loot buys back a life, and that he'd rather go home and live a long, obscure one.</p>
  <p>Then Patroclus — the man he loves most in the world — borrows his armour to frighten the Trojans, and Hector kills him.</p>
  <p>Achilles comes back. Not for Greece, not for Agamemnon, not for honour. For grief. He kills Hector, ties the body to his chariot, and drags it around the walls for twelve days while Hector's father, mother, and wife watch from the ramparts.</p>
  <p>And then the last book. Priam, King of Troy, an old man, walks alone at night into the tent of the man who killed his son. He kneels. He kisses Achilles' hands. They weep together — the father for his son, the killer for his own father, whom he will never see again — and Achilles gives the body back.</p>
  <p>The poem ends with Hector's funeral. Troy still stands. Achilles is still alive. Nothing is resolved.</p>`,
  why:`
  <p class="lede">It is the first work of Western literature and it is already one of the most honest things ever written about war.</p>
  <p>Homer's method is relentless: nobody dies anonymously. Every spear-thrust stops the poem so you can be told the dead man's father, his home town, the wife who will not know for weeks. A minor Trojan gets four lines about the orchard he grew up in, and then his eyes are covered in darkness. Repeat, for hundreds of men. <b>The individuated death is invented here, and it has rarely been done better.</b></p>
  <p>And underneath is Achilles' choice, which every heroic culture since has had to answer: he is told he can go home and live long and be forgotten, or stay and die young and be sung about forever. He picks the song. Then, in the sequel, when Odysseus meets him in the land of the dead, Achilles says he would rather be a living slave to a landless man than king of all the dead.</p>
  <p>Homer gives you the heroic bargain and the receipt.</p>`,
  sticky:[
    {h:"It's not about the Trojan War.", p:"It covers about seven weeks of year ten. No wooden horse. No fall of Troy. Achilles doesn't even die in it. The action of this war epic is a man in a tent, refusing to come out."},
    {h:"He goes back for Patroclus, not for Greece.", p:"An embassy offers him treasure, the girl, and honour. He turns it down flat. Then they kill Patroclus and he comes out of the tent screaming, and the sound is so terrible the Trojan horses bolt."},
    {h:"Priam kisses the hands that killed his son.", p:"Old, alone, at night, in the enemy's tent. He puts his mouth on the hands that dragged his boy's corpse through the dirt, because it is the only currency he has left. Achilles thinks of his own father and starts to cry, and gives the body back. This is the last scene, and it is why the poem is immortal."},
    {h:"The shield.", p:"Book 18. Achilles' new armour is engraved with the entire world: a wedding, a harvest, a lawsuit, children dancing, a city at peace. He straps the life he chose <em>not</em> to have onto his arm and goes out to die."},
    {h:"Hector's baby screams at his helmet.", p:"Hector goes to say goodbye to his wife and reaches for his son, and the child shrieks in terror at the horsehair crest. So Hector laughs, takes the helmet off, and puts it on the ground. Then he goes out and dies. Six lines, and Homer has told you the entire cost of war."}
  ],
  idea:`
  <p class="lede">Glory is real, and it is bought with your life, and the exchange rate may not be good.</p>
  <p>Achilles is the first person in literature to <em>see through</em> the deal he is enrolled in, say so out loud, refuse it — and then take it anyway, for reasons that have nothing to do with the deal. Portable version: <b>the thing you'd actually die for is almost never the thing you were told you'd be dying for.</b></p>`,
  wrong:[
    {b:"There is no wooden horse in the Iliad.", p:"It's in the <em>Odyssey</em>, briefly, and the great account is in Virgil, seven centuries later. The Iliad ends with Troy intact."},
    {b:"There is no Achilles' heel, either.", p:"The invulnerability and the heel are later additions. Homer's Achilles is simply the best fighter alive, and he knows he is going to die."},
    {b:"The gods are not majestic.", p:"They are vain, petty, and unserious — bickering, sulking, cheating, getting wounded and running home to complain. The mortals are the only ones with dignity, precisely because they can die."},
    {b:"Helen is barely in it, and Homer is kind to her.", p:"She is given a handful of scenes, and in them she is bitter, ashamed, and self-lacerating. The poem does not blame her, and the old men on the wall, watching her pass, admit they'd have done the same."}
  ],
  take:`<p>The Iliad is not a celebration of heroism. It is an autopsy of it. Simone Weil, writing in 1940 as France fell, said the poem's true hero is <em>force</em> — the thing that turns a human being into a corpse, and turns the man who wields it into a thing as well, before it kills him too. Every warrior in the poem is briefly a god and then meat, and Homer refuses to make the transition dignified.</p>`,
  counter:`<p>That reading was born in an occupied country in 1940 and it smells of it. For seven hundred years the Greeks read this poem as the supreme handbook of excellence — Alexander slept with a copy under his pillow and modelled his life on Achilles. If the Iliad is an anti-war poem, it is the least effective one ever written, having successfully inspired roughly three thousand years of men to go and get killed. Perhaps it is not against war. Perhaps it simply refuses to lie about it, which is a different and rarer thing.</p>`,
  people:[
    {ref:"achilles", here:"The best there is — petulant, monstrous, and the only man in the poem who says aloud that the whole heroic bargain is a swindle. His rage is the subject."},

    {k:"Hector", v:"Troy's defender. Husband, father, decent man, fighting a war he did not want, started by his idiot brother. He is the most sympathetic person in the poem and he loses."},
    {k:"Patroclus", v:"Achilles' companion. The nature of the relationship was already being argued about in antiquity — Plato's <em>Symposium</em> has them debating which of the two was the lover. What is not in doubt is that his death is the hinge of the poem."},
    {k:"Priam", v:"King of Troy. Fifty sons. Watches most of them die. Gets the greatest scene in the poem."},
    {k:"Briseis", v:"The captive woman whose transfer starts everything. She has eight lines. She mourns Patroclus, because he was kind to her."},
    {k:"Andromache", v:"Hector's wife. Knows exactly what will happen to her when the city falls, and says so, to his face."},
    {k:"Thetis", v:"Achilles' mother, a sea-goddess (a Nereid). Knows her son is going to die and has to keep helping him do it. She begs Zeus to turn the war against the Greeks to restore her son's honour — so the deaths of Books 1–16 trace back to a mother's request."},
    {ref:"zeus"},
    {ref:"hera", here:"At Thetis's request Zeus favours Troy; Hera fights him at every turn to see it fall."},
    {ref:"athena", here:"At the climax she tricks Hector into standing his ground so Achilles can kill him."},
    {ref:"apollo", here:"Fights for Troy; opens the poem by raining plague on the Greek camp."},
    {ref:"aphrodite"},
    {ref:"ares"},
    {ref:"paris"},
    {ref:"menelaus"},
    {ref:"helen"},
    {ref:"odysseus", here:"One of the Greek captains; the embassy that tries to coax Achilles back is led partly by him."},
    {ref:"agamemnon", here:"His seizure of Achilles' prize is the insult that opens the poem and nearly loses the war."},
    {k:"Nestor", v:"The oldest Greek commander. Long-winded, wise, forever telling the young men how much better warriors were in his day. The voice of counsel."},
    {k:"Ajax", v:"The giant of the Greek army, a wall of a man who holds the line when others break. Second only to Achilles in strength — he defends the ships when the Trojans nearly burn them."},
    {k:"Diomedes", v:"A Greek hero so favoured by Athena that in one book he wounds two gods — Aphrodite and Ares — in single combat. Homer's picture of the warrior at his peak."},
  ],
  places:[
    {k:"Troy (Ilion)", v:"Hence <em>Ilias</em>, 'the poem of Ilion.' A real city, dug up at Hisarlik in modern Turkey by Heinrich Schliemann, who blasted through the layer he was looking for. Also called Ilium."},
    {k:"The ships", v:"The Greek camp. Not a city — a beachhead. Ten years of men living in the sand, going nowhere."},
    {k:"The Scaean Gates", v:"Where Hector says goodbye to his wife, and where he dies."},
    {k:"Phthia", v:"Achilles' home region in Greece, where he rules the Myrmidons. He talks about it constantly. He never sees it again."},
    {k:"Mount Olympus", v:"The home of the gods, who watch the war like spectators at a match — taking sides, placing bets, and reaching down to save their favourites."},
    {k:"Mycenae", v:"Agamemnon's kingdom, the most powerful city in Greece. 'Rich in gold,' Homer calls it — and archaeology proved him right."},
    {k:"Sparta", v:"Menelaus and Helen's kingdom. Her flight from here is the spark of the war."}
  ],
  terms:[
    {k:"the Myrmidons", v:"Achilles' own troops, fiercely loyal to him alone. When he withdraws, they withdraw — which is why his sulk cripples the whole army. The word now means blindly loyal followers."},
    {k:"the Achaeans / Argives / Danaans", v:"All three are Homer's words for 'the Greeks.' There was no word 'Greek' yet; he cycles through the names of their peoples. When you see any of the three, read 'the Greek side.'"},
    {k:"the aegis", v:"Zeus's storm-shield, sometimes carried by Athena — fringed with terror, it routs armies on sight. The word survives in English: to be 'under someone's aegis' is to be under their protection."},
    {k:"menis", v:"The word the poem opens with. Not ordinary anger — the wrath of a god, or of a man behaving like one."},
    {k:"kleos", v:"Glory, fame, the thing that is sung. Literally 'what is heard.' It is the only immortality on offer, and it requires you to die first."},
    {k:"the Homeric simile", v:"The battle stops and you are suddenly among farmers, or wolves, or a woman weighing wool to feed her children. The peacetime world floods in for six lines and then the spear lands. This is where the poem keeps its grief."},
    {ref:"xenia", here:"Paris ate Menelaus's food and left with his wife — the ultimate violation. The whole Trojan War is, at bottom, punishment for broken guest-friendship."},
    {k:"aristeia", v:"A hero's hour of supreme excellence, when he cannot be stopped. Every one of them is followed, sooner or later, by his death."},
    {k:"the Homeric Question", v:"Was there a Homer? Milman Parry showed the poems are built from formulaic building blocks — the signature of oral composition — which means 'Homer' may be a tradition rather than a man."}
  ],
  context:`
  <p class="lede">Sung, not written. Composed around 750 BC about a war supposed to have happened five hundred years earlier — the distance between us and Shakespeare.</p>
  <p>It was performed aloud, from memory, by professionals, for audiences who already knew the story. Which means Homer is never telling you what happens next. He is telling you <em>how</em> it happens, and everybody in the room already knows Hector is going to die, and Homer knows they know, and he makes you watch him say goodbye to his wife anyway.</p>`,
  echoes:[
    {k:"→ The Epic of Gilgamesh", to:"gilgamesh", v:"The template, 1,500 years earlier: the mightiest warrior alive destroyed not by an enemy but by grief for the man he loved. Achilles and Patroclus are Gilgamesh and Enkidu."},
    {k:"→ The Odyssey", to:"odyssey", v:"The sequel that inverts everything: cunning instead of force, home instead of glory, a man who wants to live."},
    {k:"→ The Aeneid", to:"aeneid", v:"Virgil rewrites this poem for the Romans and gives it to the losing side. The Trojans win in the end."},
    {k:"→ The Republic", to:"republic", v:"Plato throws Homer out of the ideal city for exactly the reasons the poem is great: it makes you feel things about the wrong people."},
    {k:"→ Antigone", to:"antigone", v:"The refusal to bury the dead — Achilles dragging Hector's corpse — becomes the central crime of Greek tragedy. Everything in Greek tragedy starts here."},
    {k:"→ Ulysses", to:"ulysses", v:"Joyce's whole method depends on you feeling the gap between Achilles' battlefield and a man buying a kidney for breakfast."}
  ]
},

"odyssey": {
  file:"02", title:"The Odyssey", author:"Homer", date:"c. 700 BC",
  form:"Epic · 24 books · sung",
  read:"Brief: 5 min",
  spineLabel:"What happens",
  oneline:"A goddess offers him immortality and eternal youth on a beautiful island, and he says no, because he wants to go home to his middle-aged wife on a rock.",
  spine:`
  <p class="lede">Troy has fallen. Everyone else has gone home. Odysseus has been missing for twenty years.</p>
  <p>We find him not adventuring but <b>weeping</b> — held on an island by the goddess Calypso, who loves him and has offered to make him a god, deathless and ageless, forever. He sits on the shore every day looking at the water, and he turns her down.</p>
  <p>Meanwhile in Ithaca, a hundred and eight young men have moved into his house. They are eating his herds, harassing his servants, courting his wife Penelope, and planning to murder his son. Penelope holds them off with a trick: she'll choose a husband when she finishes weaving a shroud — and every night, in the dark, she unpicks the day's work. It buys her three years.</p>
  <p>Odysseus gets off the island, is shipwrecked, washes up naked in front of a princess, and — over dinner with strangers — tells the story everyone remembers: the Cyclops, the witch Circe, the descent to the dead, the Sirens, Scylla and Charybdis, the cattle of the sun. <b>He loses every single one of his men.</b> He arrives home alone.</p>
  <p>And then the poem does the strange thing. Instead of a triumphant return, he lands in disguise as a filthy beggar — and stays that way for twelve books. He is mocked in his own hall. He is kicked. He watches his wife weep for him and says nothing. He is testing them: the swineherd, the nurse, the son, the maids, the wife. Working out, after twenty years, who is still his.</p>
  <p>Then the bow, and the slaughter, and a scene between a husband and a wife about a bed.</p>`,
  why:`
  <p class="lede">This is the first thing shaped like a novel, and the first hero who wins by lying.</p>
  <p>The Iliad's world runs on force. This one runs on <em class="g">metis</em> — cunning, trickery, adaptability. Odysseus is called <em>polytropos</em> in the first line: the man of many turns. Many-travelled. Many-twisted. Devious. It's a compliment and an accusation in the same word, and no translator has ever managed both.</p>
  <p>But the reason the poem matters is what he refuses. Calypso offers immortality — the thing Achilles died to get a copy of — and Odysseus, who is not a fool, turns it down for a rocky island, an ageing wife, and a death. <b>The Odyssey is the argument that a mortal, particular, ordinary life is worth more than eternity in paradise</b>, and it makes that argument by putting paradise on the table for seven years and having the hero cry on the beach.</p>`,
  sticky:[
    {h:"He turns down immortality.", p:"Calypso offers to make him deathless and ageless, forever, on a beautiful island, with a goddess. He says: I know my wife is nothing next to you, and she'll grow old and I'll die. I want to go home anyway."},
    {h:"'Nobody.'", p:"Trapped by the Cyclops, he says his name is Nobody. So when he blinds the giant and the neighbours hear the screaming and ask who's hurting him, Polyphemus roars: <em>Nobody is killing me!</em> — and they go back to bed. Perfect. Then, sailing safely away, Odysseus cannot resist standing up and shouting his real name across the water. That boast buys him ten more years of Poseidon's rage. His brain saves him; his ego costs him a decade."},
    {h:"The dog.", p:"Argos, the puppy he raised before he left, now twenty years old, lying on a heap of dung, covered in ticks. He sees his master through the beggar's rags. He hasn't the strength to get up. He wags his tail once, and dies. Odysseus, still in disguise, has to turn his face away and wipe off a tear."},
    {h:"The bed.", p:"Penelope, who does not believe he is who he says, casually orders a servant to move their marriage bed out of the bedroom. He explodes — <em>who moved my bed?</em> — because he built it himself around a living olive tree still rooted in the ground, and it cannot be moved by anyone. Only two people alive know that. She has out-tricked the trickster, and only then does she let herself run to him."},
    {h:"She unpicks the shroud every night.", p:"Three years of it. Weaving by day in front of the suitors, undoing it in the dark. She is his equal, and the poem knows it — they are two liars who found each other."}
  ],
  idea:`
  <p class="lede">Coming home is not arriving. It's being recognised — and having to earn it.</p>
  <p>The monsters take four books. <b>Twelve</b> are Odysseus sitting in his own house in rags, being insulted at his own table, finding out who stayed loyal. The poem's claim is that the hard part was never the sea. It was walking back into a life that has gone on without you and proving you are still the man who left.</p>
  <p>Portable version: <b>you can survive anything and still not be let back in.</b></p>`,
  wrong:[
    {b:"It's mostly not about monsters.", p:"The Cyclops, Circe, the Sirens — that's Books 9 to 12, told as a flashback at a dinner party, by an unreliable narrator with a strong incentive to make himself sound good. The rest is domestic tension in a house full of hostile men."},
    {b:"The Sirens don't offer beauty.", p:"They offer <em>knowledge</em>. They promise to tell him everything that happened at Troy, and everything that happens on earth. That's what he ties himself to the mast for, and it is exactly the right temptation for this man."},
    {b:"He isn't faithful.", p:"He spends a year with Circe and seven with Calypso while Penelope holds off a hundred men. The poem does not treat these as equivalent, and it is worth noticing that it doesn't."},
    {b:"It doesn't end at the reunion.", p:"After the bed, there's another book: the families of the murdered suitors come for revenge, and a goddess has to descend and impose an amnesty by force. Ithaca is one scene away from civil war when the poem stops."}
  ],
  take:`<p>Odysseus is not admirable, and the poem knows it. He is a liar, a self-mythologiser, and a man who lost 600 men and came home alone. The killing of the suitors is staged as housekeeping — and then he hangs twelve slave girls in a row for sleeping with the men occupying his house, which is one of the coldest passages in literature. He is the man who <em>came home</em>. That is not the same as the man who deserved to.</p>`,
  counter:`<p>Odysseus is being tried under laws the poem has never heard of. The Homeric universe runs on <em>xenia</em> — the sacred bond between host and guest — and the suitors have spent four years eating another man's house, abusing his servants, and plotting to kill his child. They are not boyfriends; they are an occupation. In the poem's terms the slaughter is not a massacre but the restoration of law, and the maids were collaborators. You are entitled to find it horrifying. You are not entitled to find it inconsistent.</p>`,

    {k:"Polyphemus", v:"The Cyclops. A shepherd who eats guests — the total inversion of <em>xenia</em>. Also Poseidon's son, which is the problem."},
    {k:"Eumaeus", v:"The swineherd. A slave who feeds a beggar the last of his own food, not knowing it's his king. The moral centre of the poem is a man who owns nothing."},

    {k:"Hermes", v:"The messenger god (Roman <b>Mercury</b>). Twice a rescuer here: he orders Calypso to release Odysseus, and gives him the herb that protects him from Circe's magic."},
    {k:"Nausicaa", v:"The young princess of the Phaeacians who finds the naked, shipwrecked Odysseus washed up on her beach — and, instead of screaming, gives him clothes and sends him to her parents' court. One of the most charming figures in Homer."},
    {k:"Alcinous & Arete", v:"King and queen of the Phaeacians, who host the shipwrecked Odysseus and listen to his whole story. It is at their dinner table that the famous adventures — Cyclops, Sirens, the rest — are told, as a flashback."},

    {k:"Argos (the dog)", v:"Odysseus's dog. He raised the puppy before leaving for Troy; twenty years later the old dog, lying on a dung-heap, recognises his master through the beggar's disguise, wags his tail once, and dies. The most famous animal in ancient literature."},
    {k:"The Sirens", v:"Creatures whose song lures sailors to their death on the rocks. They tempt not with beauty but with <em>knowledge</em> — they promise to tell Odysseus everything. He has himself tied to the mast so he can hear them and survive."},
    {k:"Scylla & Charybdis", v:"Two sea-monsters guarding a narrow strait — a six-headed cliff-beast and a whirlpool. To pass, Odysseus must sail close to one and lose six men, or risk the other and lose everyone. The origin of 'between a rock and a hard place.'"},

  places:[

    {k:"The house of Hades", v:"The underworld — realm of the dead, ruled by the god Hades (Roman <b>Pluto</b>). Odysseus sails to its edge to consult a ghost. There Achilles tells him he'd rather be a landless serf alive than king of all the dead — the Iliad's whole bargain, repudiated by the man who took it.", to:"iliad"},
    {k:"The land of the Lotus-Eaters", v:"An island whose flower, once eaten, makes men forget home and want only to stay. Odysseus has to drag his weeping crew back to the ships. The first temptation of the voyage, and the pattern for all of them: comfort that erases the will to go home."},

  terms:[
    {k:"nostos", v:"Homecoming, return. Our word 'nostalgia' is nostos + algos: the <em>pain</em> of homecoming. That is what this poem is."},
    {k:"metis", v:"Cunning intelligence. Practical, improvised, morally slippery. The counterweight to brute force, and the poem's actual subject."},
    {k:"polytropos", v:"The first word applied to him. 'Of many turns.' Fitzgerald: 'skilled in all ways of contending.' Fagles: 'of twists and turns.' Wilson: 'complicated.' No two translators agree, which is the point."},
    {ref:"xenia", here:"The engine of the plot's morality: the Cyclops breaks it by eating guests, the suitors break it by looting their host, and the slaughter at the end is the bill coming due."},
    {k:"the Cyclopes", v:"A race of one-eyed giants, lawless shepherds with no towns and no manners. Polyphemus, the one Odysseus blinds, is the son of Poseidon — which is why the sea itself turns against him."},
    {k:"the shroud of Laertes", v:"Penelope's three-year delaying trick: she swears she'll choose a new husband once she finishes weaving a burial cloth for old Laertes — and secretly unravels each night's work every night. Cunning to match her husband's."}
