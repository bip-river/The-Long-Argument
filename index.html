"quixote": {
  file:"09", title:"Don Quixote", author:"Miguel de Cervantes", date:"1605 & 1615",
  form:"Novel · two parts · very long",
  read:"Brief: 5 min",
  spineLabel:"What happens",
  oneline:"A man reads too many books, decides to live inside them, and is systematically destroyed by everyone who finds this funny — including, eventually, the reader.",
  spine:`
  <p class="lede">A minor country gentleman in his fifties reads chivalric romances until, Cervantes says, his brain dries up. He decides to become a knight-errant — a profession that has not existed for three hundred years and possibly never did.</p>
  <p>He puts on rusted ancestral armour, renames his broken-down horse <b>Rocinante</b>, renames himself <b>Don Quixote de la Mancha</b>, and selects a lady to devote his life to: a peasant girl from a nearby village, whom he may have glimpsed once, and whom he renames <b>Dulcinea del Toboso</b>. She never appears in the book. Not once, in a thousand pages.</p>
  <p>He recruits a neighbour, <b>Sancho Panza</b> — illiterate, hungry, endlessly proverbial — with the promise of an island to govern. And they go out.</p>
  <p>He attacks windmills, believing them giants. He charges a flock of sheep, believing them an army. He takes a barber's brass basin for a golden helmet, an inn for a castle, and a prostitute for a princess. He frees a chain gang of convicts, who thank him by stoning him. He is beaten, mocked, trampled, and thrown in a blanket, over and over.</p>
  <p><b>And then Part II happens, ten years later, and everything inverts.</b> In Part II the characters have <em>read Part I.</em> Don Quixote is famous. Strangers recognise him from the book. A Duke and Duchess, bored and rich, take him in and construct elaborate theatrical fantasies purely to watch him respond — building the chivalry he was mocked for imagining, in order to torment him with it.</p>
  <p>So the joke turns over. In Part I, a madman insists on enchantment in a mundane world. In Part II, <b>the sane people manufacture enchantment to destroy him with</b>, and they are much crueller than he ever was.</p>
  <p>He is finally defeated in a duel by a neighbour in disguise, and made to go home. He takes to his bed. And he wakes up <b>sane</b> — renounces the books, by name, calmly, declares that he is not Don Quixote but Alonso Quixano, a good man — and dies. Sancho, sobbing, begs him not to. <em>Don't die, master. Let's go out again.</em></p>`,
  why:`
  <p class="lede">This is the first modern novel, and the reason is precise.</p>
  <p>Not because it's long, or in prose, or about ordinary people. Because it is the first book built entirely on <b>the gap between the world and one person's insistence on seeing it differently</b> — and the first that knows it is a book.</p>
  <p>Cervantes claims he did not write it. He says he found the manuscript in a market in Toledo, in Arabic, by a Moorish historian called Cide Hamete Benengeli, and had it translated — and then he warns you that Moors are liars, so the account may be false. That's the frame. In <b>1605</b>.</p>
  <p>And it is the first great double act. Quixote and Sancho are not a hero and a sidekick; they <em>change each other</em>. Over a thousand pages Sancho slowly becomes more quixotic — he starts believing, he governs his fake island wisely and justly, he chooses the dream — while his master slowly comes back to earth. They trade places, in slow motion, and neither of them notices.</p>`,
  sticky:[
    {h:"The windmills are one chapter out of a hundred and twenty-six.", p:"Everybody knows the windmills. It's three paragraphs, it happens early, and it is over. The book is a thousand pages long and the famous image is a rounding error inside it."},
    {h:"Dulcinea does not exist.", p:"The lady he dedicates his life, his suffering, and every victory to is a farm girl he may have seen once, whom he has renamed. She never appears. He has invented an entire love out of nothing, and it holds him up for a thousand pages, and it works."},
    {h:"In Part II, everyone has read Part I.", p:"The characters know they are in a bestseller. Strangers recognise him and stage cruelties <em>because</em> they've read about him. And when a rival published a pirated fake sequel in 1614, Cervantes wrote <b>that</b> into his own Part II — his characters meet readers of the counterfeit and denounce it as false, and he re-routes his plot so the fake cannot be true. This is 1615."},
    {h:"Sancho is a good governor.", p:"Given a fake island purely so the Duke can laugh at him, Sancho rules it — and rules it justly, cleverly, and with mercy. Then he walks away from it, having discovered he doesn't want it. The joke was on the people watching."},
    {h:"He gets better, and it kills him.", p:"At the very end he wakes up sane, renounces the books he loved, and dies quietly as Alonso Quixano the Good. Sancho weeps at the bed and begs him to stay mad. <b>The saddest ending in literature is a man recovering.</b>"}
  ],
  idea:`
  <p class="lede">Everyone is running a private fiction about who they are. His is just louder, and he paid for his.</p>
  <p>The book will not tell you whether he is a fool or a saint, and the refusal is the point. But notice the harder thing underneath: <b>he is the only person in the novel who has decided what he values and accepted the cost.</b> Everyone who laughs at him is coasting on borrowed sense, and in Part II they turn out to be capable of a cruelty he never once shows.</p>
  <p>Portable version: <b>the question is not whether your picture of the world is accurate. It's whether you'd pay for it.</b></p>`,
  wrong:[
    {b:"It is not a charming children's book.", p:"Part I is savage. He is beaten unconscious, has teeth knocked out, is trampled by pigs, and is humiliated by nearly everyone he meets. Nabokov taught it at Harvard and called it a cruel and crude book, an encyclopaedia of humiliation, and he had a point."},
    {b:"'The Impossible Dream' is not in it.", p:"The 1965 musical <em>Man of La Mancha</em> is a romantic inversion of the ending. The novel does not celebrate the dream. It cures him of it, and then it kills him, and it makes you watch."},
    {b:"Cervantes and Shakespeare did not die on the same day — or even the same date.", p:"Two errors stacked on each other. Cervantes died on <b>22 April</b> and was <em>buried</em> on the 23rd — Spanish records logged burials, not deaths. And Shakespeare's 23 April was <b>Julian</b>; England hadn't adopted the Gregorian calendar Spain was using. In real time they died about <b>eleven days apart</b>. The most beautiful coincidence in literary history is two clerical errors holding hands."},
    {b:"'Tilting at windmills' is not the theme.", p:"It's a gag in chapter eight. The theme is what happens when a fiction is more habitable than the world, and who gets punished for saying so."}
  ],
  take:`<p>The greatness of the book is that it will not adjudicate. Every era has read it and come back with a different verdict — the seventeenth century laughed at him, the Romantics made him a hero, the twentieth century made him a martyr, Nabokov called it a handbook of cruelty. It is a mirror and it does not care what you see in it.</p>`,
  counter:`<p>There is a case that the ending is not ambiguous at all. Cervantes has him <b>explicitly renounce the books</b>, by name, in a will, and die a sane Christian death under his real name. The author put a sword through the fantasy on purpose, in the last chapter, deliberately. Every romantic reading since — every impossible dream, every noble madman — is a refusal to read the final ten pages. Perhaps the book is simply against the dream, and we have spent four hundred years being unable to accept that.</p>`,
  people:[
    {k:"Don Quixote", v:"Alonso Quixano, a nobody with a small estate and too much time. Courteous, learned, generous, and completely wrong about everything he can see."},
    {k:"Sancho Panza", v:"Illiterate, hungry, greedy, wise. Speaks in a torrent of proverbs. He is the one who actually grows — and he is the one who, at the end, refuses to let the dream go."},
    {k:"Dulcinea", v:"Aldonza Lorenzo, a farm girl who cures pork and has, we are told, a very loud voice. Renamed into a goddess. Absent for the entire novel."},
    {k:"Rocinante", v:"The horse. Named for hours, by a man who took four days to name himself. Bony, slow, and heroic by association."},
    {k:"Cide Hamete Benengeli", v:"The fictional Moorish historian Cervantes claims actually wrote the book, and whom the narrator warns you may be lying. A fake author, inside a frame, undermined by the frame. 1605."},
    {k:"The priest and the barber", v:"Don Quixote's friends from his village, who burn most of his chivalry books trying to cure him and keep scheming to bring him home. The voice of ordinary sanity trying, and failing, to reclaim him."},
    {k:"The windmills", v:"The most famous scene in the book: Quixote charges a row of windmills, convinced they are giants with waving arms, and is thrown by his lance catching a sail. 'Tilting at windmills' — attacking imaginary enemies — comes from this page, though it is only one episode of hundreds."},
    {k:"The Duke and Duchess", v:"Rich, bored, and the villains of Part II — though nobody in the book seems to notice they are villains. They stage elaborate fantasies for a madman's benefit and laugh at what they've built."},
    {k:"Sansón Carrasco", v:"The neighbour who dresses as a knight to defeat him and drag him home — for his own good. He wins, and it kills the man he came to save."},
    {k:"Avellaneda", v:"Whoever he was. Published a fake Part II in 1614 to cash in. Cervantes obliterated him by writing him into the real one."}
  ],
  places:[
    {k:"La Mancha", v:"Dry, flat, dusty, poor. The least romantic landscape in Spain, which is the joke, and Cervantes opens the book refusing to remember the name of the village."},
    {k:"El Toboso", v:"Where Dulcinea supposedly lives. They go there. They cannot find her. Obviously."},
    {k:"The inn", v:"A castle. It is not a castle. It is an inn."},
    {k:"Barcelona", v:"The only real, named, unmistakable city in the book — and the place where he is defeated and broken. Reality has an address."},
    {k:"Algiers", v:"Not in the book — in Cervantes' life. He spent five years there as a slave after being captured by pirates, and attempted escape four times. He was maimed at the battle of Lepanto and lost the use of his left hand. He was fifty-seven when Part I appeared."}
  ],
  terms:[
    {k:"quixotic", v:"One of the very few English words taken from a character. It means noble, deluded, and doomed — and the fact that we needed the word tells you the book found something real."},
    {k:"baciyelmo", v:"Sancho's coinage: <em>basin-helmet</em>. A word for a thing that is genuinely both — a barber's basin and Mambrino's golden helmet at once. It is the entire philosophy of the novel in one invented noun."},
    {k:"picaresque", v:"The episodic road-novel of a low-life rogue. Cervantes takes the form and puts a soul inside it."},
    {k:"metafiction", v:"Fiction aware of itself as fiction. Everyone thinks it was invented in the 1960s. It was invented here, and more thoroughly."}
  ],
  context:`
  <p class="lede">Spain in decline, writing about a man who cannot accept that the age of glory is over.</p>
  <p>The Armada had failed. The empire was bankrupt. And the runaway bestsellers of the age were chivalric romances — enormous, formulaic, escapist fantasies about knights, which everybody read and nobody defended, exactly like airport thrillers. Cervantes — maimed veteran, ex-slave, failed tax collector, twice imprisoned, broke, fifty-seven — set out to write a parody of the trash of his day.</p>
  <p>He accidentally invented the novel, and it did not make him rich.</p>`,
  echoes:[
    {k:"→ Hamlet", to:"hamlet", v:"Written within five years of each other, and the same discovery from two directions: a man whose inner life has come loose from the world he has to act in."},
    {k:"→ Moby-Dick", to:"moby-dick", v:"Ahab is Quixote with a harpoon and no sense of humour — a man who insists reality has a meaning it refuses to admit, and drags everyone down proving it."},
    {k:"→ The Brothers Karamazov", to:"karamazov", v:"Dostoevsky said outright that Don Quixote was his model for the attempt to write a genuinely good man, and that it is the saddest book ever written."},
    {k:"→ Ulysses", to:"ulysses", v:"A dreamer and a practical man walking around all day, changing each other. Joyce inverted the pairing: Bloom is the one with common sense, and Stephen is the one lost in books."},
    {k:"→ Every buddy story ever made", v:"Two people, one road, one dreamer, one realist, and the slow discovery that they have swapped. The form is here, complete, on the first attempt."}
  ]
},

"hamlet": {
  file:"10.1", title:"Hamlet", author:"William Shakespeare", date:"c. 1600",
  form:"Tragedy · his longest play",
  read:"Brief: 5 min",
  spineLabel:"What happens",
  oneline:"A revenge tragedy in which the revenge does not happen — for four acts — because the hero keeps thinking, and thinking is the one thing the genre cannot survive.",
  spine:`
  <p class="lede">The King of Denmark is dead. Within a month his brother <b>Claudius</b> has taken the throne and married the widow. Their son, Hamlet, is home from university, in black, and furious that nobody else seems to mind.</p>
  <p>Then his father's ghost appears on the battlements and says he was <b>murdered</b> — poison poured in his ear while he slept — by Claudius. It demands revenge.</p>
  <p>And Hamlet... doesn't.</p>
  <p>He puts on an "antic disposition" — pretending to be mad, or possibly not entirely pretending. He is savage to Ophelia, the girl who loves him. He stages a play re-enacting the murder to watch Claudius's face, and Claudius bolts from the room, which is all the proof anyone could want.</p>
  <p>Then he finds Claudius alone, on his knees, praying — <b>and doesn't kill him</b>, because a man killed at prayer goes to heaven, and Hamlet wants him damned. It is the most terrifying reason anyone has ever given for sparing a life. (Claudius then stands up and admits his prayer was worthless anyway.)</p>
  <p>He goes to confront his mother, hears someone behind a curtain, stabs blind — and it's Polonius, Ophelia's father. He shrugs. That accident sets off everything that follows: Ophelia goes mad and drowns; her brother Laertes comes home wanting blood.</p>
  <p>Shipped to England with two schoolfriends carrying a sealed order for his execution, Hamlet forges a replacement naming <em>them</em>, and they are killed, and he mentions it in passing, without a flicker.</p>
  <p>He comes back. He holds a skull in a graveyard. Then a rigged duel: a poisoned blade, a poisoned cup. His mother drinks it. Laertes cuts him, he takes the sword and cuts Laertes, Laertes confesses — and Hamlet finally, in the last ninety seconds of a four-hour play, kills Claudius.</p>
  <p>Everyone is dead. A foreign prince walks into the empty throne room and takes the country.</p>`,
  why:`
  <p class="lede">Before Hamlet, characters told you what they intended. Hamlet talks himself <em>into</em> and <em>out of</em> positions, live, in front of you — and changes as a result of hearing himself think.</p>
  <p>That is the invention: <b>self-overhearing</b>. A character with an interior larger than the plot requires, who is opaque to himself, and who becomes a different person over the course of a speech. Every protagonist who is a mystery to themselves is standing behind him.</p>
  <p>And the delay is not a defect — it is the subject. Shakespeare took the crudest, most reliable genre available, the Elizabethan revenge thriller, and installed inside it a mind for which the demand to <em>act</em> is an insult to his intelligence. The play is the first sustained demonstration that consciousness and action are enemies.</p>`,
  sticky:[
    {h:"He has one clear shot and passes.", p:"Claudius, alone, kneeling, defenceless. Hamlet draws — and stops, because killing him mid-prayer would send him to <b>heaven</b>, and Hamlet wants his soul as black as damnation. He sheathes the sword to get a worse revenge later. Then Claudius rises and says his prayer never left the ground."},
    {h:"He kills the wrong man through a curtain and barely reacts.", p:"He hears a noise behind the arras and stabs it. It's Polonius, an old man. Hamlet's entire response: <em>thou wretched, rash, intruding fool, farewell.</em> That one careless thrust causes every death in the rest of the play."},
    {h:"'Alas, poor Yorick' — he never says 'I knew him well.'", p:"He says <em>I knew him, Horatio.</em> The misquote is universal. And he is not holding the skull during 'To be or not to be' — different scene, different act, two hours apart. Every poster ever printed is wrong."},
    {h:"The Ghost might be lying, and Hamlet says so.", p:"He states openly that the devil can take a pleasing shape and prey on a grieving man. That is <em>why</em> he stages the play — he needs evidence. Which means the famous paralysis may not be neurosis at all. It may be <b>epistemology.</b>"},
    {h:"Shakespeare's son was called Hamnet. He died at eleven, four years before the play.", p:"The names were interchangeable in the period — the same name, spelled by ear. Nobody can prove anything from it, and nobody who learns it can quite stop thinking about it."}
  ],
  idea:`
  <p class="lede">Thought is not a preparation for action. It is a substitute for it.</p>
  <p>Portable version: <b>the more completely you understand a situation, the harder it becomes to move inside it.</b> Everyone in the play who acts without thinking gets what they want — and Hamlet, who sees everything with total clarity, spends four acts producing corpses by accident.</p>`,
  wrong:[
    {b:"He is not indecisive by temperament.", p:"He kills Polonius instantly. He boards a pirate ship in a fight. He forges a death warrant and sends two friends to be executed without a second thought. He is ferociously decisive about everything <em>except</em> the one act he has been ordered to perform."},
    {b:"'To be or not to be' is not a decision to kill himself.", p:"It's a general meditation — why does anyone endure anything — and its answer is that we're frightened of what comes after. It also, notoriously, is spoken by a man who has just been told exactly what comes after by a ghost he apparently no longer trusts."},
    {b:"There is no single text.", p:"Three early versions survive and they do not agree, including one so different it is called the 'bad quarto.' The Hamlet you read is an editorial construction, stitched from sources by scholars centuries later."},
    {b:"The Ghost's theology is illegal.", p:"It says it comes from Purgatory. Protestant England had <em>abolished</em> Purgatory. Meanwhile Hamlet is a student at Wittenberg — Luther's own university. The play's premise is quietly, deliberately heretical, and every Elizabethan in the theatre would have felt it."}
  ],
  take:`<p>The delay is not a flaw to be explained away. It's the point. Shakespeare put a modern consciousness inside a medieval revenge plot and let it tear the plot apart from the inside. A mind that genuinely sees a situation whole cannot obey a simple instruction about it, and that is a permanent condition of being intelligent.</p>`,
  counter:`<p>For two centuries this reading has been made mostly by people who think for a living — who conclude, unsurprisingly, that the man who thinks too much is the hero. Now look at what his thinking actually produces. A girl driven mad and drowned. An old man stabbed through a curtain. Two schoolfriends executed on a forged warrant, dismissed in a line. His mother poisoned. A kingdom handed to a foreign army. Shakespeare deliberately put <b>two</b> other men in this play who avenge their fathers — Laertes and Fortinbras — and both act at once, and one of them ends the play owning Denmark. The play may be considerably less impressed by Hamlet's mind than Hamlet is.</p>`,
  people:[
    {k:"Hamlet", v:"Thirty (the gravedigger says so), a student, brilliant, cruel, grieving, and the first person in literature you cannot get to the bottom of."},
    {k:"Claudius", v:"The villain — and a competent king, a genuinely loving husband, and the only man in the play who kneels down and tries to repent. Shakespeare gives him an interior, which is what makes him unbearable."},
    {k:"Gertrude", v:"The mother. Remarried in a month. The play never once tells you whether she knew about the murder, and this is not an oversight."},
    {k:"Ophelia", v:"Used by her father, discarded by Hamlet, driven mad, and drowned — possibly by accident, possibly not. She is given about 170 lines and she haunts the entire play."},
    {k:"Polonius", v:"Windbag, spy, dangerous fool. Gives his son the most quoted advice in English ('to thine own self be true') while hiring men to spy on him abroad."},
    {k:"The Ghost", v:"Hamlet's dead father, the murdered king, who appears on the battlements demanding revenge. The engine of the plot — but Hamlet cannot be sure whether it is honest or a devil in his father's shape, and that doubt is half the delay."},
    {k:"Laertes (Hamlet)", v:"Polonius's son and Ophelia's brother. When <em>his</em> father is murdered he acts at once, with no hesitation at all — the exact foil to Hamlet, who has the same task and cannot move. Their poisoned duel ends the play."},
    {k:"Rosencrantz &amp; Guildenstern", v:"Hamlet's old schoolfriends, summoned by the king to spy on him. Pliable, out of their depth, and sent unknowingly to their deaths — the small men crushed between great ones. Later given their own play by Tom Stoppard."},
    {k:"Horatio", v:"The only person Hamlet trusts, and the only one left alive at the end, ordered to stay and tell the story. He is the reason the play exists inside its own fiction."},
    {k:"Fortinbras", v:"The Norwegian prince who marches an army across a continent to fight over a worthless scrap of land, never hesitates, never soliloquises, and walks into the throne room at the end and takes Denmark without drawing a sword."}
  ],
  places:[
    {k:"Elsinore", v:"A real castle — Kronborg, in Denmark. Cold, watched, full of listeners behind curtains. Everyone in this play is spying on somebody."},
    {k:"Wittenberg", v:"Where Hamlet studies. Luther's university, the birthplace of the Reformation. He is a Protestant student being given orders by a Catholic ghost."},
    {k:"The play-within-the-play (The Mousetrap)", v:"Hamlet stages a murder mirroring his father's to watch Claudius react — 'the play's the thing wherein I'll catch the conscience of the king.' The king flinches, and Hamlet has his proof. Theatre used as a lie-detector."},
    {k:"The graveyard", v:"Where the play stops being about Denmark and becomes about everybody. A skull, a joke, and the news that Alexander the Great is now a plug of clay stopping a beer barrel."}
  ],
  terms:[
    {k:"soliloquy", v:"Not a speech to the audience — a mind talking to itself and being overheard. Shakespeare didn't invent the device; he invented what it could do."},
    {k:"antic disposition", v:"The madness Hamlet announces in advance that he will fake — which raises the question every production has to answer: how much of it is faked?"},
    {k:"the objective correlative", v:"T. S. Eliot's charge: that Hamlet's emotion is <em>bigger than anything in the play justifies</em>, which makes it, in Eliot's word, an artistic failure. He may be wrong. He is not stupid, and the observation is uncomfortably sharp."},
    {k:"revenge tragedy", v:"A rigid, popular Elizabethan genre: ghost, delay, madness, a play-within-a-play, a pile of bodies. Shakespeare hit every single mark and destroyed the form by taking it seriously."}
  ],
  context:`
  <p class="lede">Around 1600. Elizabeth I was old, childless, and the succession was both unresolved and illegal to discuss.</p>
  <p>Writing openly about who inherits a throne could get you imprisoned. So the theatres wrote about Denmark instead, and everyone understood. Within two years, the Earl of Essex would attempt a coup and be executed, and Shakespeare's own company would be questioned for staging a play about a deposed king the night before.</p>
  <p>Shakespeare's father died in 1601. His only son, Hamnet, had died in 1596, aged eleven.</p>`,
  echoes:[
    {k:"→ Montaigne", to:"montaigne", v:"Shakespeare read Montaigne in Florio's 1603 translation; Hamlet's self-watching, essaying mind is the stage's closest kin to the Essays, and the borrowings in Lear and The Tempest are provable."},
    {k:"→ The Oresteia", to:"oresteia", v:"Orestes is given the identical order — a father murdered, a mother in the murderer's bed, a command to kill — and he does it in a single scene. Hamlet cannot do it in five acts. The gap between those two plays is the whole invention of the modern interior."},
    {k:"→ Oedipus Rex", to:"oedipus-rex", v:"Freud read them as a pair and built a theory on it: Hamlet cannot kill the man who did the thing he secretly wanted to do. Whether or not you buy it, it has been impossible to un-hear for a century."},
    {k:"→ Don Quixote", to:"quixote", v:"Same five years, same discovery from the other side: an inner life that has come unglued from the world it has to act in. One man acts on his fiction; the other cannot act at all."},
    {k:"→ Ulysses", to:"ulysses", v:"Stephen Dedalus devotes an entire chapter to arguing that Shakespeare is not the prince but the <em>murdered father</em> — and that Hamnet is the son. Joyce built a novel about a man who lost a son around that theory."}
  ]
},

"lear": {
  file:"10.2", title:"King Lear", author:"William Shakespeare", date:"c. 1606",
  form:"Tragedy · no consolation",
  read:"Brief: 5 min",
  spineLabel:"What happens",
  oneline:"An old man asks his three daughters to say how much they love him, in public, for money — and the only one who refuses is the only one who does.",
  spine:`
  <p class="lede">Lear, old, decides to divide his kingdom between his three daughters. But first they must say, aloud, in front of the court, how much they love him. The largest share goes to whoever performs best.</p>
  <p>Goneril and Regan lay it on with a trowel. <b>Cordelia says: "Nothing."</b> She loves him according to her bond — no more, no less — and she will not put a price on it. Lear disinherits her on the spot, banishes the one honest counsellor who objects, and hands everything to the two who lied.</p>
  <p>Then, methodically, they take the rest. They haggle down his retinue of knights — a hundred, fifty, twenty-five, ten, five — until Regan says, flatly: <em>What need one?</em></p>
  <p>He walks out into a storm, on a heath, with nothing, and goes mad. His only company: a Fool who tells him the truth in jokes, a banished servant in disguise, and a naked lunatic beggar. And Lear looks at the naked man and starts tearing off his own clothes: <em>is man no more than this? Unaccommodated man is no more but such a poor, bare, forked animal.</em></p>
  <p>Meanwhile, in the other half of the play, the Earl of Gloucester is tricked by his bastard son into disowning his loyal one — the same story again, with sons. And when Gloucester is caught helping Lear, he is tied to a chair, and they <b>put out his eyes on stage</b>. A servant tries to stop it and is stabbed in the back.</p>
  <p>Cordelia comes back with an army to save her father. They are reunited, and he asks her to forgive him. It is the tenderest scene Shakespeare ever wrote.</p>
  <p>Then her army loses. She is <b>hanged in prison</b>, by an order that is countermanded ninety seconds too late. Lear carries her body onstage and howls, and dies looking at her mouth, thinking — perhaps — that he sees her breathing.</p>`,
  why:`
  <p class="lede">Because nothing answers.</p>
  <p>Every tragedy before this one restores an order at the end. Someone survives who understands; the gods have a plan; the suffering means something. Job, at least, gets a whirlwind — a bad answer, but an <em>answer</em>, and a presence.</p>
  <p>Lear gets silence. Cordelia dies for no reason at all — not fate, not justice, not sacrifice. A messenger was slow. The good are destroyed alongside the wicked, and the heavens, which every single character in the play appeals to, say nothing whatsoever.</p>
  <p>Shakespeare took the oldest question here — <em>does suffering mean anything?</em> — and, alone among these authors, staged the possibility that <b>it simply doesn't</b>, and refused to soften it.</p>`,
  sticky:[
    {h:"'Nothing.'", p:"Asked to price her love for a third of a kingdom, Cordelia says nothing — because love you can auction isn't love. He destroys her for it. The entire play falls out of one word, and out of an old man who wanted a performance instead of the thing itself."},
    {h:"They put out his eyes on stage.", p:"Not reported by a messenger. <em>Done</em>, in front of you. Cornwall grinds Gloucester's eyes out — <em>out, vile jelly</em> — and Regan stabs in the back the servant who tries to stop it. Greek tragedy reported violence. Shakespeare made you watch."},
    {h:"'Never, never, never, never, never.'", p:"Lear, holding his hanged daughter. Five identical words, and it is a perfect line of verse, and it is the bleakest thing in the English language."},
    {h:"The audience could not bear it — for a hundred and fifty years.", p:"From 1681 to 1838, the only <em>King Lear</em> performed in England was Nahum Tate's rewrite, in which Cordelia <b>lives</b>, marries Edgar, and Lear gets his throne back — and <b>the Fool is cut entirely.</b> Samuel Johnson approved, admitting he had been so shocked by Cordelia's death that he could not bear to reread the last scenes. It took an actor named Macready, in 1838, to put the real ending back."},
    {h:"He dies thinking she might be alive.", p:"<em>Look on her, look, her lips, look there, look there.</em> Either he is hallucinating, or he dies in joy at nothing. Shakespeare refuses to tell you which, and every production must choose, and the choice is the whole play."}
  ],
  idea:`
  <p class="lede">Authority is a way of not having to look at anybody.</p>
  <p>Lear has been king for eighty years and has never once seen another human being — not his daughters, not his servants, not the poor of his own kingdom, whom he suddenly notices for the first time only when he is out in the same rain. <em>O, I have ta'en too little care of this.</em></p>
  <p>Take away the crown, the knights, the roof, the sanity, and what is left is not dignity and not a soul. It's an old man in a storm, finding out far too late what other people are.</p>`,
  wrong:[
    {b:"Lear is not a good man wronged.", p:"He is a tyrant. He is vain, violent, and he curses his own daughter with sterility in one of the most horrifying speeches Shakespeare ever wrote. The play does not rehabilitate him. It strips him, and the stripping is the education."},
    {b:"The old story had a happy ending.", p:"Every earlier version — the chronicles, the old play, Spenser — has Cordelia win and Lear restored. Shakespeare <b>chose</b> to kill her. He invented the cruelty on purpose."},
    {b:"It is not really about ingratitude.", p:"That's the frame. The subject is what a human being is once everything protective has been removed, and whether the universe is watching."},
    {b:"Edgar's morals are hollow, and Shakespeare knows it.", p:"Characters keep trying to draw lessons — 'the gods are just' — and the play keeps immediately disproving them. Every attempt to make the suffering mean something is staged, and then contradicted, in the next scene."}
  ],
  take:`<p>This is the first work on this shelf in which the universe does not answer. Job gets a whirlwind. Oedipus gets an oracle that turns out to be true. Dante gets a face inside the light. Lear gets a dead girl in his arms and a messenger who was late, and Shakespeare stages the silence and does not fill it. It is one of the most modern things written before the twentieth century, and Beckett is standing directly behind it.</p>`,
  counter:`<p>The absurdist Lear — the play as a rehearsal for Beckett — is extremely convenient for a secular age that wants Shakespeare on its side. But look at what the play is actually full of. A nameless servant dies trying to stop a torture, for nothing. Kent serves, in disguise, the man who banished him. Edgar carries on his back the father who ordered him killed. Cordelia forgives without being asked to. The nihilist reading has to walk past every one of those and pretend they're decoration. Perhaps the play is not saying the universe is empty. Perhaps it is saying that <b>goodness is real and is not rewarded</b> — which is a harder claim, and a better one, and it is exactly what Job says.</p>`,
  people:[
    {k:"Lear", v:"Eighty and more. A king who has never been contradicted, discovering, in the rain, that he is a man."},
    {k:"Cordelia", v:"Says almost nothing in the entire play. Refuses to perform love, forgives without conditions, and is hanged offstage by a clerk's delay."},
    {k:"Goneril and Regan", v:"Monstrous — and not without a case. Their father is impossible, arrives with a hundred armed men, and has just given away his power while expecting to keep it."},
    {k:"The Fool", v:"Tells Lear the truth, in riddles, because that is the only way a truth can be told to a king. He vanishes in Act 3 and is never explained. Lear's last line about him — <em>and my poor fool is hanged</em> — may be about the Fool, or may be about Cordelia. Nobody knows."},
    {k:"Edmund", v:"The bastard son. The most modern character Shakespeare wrote: he simply does not believe in the cosmology of the play he is in — no gods, no hierarchy, no legitimacy, only nature and appetite. And his last act, dying, is to try to save Cordelia. He is too late, and he knows it."},
    {k:"Edgar", v:"Gloucester's loyal son, framed by his half-brother Edmund and forced to flee. He disguises himself as 'Poor Tom,' a raving madman, survives the whole storm, guides his blinded father, and is left to rule at the end. The one who endures."},
    {k:"Gloucester", v:"Blinded, and only then able to see. <em>I stumbled when I saw.</em> His son leads him, in disguise, to a cliff that isn't there, and lets him think he has been saved by a miracle."},
    {k:"The two plots", v:"Lear's genius of structure: a king betrayed by two wicked daughters and saved by the good one he cast out — mirrored exactly by an earl betrayed by his wicked son and saved by the good one he cast out. Two families making the same mistake, so you cannot call it bad luck."},
    {k:"Kent", v:"Banished for telling the truth, comes straight back in disguise to keep serving. Loyalty with no possible reward, which is the play's counter-argument to itself."}
  ],
  places:[
    {k:"The heath", v:"No walls, no roof, no rank. Four men in a storm: a king, a fool, a servant, and a naked madman — and by the end you cannot tell which is which, and neither can Lear."},
    {k:"The cliff at Dover", v:"That isn't there. Edgar stages a suicide, a fall, and a divine rescue for his blind father, out of nothing but words. It is either the cruellest scene in Shakespeare or the kindest, and it is both."},
    {k:"The prison", v:"Where Lear imagines he and Cordelia will live happily, singing like birds in a cage, telling each other old tales. It is the happiest speech in the play and she is dead within minutes."}
  ],
  terms:[
    {k:"'nothing will come of nothing'", v:"Lear's answer to Cordelia's silence. The word <em>nothing</em> tolls through the whole play like a bell."},
    {k:"unaccommodated man", v:"Man with nothing on him and nothing under him: 'a poor, bare, forked animal.' Lear says it while tearing off his own clothes in a storm."},
    {k:"'as flies to wanton boys'", v:"'…are we to th' gods; they kill us for their sport.' Gloucester, blind. The play never contradicts him, and it never confirms him either."},
    {k:"the Tate ending", v:"Nahum Tate's 1681 rewrite, with Cordelia alive and married. It held the English stage for 150 years. When you hear that a work is 'timeless,' remember that this one was too much for six generations."}
  ],
  context:`
  <p class="lede">Around 1606. James I had just united the crowns of England and Scotland, and was obsessed with the danger of a divided kingdom.</p>
  <p>The play opens with a king dividing one. The Gunpowder Plot had been discovered a few months earlier. The country was raw, frightened, and thinking hard about what happens when the top of the state comes off.</p>
  <p>Shakespeare wrote it twice, incidentally: the Quarto and the Folio differ so much that some editors now print them as two separate plays. The <em>Lear</em> you know is a hybrid nobody in 1606 ever saw.</p>`,
  echoes:[
    {k:"→ Montaigne", to:"montaigne", v:"Scholars catch Shakespeare mining Florio's Montaigne for Lear as well as The Tempest — the play's raw questions about nature, cruelty and 'unaccommodated man' breathe the same air as the essays."},
    {k:"→ Job", to:"bible", v:"The man stripped of everything who demands to know why. Job gets a whirlwind. Lear gets weather."},
    {k:"→ Oedipus Rex", to:"oedipus-rex", v:"Blindness and insight, again — Gloucester only sees after his eyes are taken, exactly like Tiresias, exactly like Oedipus. Shakespeare knew what he was doing."},
    {k:"→ Hamlet", to:"hamlet", v:"The exact inverse. Hamlet thinks and cannot act; Lear acts and has never once thought. Between them Shakespeare covers the entire failure mode of being a person."},
    {k:"→ Moby-Dick", to:"moby-dick", v:"Melville was reading Shakespeare in a cheap large-print edition while writing it, and said so. Ahab's rhetoric — the defiance shouted into an indifferent sky — is Lear on the heath, at sea."},
    {k:"→ Beckett", v:"Four people on a bare stage, in bad weather, waiting for a meaning that does not arrive. <em>Endgame</em> is <em>Lear</em> with the plot removed."}
  ]
}

"paradise-lost": {
  file:"11", title:"Paradise Lost", author:"John Milton", date:"1667",
  form:"Epic · twelve books · blank verse",
  read:"Brief: 5 min",
  spineLabel:"What happens",
  oneline:"A blind, bankrupt revolutionary on the losing side of a civil war writes a poem to justify God — and accidentally gives the rebel all the best lines.",
  spine:`
  <p class="lede">It opens after the disaster. Satan and the rebel angels have already lost the war in Heaven and are lying face-down on a lake of fire, stunned. And Satan gets up.</p>
  <p>He rallies them. They build a capital — <b>Pandaemonium</b>, a word Milton invented for it — and hold a parliamentary debate about what to do next. Open war? Surrender? Build an empire in Hell and make the best of it? Satan settles it: they will strike at God <em>indirectly</em>, through the thing he has just made and loves. Man.</p>
  <p>He volunteers to go alone, escapes through the gates of Hell, crosses Chaos, and arrives at the edge of the new world. And there, alone on a mountain, looking at the sun, he says the thing that undoes him: <em>Which way I fly is Hell; myself am Hell.</em> He has understood, precisely, that he has brought the prison with him. He goes on anyway. <b>Evil, be thou my good.</b></p>
  <p>Meanwhile: Adam and Eve, in a garden, married, working, talking, and — Milton insists, against centuries of tradition — <b>having sex</b>, happily, before the Fall.</p>
  <p>An archangel is sent to warn them. He tells the story of the war in Heaven, and of the creation, and leaves. Then Eve suggests they garden separately for efficiency. Adam argues. He lets her go.</p>
  <p>The serpent finds her alone and flatters her — the fruit gave <em>him</em> speech, and how can knowing be a sin? She eats. And then, alone, she calculates: if she dies, God will make Adam another Eve. She cannot bear it. She takes the fruit to him.</p>
  <p><b>And Adam is not deceived.</b> He knows exactly what it is and exactly what it costs, and he eats it anyway — because he cannot face eternity without her.</p>
  <p>They quarrel, and blame each other, and then Eve — the one everybody blames — is the first to repent, and reaches for him. The archangel shows Adam the whole future: murder, flood, empire, the crucifixion. And then they walk out of the gate together.</p>
  <p><em>The world was all before them… They hand in hand, with wand'ring steps and slow, through Eden took their solitary way.</em></p>`,
  why:`
  <p class="lede">It is the last great epic in English and the most audacious project ever attempted in the language: to <b>explain God.</b></p>
  <p>Milton says so in the first sentence. He is going to "justify the ways of God to men" — which means answering, in verse, the question that Job asked and did not get an answer to. It is a staggering thing to attempt, and he had every qualification and one fatal advantage: he could write better than anyone alive.</p>
  <p>And it goes wrong in the most interesting way in literary history. <b>The villain is more alive than the hero.</b> God speaks in flat legal prose. Satan speaks like an archangel who has read Virgil. Blake said Milton was of the Devil's party without knowing it, and English literature has been arguing about that sentence for two hundred years.</p>
  <p>It is also the summit of everything before it — Virgil's epic machinery, Homer's similes, Dante's Hell, and Genesis, welded into one object by a man who had all of them by heart.</p>`,
  sticky:[
    {h:"He was blind, broke, and on the losing side of a revolution.", p:"Milton had publicly defended the execution of a king. Then the monarchy came back, his books were burned by the public hangman, and he was arrested and very nearly executed. Blind since his forties, he composed the poem in his head in the dark and dictated ten or twenty lines each morning. <b>He sold it for five pounds</b> — with another five promised if the first run of 1,300 sold out. It did. He received <b>£10</b> in total, and after his death his widow sold off the rest of the copyright for £8."},
    {h:"Satan gets the best lines and everyone has noticed for 350 years.", p:"<em>Better to reign in Hell than serve in Heaven.</em> <em>The mind is its own place, and in itself can make a Heaven of Hell, a Hell of Heaven.</em> <em>What though the field be lost? All is not lost.</em> Nobody in Heaven says anything half as good, and Milton knew it."},
    {h:"Adam is not deceived.", p:"Eve is tricked by a serpent. Adam eats with his eyes fully open, knowing precisely what it means and what it will cost, because he will not be in paradise without her. The Fall of Man is a man choosing a woman over God, on purpose."},
    {h:"'Pandemonium' is a word Milton made up.", p:"<em>Pan-daemonium</em> — all-demons. It is the name of Satan's capital city, built in an hour. The word escaped into English, lost its capital letter, and now means a noisy room."},
    {h:"The Satan you think you inherited from the Bible came from here.", p:"The magnificent fallen angel, the wounded pride, the unconquerable will — none of it is in scripture in any developed form. Milton didn't retell the story of Satan. <b>He built him.</b> And he got away, and he is now in every film you have ever seen."}
  ],
  idea:`
  <p class="lede">"The mind is its own place, and in itself / Can make a Heav'n of Hell, a Hell of Heav'n."</p>
  <p>It is the most quoted line in the poem, it sounds like wisdom, it is on a thousand walls — and it is <b>a lie</b>, spoken by the character who is most wrong, who discovers three books later that he carries Hell inside him wherever he goes and cannot put it down.</p>
  <p>That is the poem's method in one line: <b>it gives you the seductive thing, lets you believe it, and then makes you watch it fail.</b> And you will believe it anyway. That is what it is for.</p>`,
  wrong:[
    {b:"The fruit is not an apple.", p:"Still not an apple. It is never named, in Genesis or in Milton."},
    {b:"Milton was not a puritanical killjoy.", p:"He argued for the right to divorce, for a free press, and for cutting a king's head off. He insists that Adam and Eve had sex in Eden, and writes it tenderly, specifically to attack the tradition that made sex a consequence of the Fall."},
    {b:"It does not rhyme, and he was militant about it.", p:"He put a preface in the second edition attacking rhyme as 'the invention of a barbarous age' and 'the troublesome and modern bondage of rhyming.' The absence of rhyme is a political position."},
    {b:"Satan degenerates, and it's the whole design.", p:"He starts as an archangel making magnificent speeches. He ends as a snake, on his belly, hissing, in a Hell where the fruit turns to ash in his mouth. Anyone whose Satan is the one from Book I has read one twelfth of the poem."}
  ],
  take:`<p>Stanley Fish's reading resolves three hundred years of argument and you cannot unsee it: <b>the poem is a trap.</b> You are <em>meant</em> to be moved by Satan — Milton gives him the finest rhetoric in the language precisely so that you will be — and then, across eleven more books, you watch him shrink into a toad and a snake, and you are made to notice that you were taken in. The reader re-enacts the Fall by being seduced, on schedule, by exactly the sort of argument that worked on Eve. Milton is not of the Devil's party. He is setting you up.</p>`,
  counter:`<p>That is an extremely elegant machine — and it may be too elegant, because it converts the poem's most obvious feature into evidence of total authorial control. God is a bore. The Son is a cipher. Heaven is tedious and Hell is thrilling. Fish's theory requires Milton to have engineered every one of those effects deliberately and measured them on a reader he could not see. Blake's objection has not actually been answered: sometimes an imagination simply goes where it wants, and the honest thing to say is that <b>the poem got away from him</b> — and that this is why it is alive.</p>`,
  people:[
    {k:"Satan (Milton's)", v:"Archangel, revolutionary, orator, self-deceiver. The greatest character in English poetry and its author's greatest problem."},
    {k:"God the Father", v:"Speaks in flat legal prose, explains himself at length, and pre-emptively forecloses every objection. Even his defenders find him hard going."},
    {k:"Eve", v:"Curious, intelligent, vain, and the first to <b>repent</b> — she reaches out to Adam after the Fall while he is still blaming her. Milton is far more interested in her than the tradition allowed him to be."},
    {k:"Adam", v:"Eats knowingly, out of love, and is condemned for it. His sin has a name: loving a creature more than the one who made her."},
    {k:"The Son", v:"God's Christ, before the Incarnation. He volunteers to become mortal and die for humanity — the one free act of pure love in the poem — and it is his elevation that Satan cannot stomach, the spark of the whole rebellion."},
    {k:"Michael &amp; Raphael", v:"The two archangels God sends to Adam: Raphael to warn him about Satan and narrate the War in Heaven, Michael to expel the couple from Eden and show Adam the future. The bridge between Heaven's story and humanity's."},
    {k:"Beelzebub", v:"Satan's second-in-command, the first to answer him in Hell. The voice that proposes the plan — corrupt the new creation, Man — that turns private revenge into the plot against Eden."},
    {k:"Abdiel", v:"The single angel who refuses to join the rebellion and walks out of Satan's camp alone — 'faithful found among the faithless.' It is impossible not to see Milton in him: the last republican in a restored monarchy, right and alone."},
    {k:"Mammon", v:"Argues in the great debate that they should simply stay in Hell and mine it and get rich. He is the most modern voice in the poem."},
    {k:"Sin and Death", v:"Satan's daughter, born from his head, whom he raped; and their son, who then rapes her. They keep the gate of Hell. Milton is not being tasteful, and he means it."}
  ],
  places:[
    {k:"Hell", v:"Darkness visible. A lake of fire, and a plain, and a parliament."},
    {k:"Heaven &amp; the War in Heaven", v:"Before the poem's present, Satan led a third of the angels in revolt. Three days of celestial battle, ended when the Son alone drove the rebels over the wall of Heaven — they fell for nine days into Hell — and lay stunned on the burning lake for nine more before Satan stirred. All of this is backstory, narrated to Adam by the archangel Raphael."},
    {k:"Pandaemonium", v:"Built in an hour, out of the ground, by an architect who fell from Heaven. The finest building in the poem is in Hell."},
    {k:"Chaos", v:"The unformed matter between worlds. Satan flies through it for a book, and it is one of the strangest passages in English."},
    {ref:"eden", here:"Fenced, cultivated, and requiring work — Milton's paradise is not idle. Adam and Eve have jobs, and the garden runs wild if they neglect them."}
  ],
  terms:[
    {k:"blank verse", v:"Unrhymed iambic pentameter. The sound of Shakespeare's plays and Milton's epic — and the sound of English at maximum power."},
    {k:"theodicy", v:"The defence of God's justice in the face of evil. The whole poem is one, and it is a genre invented because the question will not go away."},
    {k:"the War in Heaven", v:"The angelic civil war that precedes the human story: Satan's revolt, the three-day battle, the fall of the rebel angels. Milton stages it as epic combat — and quietly makes it faintly absurd, since immortal spirits cannot really die."},
    {k:"the Fortunate Fall (felix culpa)", v:"See felix culpa — the paradox that Adam's sin was a happy fault, because it brought about a greater good: Christ, redemption, and a paradise 'happier far' within."},
    {k:"felix culpa", v:"'The fortunate fall.' The argument, made at the end, that the Fall was worth it because it made redemption possible — more good comes out than went in. It is either sublime or the greatest rationalisation ever attempted."},
    {k:"in medias res", v:"Into the middle of things. Homer, Virgil, and Milton all start after the disaster and fill in the past. Milton starts <em>after the war</em>, which is why we meet Satan already defeated and already unbeaten."}
  ],
  context:`
  <p class="lede">A man writes the greatest poem about a failed rebellion against a monarch, having personally failed at a rebellion against a monarch.</p>
  <p>Milton served Cromwell. He wrote the official defence of executing Charles I and published it in Latin so that all of Europe could read it. Then Cromwell died, the Restoration came in 1660, and Milton went into hiding. The king ordered his books burned by the public hangman. He was arrested, imprisoned, and fined. He was blind, in his fifties, politically destroyed, and living in a country that had decided he was wrong about everything. The man who spoke for him in Parliament and probably saved his life was another poet — <b>Andrew Marvell</b>, who had been his assistant.</p>
  <p>Then he wrote this. The Great Plague was in 1665 and the Fire of London in 1666. <em>Paradise Lost</em> was published in 1667, into the ashes.</p>`,
  echoes:[
    {k:"→ The Bible", to:"bible", v:"Genesis 1–3, at ten thousand lines — and the invention of the Satan the source text does not contain."},
    {k:"→ The Aeneid", to:"aeneid", v:"The invocation, the council of war, the epic simile, the journey through the underworld. Milton takes the entire Virgilian machine and hands the controls to the enemy."},
    {k:"→ Dante", to:"dante", v:"Two Satans, and everything hangs on the difference. Dante's is frozen, mute, and pathetic — evil as a <em>nothing</em>, an absence. Milton's is magnificent, articulate, and unbroken. Which one is right is the whole argument about what evil is."},
    {k:"→ Faust", to:"faust", v:"Mephistopheles is Milton's Satan after he has stopped believing in himself: same intelligence, no grandeur, all irony."},
    {k:"→ Moby-Dick", to:"moby-dick", v:"Ahab is Satan on a whaleship — the unconquerable will, the wounded pride, the refusal to submit to a power he cannot beat. Melville had this poem in his head."},
    {k:"→ Ovid", to:"ovid", v:"Eve, newly made, looks into a pool and prefers her own reflection. That is Narcissus, transplanted into Eden, on purpose."},
    {k:"→ Frankenstein", v:"The creature finds a copy, reads it, identifies first with Adam and then with Satan, and Mary Shelley put a line from it on the title page. The Romantics didn't just admire Milton's Satan. They adopted him."}
  ]
},

"faust": {
  file:"12", title:"Faust", author:"Johann Wolfgang von Goethe", date:"1808 & 1832",
  form:"Drama · two parts · sixty years' work",
  read:"Brief: 6 min",
  spineLabel:"What happens",
  oneline:"He doesn't sell his soul. He bets that nothing in the world will ever be good enough to make him want it to last — and the devil takes the bet.",
  spine:`
  <p class="lede"><b>It opens with God and the devil making a wager about a man.</b> That is the opening of the Book of Job, transposed note for note — and Mephistopheles, exactly like 'the satan' in Job, is on the staff: urbane, funny, chatting with the Almighty, doing a job.</p>
  <p>Faust is an old scholar who has mastered philosophy, law, medicine, and theology, and knows that he knows nothing. He is about to drink poison when he hears Easter bells — not faith, just the memory of having had it — and puts the cup down.</p>
  <p>Mephistopheles arrives. And here Goethe changes the legend completely. There is <b>no sale</b>. There is a <b>bet</b>: Mephisto will serve him, give him anything, show him everything — and if Faust is ever <em>satisfied</em>, if he ever says to a passing moment <em class="g">stay, you are so beautiful</em>, then he loses, and his soul is forfeit. The wager is on whether human wanting can ever be stilled.</p>
  <p>He is made young. And then he meets <b>Gretchen</b> — a poor, devout, teenage girl — and destroys her, comprehensively, almost casually. He seduces her. The sleeping draught he gives her mother kills the mother. Her brother challenges him and Faust, with the devil's help, kills him in the street, and the brother dies cursing her by name in public. She is pregnant, shamed, alone. She drowns the baby. She is imprisoned and condemned.</p>
  <p>And where is Faust while she waits to be executed? At a witches' sabbath on a mountain, distracted.</p>
  <p>He comes to break her out. She is mad, and she will not go — she chooses judgment. Mephisto says: <em>she is condemned.</em> A voice from above says: <b>she is saved.</b></p>
  <p><b>Part Two</b>, written over the next twenty-four years, goes somewhere nobody expected. Faust turns imperial financier and <em>invents paper money.</em> He conjures Helen of Troy and marries her, and their son tries to fly and falls. And at the end, old, he becomes a <b>developer</b>: draining the sea, building dykes, planning a free society on reclaimed land. An old couple's cottage is in the way. He orders them moved. His men kill them and burn the house down.</p>
  <p>Then Care breathes on him and he goes blind. Blind, he hears digging, and believes it is his workmen building his great project. It is his own grave. And in that delusion — imagining a free people on free land — he speaks the forbidden words at last, and dies.</p>
  <p>Mephisto reaches for him. Angels intervene. <b>Faust is saved</b> — because "whoever strives unceasingly, him we can redeem" — and Gretchen, the girl he destroyed, is the one who intercedes for his soul.</p>`,
  why:`
  <p class="lede">This is the West's myth of itself, and Goethe knew it while he was writing it.</p>
  <p>The historian Spengler simply named our whole civilisation <b>Faustian</b>: the culture of infinite striving, of the restless will that cannot be satisfied and will not stop, and that reaches for everything — knowledge, experience, land, power — and pays for it with other people.</p>
  <p>And it collides head-on with the <em>Confessions</em>. <b>Augustine's restless heart finds its rest in God.</b> Faust's restless heart is never satisfied for a single moment — and is saved <em>precisely because</em> it never rests. The same diagnosis, fourteen hundred years apart, and the opposite prescription. Modernity is the moment the restlessness stopped being the disease and became the cure.</p>`,
  sticky:[
    {h:"The bargain is not a sale. It's a bet.", p:"He doesn't trade his soul for twenty-four years of magic. He wagers that <b>no moment will ever be good enough</b> — that he will never once want time to stop. If he ever says <em>stay, you are so beautiful</em>, he loses. It is the contract modernity signs with itself, drafted in 1808."},
    {h:"He invents paper money.", p:"Part Two. The Emperor is broke, so Faust and Mephisto print banknotes backed by gold that has not been dug up yet, and the court is <em>delighted</em>. Goethe, in 1832, staged the invention of fiat currency as a piece of devilry — and then had everyone applaud."},
    {h:"The utopia requires an eviction.", p:"At the very end, Faust is reclaiming land from the sea to build a free society for free people. An old couple's cottage spoils the plan. He orders them removed. His men kill them and burn the house. He is horrified — and he gave the order. Every twentieth-century development project is standing in that scene."},
    {h:"Gretchen is not in the legend. Goethe invented her.", p:"The old Faust story has no ruined girl. The entire tragedy of an ordinary young woman annihilated as a side-effect of a great man's self-development is Goethe's addition — and it is the best and most damning thing in the poem."},
    {h:"He dies blind, mistaking his gravediggers for his builders.", p:"He hears shovels and thinks it is his dyke being built. It is his grave being dug. And in that delusion — imagining a happy people on land he will never see — he finally says the words, and loses the bet, and is saved anyway."}
  ],
  idea:`
  <p class="lede">A "Faustian bargain" does not mean a bad deal with the devil. It means <b>trading your peace for your growth</b> — and Goethe declines to tell you whether that is the engine of everything good in modern life or the thing that will kill us.</p>
  <p>Portable version: <b>the willingness never to be satisfied is a superpower and a disease, and it is the same trait.</b> The people who build things you admire and the people who leave wreckage behind them are frequently the same people, and Faust is where the West decided to forgive them.</p>`,
  wrong:[
    {b:"He is not damned.", p:"He is <b>saved</b>. The version everyone half-remembers — Faustus dragged screaming into Hell at midnight — is Christopher Marlowe's play, from 1592, a different work by a different author two centuries earlier. Goethe's Faust goes up."},
    {b:"Mephistopheles is not frightening.", p:"He is funny, cynical, worldly, and by some distance the best company in the poem. He describes himself as 'the spirit that always denies' — and, in a line nobody expects, as part of the power 'that eternally wills evil and eternally works good.'"},
    {b:"Most people who have read Faust have read half of it.", p:"Part One is a tight, devastating tragedy. Part Two is a sprawling allegorical carnival with Greek gods, artificial life in a bottle, and monetary policy. They barely feel like the same author, and they were written twenty-four years apart."},
    {b:"'Faustian bargain' is used wrong constantly.", p:"In the newspapers it means any deal with a bad actor. In Goethe it means something far more specific and far more uncomfortable: the exchange of contentment for development, made knowingly, forever."}
  ],
  take:`<p>The Gretchen tragedy is the moral centre of the work, and Part Two is Goethe's fifty-year attempt to climb out from under it. Faust annihilates a girl — her mother, her brother, her child, her mind, her life — as a side-effect of becoming himself. And then the poem constructs an ever-grander metaphysical scaffolding until it can announce that he is redeemed <em>because he kept striving</em>, and has the woman he destroyed carry him to heaven. <em>The Eternal Feminine draws us upward.</em> It is the most beautiful and most self-serving ending in European literature, and Goethe was eighty-two, and he knew exactly what he was doing.</p>`,
  counter:`<p>Read the death scene again before you settle on that, because it does not say what the cynical reading needs it to say. Faust dies <b>blind, deluded, and wrong</b> — mistaking his own gravediggers for his builders, accepting a beautiful moment that <em>does not exist and never will</em>. Goethe's claim is not that striving earns you heaven. It is that striving is never satisfied, not even in the last second of life, and that grace is by definition the thing you have <em>not</em> earned — which is exactly why it has to come from Gretchen, whom he wronged, and not from a single one of his achievements. That is not special pleading. That is the doctrine of grace, and it is Augustine's answer, arriving fourteen centuries late in fancy dress. The <em>Confessions</em> and <em>Faust</em> agree, and everyone thinks they don't.</p>`,
  people:[
    {k:"Faust", v:"Scholar, seducer, financier, warlord, developer. He never stops, and he is never once content, and that is both his crime and his salvation."},
    {k:"Mephistopheles", v:"Not Satan. A civil servant of the negative — ironic, tired, endlessly amusing, and quietly convinced the whole creation was a mistake and should be wound up."},
    {k:"Gretchen (Margarete)", v:"Poor, devout, about fourteen. Loses her mother, her brother, her child, her mind, and her life. Refuses to escape. Judges herself, is judged better than she judged herself, and at the end is the reason Faust is not dragged down."},
    {k:"The Lord &amp; the Prologue in Heaven", v:"The poem opens, like the Book of Job, with God and the devil making a bet. The Lord permits Mephistopheles to tempt Faust, confident the man's striving will save him. Everything after is the wager playing out — and Job is the model.",to:"bible"},
    {k:"Homunculus", v:"A tiny artificial human created in a flask by Faust's assistant Wagner — pure intellect with no body, longing to be truly born. Goethe's strange emblem of knowledge that wants to become life."},
    {k:"Euphorion", v:"The child of Faust and Helen of Troy — beauty and striving made flesh. He flies too high, falls, and dies, and is widely read as Goethe's elegy for the poet Byron. The union of classical and modern that cannot survive."},
    {k:"Wagner", v:"Faust's plodding assistant — and in Part Two, the man who creates <b>Homunculus</b>: an artificial intelligence in a glass bottle, glowing, brilliant, and unable to be born. Goethe wrote that in 1832."},
    {k:"Helen of Troy", v:"Conjured out of the past and married. Their son tries to fly and falls to his death, and everyone at the time knew he was Byron. Helen vanishes and leaves her robe behind."},
    {k:"Philemon and Baucis", v:"The old couple in the cottage. In Ovid, they are the ones who showed hospitality to gods in disguise and were rewarded. In Goethe, a developer has them killed to improve a view."},
    {k:"Care (Sorge)", v:"Not a demon. An abstraction. She cannot be bribed or fought, she gets in through the keyhole, and she blinds him — and that is when he starts, finally, to do something for other people."}
  ],
  places:[
    {k:"The study", v:"Where it starts: an old man surrounded by every book there is, in despair, holding poison."},
    {k:"Auerbach's Cellar", v:"A real pub in Leipzig where Goethe drank as a student. It is still open. You can eat there."},
    {k:"The Brocken", v:"The mountain of the Walpurgisnacht — the witches' sabbath, where Faust spends the night while Gretchen sits in a condemned cell."},
    {k:"The reclaimed land", v:"The last vision: a free people on free land, drained from the sea. Faust never sees it. He is blind, and it does not exist."}
  ],
  terms:[
    {k:"'Verweile doch, du bist so schön'", v:"'Stay a while, you are so beautiful.' The forbidden sentence. To say it is to lose."},
    {k:"'the spirit that always denies'", v:"Mephisto's self-description. The most economical definition of cynicism ever written."},
    {k:"Walpurgisnacht", v:"The witches' night. The word, and the scene, and everything that has been done with both since."},
    {k:"'the Eternal Feminine'", v:"<em>Das Ewig-Weibliche zieht uns hinan</em> — 'draws us upward.' The last line of sixty years of work. Also, arguably, the most convenient last line ever written by a man about the women in his life."},
    {k:"the wager (Faust's bet)", v:"Not a simple sale of the soul. Faust bets that no moment will ever satisfy him so deeply that he asks it to stay — <em>Verweile doch</em>. If he ever does, Mephistopheles wins. He is betting on his own endless dissatisfaction, and it is what saves him."},
    {k:"striving (Streben)", v:"The engine of the whole poem, and Goethe's answer to salvation: to keep reaching, never resting, never satisfied. 'Whoever strives with all his power, that man we can redeem,' the angels sing. Restlessness itself becomes the virtue.",to:"confessions"},
    {k:"Bildung", v:"Self-formation, self-cultivation. The German ideal of the person as a project. Faust is its patron saint and its indictment."}
  ],
  context:`
  <p class="lede">Sixty years. He began it in his twenties, finished Part Two in the summer of 1831, sealed it in an envelope, and died the following March at eighty-two.</p>
  <p>Goethe was not only a poet. He was a novelist, a playwright, a theatre director, a privy councillor running a small German state, and a working scientist who believed his theory of colours mattered more than his poetry. He lived through the Enlightenment, the French Revolution, and Napoleon — whom he met, and admired — and into the beginning of the industrial age. He watched the world he was born into be replaced.</p>
  <p>Which is why Part Two contains banknotes, land reclamation, artificial life, and a man who cannot stop building. He was not writing a legend. He was writing a forecast.</p>`,
  echoes:[
    {k:"→ The Bible", to:"bible", v:"The Prologue in Heaven is the opening of Job, moved bodily into a German play. God and the adversary, making a bet about a man who does not know he is being bet on."},
    {k:"→ Paradise Lost", to:"paradise-lost", v:"Mephistopheles is Milton's Satan two hundred years later: same intellect, no grandeur left, and much funnier."},
    {k:"→ Confessions", to:"confessions", v:"The restless heart. Augustine's finds rest in God. Faust's is saved for never resting at all — and yet both are rescued by something they did not earn. They are closer than either would like."},
    {k:"→ The Brothers Karamazov", to:"karamazov", v:"Ivan's devil is a shabby gentleman in a checked suit who will not stop talking — a direct, deliberate descendant of Mephistopheles, and Dostoevsky knew it."},
    {k:"→ Moby-Dick", to:"moby-dick", v:"Ahab baptises his harpoon in blood in the name of the devil, and drags a crew to the bottom in pursuit of a meaning he cannot get. Faust with a whale."}
  ]
}
