  context:`
  <p class="lede">Later than the Iliad, and pointed the other way.</p>
  <p>The Iliad was composed for an aristocratic warrior audience. The Odyssey belongs to a world of ships, trade, coastlines, and strangers — a Greece beginning to sail out and colonise, meeting people who might feed you or eat you. It is a poem about how you survive contact with the unknown, and its answer is: <b>lie, flatter, adapt, and never say your real name.</b></p>
  <p>Emily Wilson's 2017 version was the first <b>published English</b> translation by a woman — after some sixty English translations by men. (Anne Dacier had done it into French three hundred years earlier; Wilson credits her.) Wilson opens with 'Tell me about a complicated man,' and it caused a fight, which tells you the poem is still alive.</p>`,
  echoes:[
    {k:"→ The Epic of Gilgamesh", to:"gilgamesh", v:"Gilgamesh crosses the world seeking immortality and fails; Odysseus is offered it outright by Calypso and says no. The same question, 1,500 years apart — and the later hero chooses a mortal life on purpose."},
    {k:"→ The Iliad", to:"iliad", v:"Its opposite. Force against cunning, glory against home, dying young against getting old."},
    {k:"→ Ulysses", to:"ulysses", v:"Joyce maps every episode of this poem onto one Dublin day. The Cyclops becomes a bigot in a pub, the Sirens are barmaids, and Penelope gets the last word."},
    {k:"→ The Republic", to:"republic", v:"On the last page of Plato, the soul of Odysseus — offered any life at all — chooses the life of an ordinary private man, cured of ambition."},
    {k:"→ Dante", to:"dante", v:"Dante had never read Homer, and invented a different ending: <em>his</em> Ulysses never goes home. He sails past Gibraltar into the open Atlantic out of sheer hunger for knowledge, and drowns. It's in Hell. Tennyson took that version, not this one."},
    {k:"→ The Aeneid", to:"aeneid", v:"Virgil takes the wandering structure and grafts it onto a man who is not allowed to want anything for himself."}
  ]
},

"aeneid": {
  file:"06", title:"The Aeneid", author:"Virgil", date:"29–19 BC",
  form:"Epic · 12 books · unfinished",
  read:"Brief: 5 min",
  spineLabel:"What happens",
  oneline:"A refugee is ordered by the gods to found Rome, and every single thing he loves is taken from him along the way — and he goes anyway.",
  spine:`
  <p class="lede">Troy is burning. Aeneas — a Trojan prince, a survivor of the losing side — carries his crippled father out of the fire on his back, holding his small son by the hand. In the smoke, his wife falls behind. When he turns around, she is gone.</p>
  <p>He is not allowed to grieve for long, because he has been given a job: sail west, find Italy, and plant the seed of a city that will one day rule the world. He does not want this job. He is told it is not about what he wants.</p>
  <p>A storm drives him to Carthage, where <b>Dido</b> — a widowed queen, brilliant, building her own city — falls in love with him. He loves her back. For a season he is happy, and Rome is forgotten. Then a god arrives and says: <em>what are you doing?</em> Aeneas packs the ships. Dido begs, rages, and finally builds a pyre out of his belongings, climbs onto it, curses him and every descendant he will ever have, and stabs herself with the sword he left behind.</p>
  <p>He sails on. He sees the smoke on the horizon and does not know what it is.</p>
  <p>He goes down into the underworld, where his dead father shows him the future: the whole parade of Rome, unborn, waiting. And there, among the dead, he meets Dido, and tries to explain — <em>I didn't want to go, I was ordered</em> — and she looks at the ground, says nothing at all, and walks away.</p>
  <p>Then Italy, and a war he did not want with people who were there first. In the last book he defeats Turnus, his enemy, who kneels and begs for his life. Aeneas hesitates — he is going to spare him — and then sees, on Turnus' shoulder, the sword-belt stripped from a boy Turnus killed. And he drives the blade in, <em>boiling with rage</em>.</p>
  <p>Last line: the life flees, resentful, into the shadows. The poem stops there.</p>`,
  why:`
  <p class="lede">It is the founding poem of an empire that keeps quietly admitting what the empire cost.</p>
  <p>Virgil is doing something structurally new: writing an epic <em>out of</em> epics. The first six books are the Odyssey (wandering), the last six are the Iliad (war), and he expects you to notice. This is the birth of literature that knows it is literature.</p>
  <p>But the reason it survives is <em class="g">pietas</em> — the word attached to Aeneas like an epithet, and one of the most misunderstood words in the canon. It does not mean piety. It means <b>duty</b>: to your gods, your father, your son, your people. Aeneas is a hero defined entirely by obligation, and the poem's engine is the systematic destruction of everything he privately wants. His city. His wife. Dido. His father. His own capacity for happiness.</p>
  <p>Homer's heroes want things. Aeneas is not permitted to. That's the invention, and it is why he is the least likeable hero in the canon, and why he is the most modern.</p>`,
  sticky:[
    {h:"He carries his father out of the fire and loses his wife in the smoke.", p:"The past on his shoulders, the future by the hand, and the thing he actually loved left behind in the dark. It is the picture of the entire poem, and it happens in the first hour."},
    {h:"Dido's pyre.", p:"She burns everything he owned, climbs on top of it, curses his bloodline — <em>let there be no love between our peoples, ever</em> — and kills herself with his sword. That curse is Hannibal. Rome's national poem makes its hero a man who ruined a woman because he had an appointment."},
    {h:"She won't speak to him in hell.", p:"He finds her among the dead, and pleads, and cries. She stares at the ground like a piece of flint, turns her back, and walks off to her first husband, who loves her. The most devastating snub in literature is delivered in complete silence."},
    {h:"The poem ends in a murder, mid-rage.", p:"Not a triumph, not a founding, not a coronation. A man begging on his knees and a hero killing him in fury over a dead boy's belt. Then it stops. That is the last thing Rome's epic says."},
    {h:"He asked for it to be burned.", p:"Virgil was dying and the poem wasn't finished. His instruction was: destroy it. Augustus overruled him. Every line you read exists against the express wishes of the man who wrote it."}
  ],
  idea:`
  <p class="lede">There is a kind of goodness that consists entirely of doing what you must while it destroys you, and it is not the same thing as happiness, and nobody thanks you.</p>
  <p><em>Sunt lacrimae rerum</em> — the poem's most famous half-line, untranslatable, roughly: <b>there are tears in things.</b> Aeneas says it looking at a mural of his own dead friends, in a foreign country, having lost everything. Grief is not an interruption of the work. It is the medium the work is done in.</p>`,
  wrong:[
    {b:"<em>Pius</em> Aeneas does not mean pious Aeneas.", p:"It means dutiful — bound by obligation to father, son, gods, and people. He isn't a prig. He's a man with no exit."},
    {b:"Dido is not a temptress or a villain.", p:"She is a competent queen building a great city, and Virgil gives her some of the best poetry in Latin. The tragedy works precisely because she is right and he is also right."},
    {b:"The wooden horse comes from here.", p:"Not from Homer. The famous account — Laocoön, the serpents, the sack of the city, the death of Priam — is Aeneas telling the story himself, in Book 2, to the woman he is about to destroy."},
    {b:"It was never finished.", p:"There are lines in it that stop halfway. He was still working. That final, brutal, unresolved ending may be exactly what he wanted — or he may simply have died before he could soften it. Nobody knows, and the argument is 2,000 years old."}
  ],
  take:`<p>The Aeneid is the great poem about the moral cost of doing the necessary thing. Aeneas is not a hero; he is a man conscripted by history, and every human thing in him — his wife, Dido, his own desire to stop — gets fed into the machine that becomes Rome. Virgil clearly knows this. The poem is commissioned glory that cannot stop mourning, and the fact that it ends with its hero losing control and killing a man who is begging is the most honest thing any empire has ever said about itself.</p>`,
  counter:`<p>That "two voices" reading is largely an American invention of the 1960s — Harvard, Vietnam, a generation looking for a covert anti-imperialist Virgil. For 1,900 years before that, readers took the poem as what it announces itself to be: the foundation of Rome, with the costs honestly counted, which is what makes the glory <em>serious</em> rather than cheap. A poem can grieve for Dido and still believe in Rome. Insisting it must secretly be a protest may say more about the 1960s than about 19 BC.</p>`,

    {k:"Sibyl of Cumae", v:"The frenzied prophetess who guides Aeneas down into the underworld to meet his father's ghost. She shows him the future of Rome — and how to get back out alive."},
    {ref:"augustus", here:"Not a character, but present on every page — Virgil's patron, and the man whose century of civil war the poem is built to justify. Aeneas's son Iulus is his claimed ancestor."}

    {ref:"carthage", here:"Dido's city, rising. Rome would raze it utterly 700 years later — the salting of the earth is a later myth — and Virgil's readers heard the whole coming war in Dido's dying curse."},
    {k:"Cumae", v:"The Sibyl's cave. The door to the underworld. Also: the gates of horn and ivory, through which true and false dreams leave — and Aeneas, inexplicably, exits through the ivory gate. The false one. Nobody has ever fully explained why."},
    {k:"Latium", v:"Italy. The promised land, which turns out to be full of people who already live there."}

  context:`
  <p class="lede">Written for a country that had just spent a hundred years killing itself.</p>
  <p>The Roman Republic tore itself apart in civil war — Marius, Sulla, Caesar, Pompey, Brutus, Antony — and it ended with one man, Augustus, holding everything. Virgil's audience was exhausted, bereaved, and complicit, and what they needed was a story in which all that suffering had been going somewhere.</p>
  <p>He gave them one. And he made its hero a man who suffers continuously, obeys anyway, and is granted no peace at all — which is either the most patriotic thing ever written, or the most sceptical, and Virgil died before anyone could ask him.</p>`,

    {k:"→ The Republic", to:"republic", v:"Plato banned poets for making us weep over fictional suffering. Augustine, weeping over Dido, is Exhibit A."}

"oresteia": {
  file:"03.1", title:"The Oresteia", author:"Aeschylus", date:"458 BC",
  form:"Trilogy · three plays",
  read:"Brief: 5 min",
  spineLabel:"What happens",
  oneline:"A family kills itself for three generations until a goddess stops it by inventing the jury trial — and the argument that wins the case is that mothers aren't really parents.",
  spine:`
  <p class="lede">The only complete Greek trilogy that survives. Three plays, one bloodline, and a debt that cannot be paid.</p>
  <p><b>Play one: Agamemnon.</b> A watchman has been lying on a roof for ten years waiting for a signal fire. It comes: Troy has fallen. Agamemnon is coming home.</p>
  <p>His wife Clytemnestra has been waiting too. Ten years earlier, becalmed at Aulis, Agamemnon sacrificed their daughter Iphigenia on an altar to buy a favourable wind — gagged, so she couldn't curse them, and lifted over the knife like a goat. Clytemnestra has thought about very little else since.</p>
  <p>She greets him with crimson cloth laid out across the ground and flatters him into walking on it. He knows it's obscene. He does it anyway. Then he goes inside for a bath, and she throws a robe with no armholes over him, and stabs him three times while he thrashes in the water. She comes out and stands over the body and says his blood hit her like spring rain on the crops, and she was <em>glad</em>.</p>
  <p><b>Play two: The Libation Bearers.</b> Orestes, the exiled son, comes back. Apollo has given him an order: avenge your father. Which means: <b>kill your mother.</b> He does. She bares her breast to him — <em>this is what fed you</em> — and he turns to his silent friend Pylades and asks what to do, and Pylades, who has not spoken for two plays, says three lines, and Orestes cuts her throat. Then the Furies come for him and he runs.</p>
  <p><b>Play three: The Eumenides.</b> The Furies hunt him to Athens, where Athena does something unprecedented: she refuses to judge, and empanels <b>a jury of twelve citizens</b> instead. Apollo defends. The Furies prosecute. The vote ties, six to six. Athena breaks it in Orestes' favour — and the argument she endorses is Apollo's: <em>the mother is not the parent, only the soil the seed is planted in.</em></p>
  <p>The Furies are enraged. Athena talks them down, and gives them a permanent, honoured, terrifying place beneath the city. Vengeance ends. Law begins.</p>`,
  why:`
  <p class="lede">This is the moment, staged, where revenge becomes justice — and it is not a clean transaction.</p>
  <p>Before the trilogy, blood answers blood, forever: every killing licenses the next, and the killer's children inherit the debt. That's not a metaphor in Aeschylus, it's the operating system. The House of Atreus has been running it for three generations — Agamemnon's father served his own brother a pie made of the brother's children — and it cannot be stopped from inside.</p>
  <p>So Aeschylus does the thing nobody had done: he <b>puts the vendetta in a courtroom</b>, and has a third party interrupt it. Twelve citizens. Evidence. A vote. And it stops.</p>
  <p>That's the founding myth of Western law, dramatised, and Aeschylus is honest enough to show you what it costs: the Furies do not get justice, they get a job.</p>`,
  sticky:[
    {h:"He sacrificed their daughter for a wind.", p:"Everything under everything. Iphigenia, gagged so she could not curse her father, lifted over the altar. Ten years later, her mother is still holding the knife — and the fleet did sail, and Troy did fall, so by the logic of the expedition it <em>worked</em>."},
    {h:"The red cloth.", p:"She lays a path of blood-coloured tapestry to the door and dares him to walk on it. He knows only a god should. She flatters him until he does. The conqueror of Troy is undone by an argument on his own doorstep, in about ninety lines."},
    {h:"He dies naked in a bath, tangled in a robe with no armholes.", p:"A net. He can't get his arms out. Three blows. The great king of the Greeks dies wet, blind, and thrashing like a fish — and his wife comes outside and tells the elders his blood fell on her like rain on the young corn and she rejoiced in it."},
    {h:"'This is the breast you suckled.'", p:"Clytemnestra bares her chest to stop her son from killing her. Orestes falters and asks Pylades — who has been onstage, silent, for two entire plays — what he should do. Pylades speaks three lines. Then Orestes kills her."},
    {h:"The jury ties, 6–6.", p:"Athena casts the deciding vote for acquittal, and the argument she endorses is that the mother is not a parent at all — merely the soil for the father's seed — and she cites herself as proof, having been born from Zeus's skull with no mother at all. Western law is founded, on the page, on a piece of embryological nonsense."}
  ],
  idea:`
  <p class="lede">Every legal system is a blood feud that agreed to stop, and the agreement is never fair to everybody.</p>
  <p>Aeschylus's phrase for what the trilogy teaches is <em class="g">pathei mathos</em> — <b>we suffer into knowledge.</b> Not "suffering is redeemed," not "it was worth it." Simply: this is how the knowing was paid for, and the bill went to people who did not survive to see the benefit.</p>
  <p>Portable version: <b>the peace you live inside was bought by somebody who did not get justice.</b></p>`,
  wrong:[
    {b:"The Furies are not villains.", p:"They have the stronger legal case. Matricide is the oldest crime there is, and Apollo's rebuttal is nonsense he made up. They lose on a technicality, cast by a judge who has publicly said she sides with fathers."},
    {b:"Clytemnestra is not a monster.", p:"He killed their child. She says so, repeatedly, and nobody in the play ever answers her. She is arguably the greatest female role written before Shakespeare, and Aeschylus lets her win every argument she is in."},
    {b:"The happy ending is a piece of current affairs.", p:"Four years before the play, Athens stripped the ancient Areopagus council of nearly all its powers in a bitter democratic reform, and the reformer was assassinated for it. Aeschylus is staging the founding of that exact court, in that exact city, in the middle of the fight. It is not a timeless myth. It is an intervention."},
    {b:"This is not the Electra story.", p:"Electra appears briefly in play two and vanishes. The obsessive, magnificent Electra is Sophocles' and Euripides' invention, later. And 'the Electra complex' is Jung's coinage, not Freud's."}
  ],
  take:`<p>The Oresteia is not a triumphant story about the birth of justice. It's a story about a debt so large it could only be declared void. The Furies — who represent the claim of the murdered mother, and who are right — are outvoted by a goddess with no mother, on the argument that mothers do not count, and then bought off with a ceremonial post and a nice cave. That is how law actually begins: not with fairness, but with an authority powerful enough to say <em>enough</em>, and losers who take the settlement.</p>`,
  counter:`<p>Watch what Athena actually does, though, because the cynical reading skips it. She does not crush the Furies. She <em>negotiates</em> with them, for a long time, and what she gives them is not a consolation prize — it's a permanent seat under the city, honours in perpetuity, and their terror fully intact. She says explicitly that a city without dread is a city without justice. Aeschylus's claim is not that vengeance was defeated; it's that vengeance was <b>housed</b> — kept, fed, and made load-bearing. That is a far stranger and better idea than "the patriarchy won," and it's what he actually wrote.</p>`,
  people:[
    {k:"Clytemnestra", v:"Wife of Agamemnon, and the most formidable figure in the trilogy. Ten years of planning. Kills her husband, and is never once out-argued. Aeschylus gives her language of a force nobody else in the trilogy can match."},
    {ref:"agamemnon", here:"Home from the ten-year war, on stage for one scene, dead by the end of it — killed by his wife for having sacrificed their daughter to launch the fleet."},
    {k:"Aegisthus", v:"Clytemnestra's lover and co-conspirator, and Agamemnon's cousin — his family has its own blood-score to settle with the house of Atreus. Weak where she is strong; he rules Argos beside her until Orestes returns."},
    {k:"Electra", v:"Daughter of Agamemnon and Clytemnestra, sister of Orestes. Kept half a servant in her own home, she keeps her father's memory and her hatred alight, and recognises her brother by a lock of hair at the tomb. Carl Jung later coined the term 'Electra complex' from her name — the daughter's counterpart to the Oedipus complex — a label Freud himself disliked and rejected."},
    {k:"Cassandra", v:"Trojan princess, prophetess, war-prize. Apollo cursed her: always right, never believed. She stands outside the door, smells the old blood, sees the murdered children of the last generation, describes her own death — and walks in anyway."},
    {k:"Orestes", v:"Son of Agamemnon and Clytemnestra. Ordered by Apollo to avenge his father by killing his mother — the worst crime there is. Damned if he does, damned if he doesn't. The first man in literature caught in an impossible obligation."},
    {k:"Pylades", v:"Silent for two plays, then three lines that decide everything. The most consequential minor part ever written."},
    {ref:"the-furies", here:"They hunt Orestes for his mother's blood, and the third play is their trial. <span class=\"legend\">disputed</span> The famous story that the first audience fainted and pregnant women miscarried comes from a late, unreliable <em>Life of Aeschylus</em> — folklore, but it survives because they looked like the kind of thing it could be true about."},
    {ref:"athena", here:"Born from her father's head, motherless — which is why she sides with fathers. She invents the jury, then casts the deciding vote to acquit the son who killed his mother."},
    {ref:"apollo-god", here:"He ordered the matricide, then argues for Orestes at the trial with the notorious claim that the mother is no true parent, only a vessel for the father's seed."},
    {k:"Iphigenia", v:"Agamemnon and Clytemnestra's daughter, sacrificed by her own father to buy a fair wind for the war — the original crime the whole trilogy answers. Never appears alive; described once, being carried to the altar. The whole trilogy is her invoice."}
  ],
  places:[
    {k:"Argos (the city)", v:"The kingdom of the house of Atreus. Cursed, and has been for three generations."},
    {k:"Aulis", v:"The beach where the fleet sat becalmed and a girl was killed to move it."},
    {ref:"delphi", here:"Where Orestes flees after the murder, and where Apollo — who ordered it — tries to shelter him from the Furies."},
    {k:"The Areopagus", v:"The rock in Athens where the trial is held. A real court, in a live political fight, four years old on the night the play opened."}
  ],
  terms:[
    {k:"pathei mathos", v:"'Wisdom through suffering.' Aeschylus's central claim. Robert Kennedy quoted it, from memory, announcing the death of Martin Luther King to a crowd in Indianapolis."},
    {k:"miasma", v:"Blood pollution. Not guilt — a <em>stain</em>, contagious, physical, sticking to the killer and everything he touches. This is what the Furies are enforcing, and it explains why the play is not about how anybody feels."},
    {k:"the curse of Atreus", v:"Agamemnon's father tricked his brother into eating his own children. Aegisthus, the surviving child, is Clytemnestra's lover and co-conspirator. Nothing in this family is a fresh start."},
    {k:"the Eumenides", v:"'The Kindly Ones.' The new name for the Furies — a euphemism, adopted for the same reason you don't say the true name of something that can find you."}
  ],
  context:`
  <p class="lede">458 BC, Athens at its zenith. Aeschylus had fought the Persians at Marathon — and his epitaph records that, and does not mention a single one of his plays.</p>
  <p><span class="legend">disputed</span> It is usually said he wrote it himself, which would make it the greatest act of self-effacement in literary history. He probably didn't; scholars think a relative composed it after his death. The fact is still remarkable — just not <em>that</em> remarkable.</p>
  <p>The city he was writing for had just done something violent to itself: a radical reform stripped the aristocratic Areopagus of its powers, and Ephialtes, the man who pushed it through, was murdered. Athens was arguing about who gets to judge. Aeschylus put a play on about the day the court was founded, by a god, to end a cycle of killing — and he won first prize.</p>`,
  echoes:[
    {k:"→ Antigone", to:"antigone", v:"The unburied corpse, the woman who defies the state, the law of blood against the law of the city."},
    {k:"→ The Iliad", to:"iliad", v:"Agamemnon's ten years at Troy are the war of the <em>Iliad</em> — and the man who commanded it comes home to die in a bathtub. That is Aeschylus's verdict on Homer's glory."},
    {k:"→ Hamlet", to:"hamlet", v:"A ghost orders a son to avenge a father by killing the man who now sleeps with his mother. Orestes does it in one scene. Hamlet takes five acts, and the difference is the whole of modern literature."},
    {k:"→ Every courtroom drama", v:"Twelve people in a room, deciding. The form was invented here, on stage, before it existed in life."}
  ]
},

"antigone": {
  file:"03.3", title:"Antigone", author:"Sophocles", date:"c. 441 BC",
  form:"Tragedy · one sitting",
  read:"Brief: 4 min",
  spineLabel:"What happens",
  oneline:"A girl throws a handful of dust on her brother's body and is buried alive for it — and the man who kills her is not a villain, which is the whole problem.",
  spine:`
  <p class="lede">Oedipus is dead. His two sons have killed each other fighting over Thebes — one defending it, one attacking it. Creon, their uncle, is now king, and he issues his first decree.</p>
  <p>Eteocles, who defended the city, gets a state funeral. Polyneices, who attacked it, is to be left where he fell: unburied, unmourned, in the open, for the dogs and the birds. Anyone who touches him dies.</p>
  <p>His sister Antigone goes out and buries him. Not with an army, not with a speech — <b>with a handful of dust</b>, scattered over him, which is all the rite requires. The guards find it and brush it off. <b>She comes back and does it again.</b> That is when they catch her.</p>
  <p>Brought before Creon, she does not deny it, does not plead, and does not repent. She tells him his decree is a piece of paper, and that the laws she is obeying are unwritten, eternal, and were not made by him.</p>
  <p>Her sister Ismene, who refused to help, now tries to share the punishment. Antigone will not let her. <em>You chose to live. I chose to die.</em> It is one of the coldest things anyone says in Greek tragedy, and she says it to the only family she has left.</p>
  <p>Creon condemns her to be walled up alive in a cave. His son Haemon — who is engaged to her — argues with him, first as a son, then as a citizen: <em>a city that belongs to one man is not a city.</em> Creon calls him a woman's slave and doubles down.</p>
  <p>Then the blind prophet Tiresias arrives and tells him the gods are choking on the smoke of his altars. Creon accuses him of taking bribes. Tiresias tells him he will pay with his own son, and leaves.</p>
  <p>Creon breaks. He runs to fix it — and he goes to <b>bury the body first</b>. By the time he reaches the cave, Antigone has hanged herself. Haemon spits in his father's face, tries to kill him, misses, and falls on his own sword. Creon's wife hears the news and cuts her own throat, cursing him with her last breath.</p>
  <p>He ends the play alive, holding his son's body, begging to die.</p>`,
  why:`
  <p class="lede">It is the founding text of civil disobedience, and it refuses to give you a villain.</p>
  <p>Hegel's reading is the one that made it immortal: this is <b>not right against wrong. It's right against right.</b> Antigone stands for the family, the dead, the gods, the obligations you did not choose. Creon stands for the city, the living, the law, the order that keeps everyone from being killed by everyone. Both claims are legitimate. Both are absolute. Neither can yield, and so both are destroyed.</p>
  <p>That structure — two goods in a collision that admits no compromise — is the reason the play is still being staged in every country where someone is being told to obey. Jean Anouilh put it on in Nazi-occupied Paris in 1944, and the Resistance saw a heroine while the German censors saw a play about the necessity of order, and <em>they let it run.</em> A text that both sides of an occupation can claim is not ambiguous by accident.</p>`,
  sticky:[
    {h:"The crime is a handful of dust.", p:"She doesn't raise an army or make a speech. She scatters a fistful of dirt over the corpse, which is all the burial rite actually requires, and for this the state buries her alive."},
    {h:"She does it twice.", p:"The guards sweep the dust off. She comes back and does it again — and <em>that</em> is when they catch her. The first time was piety. The second time was defiance, and she knew exactly what she was doing."},
    {h:"Creon is a reasonable man.", p:"That's what makes it a tragedy rather than a melodrama. Polyneices attacked his own city. Refusing him honours is a defensible act of new-regime security policy. If Creon were a monster the play would be worth nothing."},
    {h:"She would not have done it for a husband or a child.", p:"Only for a brother — because with both parents dead, a brother is the one relation that can never be replaced. It is a bizarre, calculating, arithmetic argument to find at the centre of an act of holy defiance, Goethe hated it and wished it were an interpolation, and it is almost certainly hers."},
    {h:"He buries the body first.", p:"Creon finally cracks, and goes to fix everything — and he attends to the <em>corpse</em> before he goes to the living girl in the cave. By the time he gets there she has hanged herself. The most devastating thing in the play is a scheduling error."}
  ],
  idea:`
  <p class="lede">The worst conflicts are not between good and evil. They are between two goods, and no amount of being right will save you.</p>
  <p>The chorus calls Antigone <em class="g">autonomos</em> — a law unto herself. Our word <b>autonomy</b> comes from that line, and note that in the play it is not entirely a compliment.</p>
  <p>Portable version: <b>the hardest decisions of your life will not be between the right thing and the wrong thing. Both options will be defensible, and you will still have to pay for the one you don't take.</b></p>`,
  wrong:[
    {b:"It is not the sequel to Oedipus Rex.", p:"Sophocles wrote it roughly twelve years <em>earlier</em>. He went back and wrote the beginning of the story afterwards. The 'Theban plays' are not a trilogy and were never performed as one."},
    {b:"Antigone is not likeable.", p:"She is cold, absolutist, contemptuous of her sister, and half in love with her own death. Sophocles makes her difficult on purpose. A martyr you find charming is not a test of anything."},
    {b:"It's not 'the individual versus the state.'", p:"That's a nineteenth-century frame. Antigone isn't claiming a personal right — she has no concept of one. She's asserting the claim of the gods and the dead against a decree, and she'd be baffled by the idea that she was expressing herself."},
    {b:"Creon isn't punished for the decree.", p:"He's punished for <b>not backing down</b> — for treating an argument as an attack on his authority, and for insisting he cannot be seen to lose to a girl. The crime is not the policy. It's the pride."}
  ],
  take:`<p>The greatness of the play is that it will not hand you a villain to hate. Both parties are defending something real, both are inflexible, and Sophocles destroys them both. That's why occupiers and resisters have staged it in the same city in the same year and each felt vindicated. It is the most precisely balanced object in Greek literature, and its subject is not justice but the fact that being right is not protective.</p>`,
  counter:`<p>"Right against right" is the comfortable reading — Hegel's — and it has spent two centuries blunting a play about a girl who is simply <em>correct</em>. Look at what Sophocles actually stages: a corpse is being eaten by dogs; the prophet says the gods are gagging on it; the son says the whole city agrees with her and is too frightened to say so; and the play then annihilates Creon's entire family and leaves him alive to sit in it. That is not an even-handed distribution of blame. That is a verdict. "There are two sides to this" is very often what power says when someone disobeys it, and it is worth noticing how comfortable the balanced reading is for everyone who has never had to bury anyone.</p>`,
  people:[
    {ref:"antigone", here:"Buries her outcast brother against the decree, refuses to lie about it, refuses comfort, refuses her own sister, and hangs herself before the state can time her death for it."},
    {ref:"creon", here:"Now the king himself, three days in. Makes a defensible decree, treats a girl's defiance as an attack on his authority, and destroys his whole family refusing to bend. The play's real protagonist, if you count lines."},
    {k:"Ismene", v:"The sister who says no. Ordinary, frightened, and reasonable — which is exactly what Antigone cannot forgive."},
    {k:"Haemon", v:"Creon's son, Antigone's fiancé. Tells his father the truth, is called a woman's slave for it, and dies over her body."},
    {k:"Eteocles &amp; Polyneices", v:"Oedipus's two sons, who agreed to share Thebes by ruling in alternate years — then Eteocles refused to give up the throne, so Polyneices attacked the city, and the brothers killed each other in the same fight. Creon buries Eteocles as a hero and leaves Polyneices to rot as a traitor. That corpse is the entire play."},
    {k:"Eurydice", v:"Creon's wife. Appears for one scene, hears her son is dead, goes inside, and kills herself cursing her husband. Sophocles gives her almost nothing to say, and it is devastating."},
    {ref:"tiresias", here:"The same seer who warned Oedipus, a generation on. Nobody in Thebes ever listens to him in time."},
    {k:"The Sentry", v:"The terrified guard who has to report the crime and spends his entire scene trying not to be executed for the news. The only comedy in the play, and it's the best-observed character in it."}
  ],
  places:[
    {ref:"thebes", here:"Three days after the brothers' war. Exhausted, unstable, and badly in need of the order Creon is about to overreach in imposing."},
    {k:"The plain", v:"Where the body lies in the open, and where the dust is thrown. We never see it."},
    {k:"The cave (Antigone's tomb)", v:"Walled up alive with a little food — so the city can claim it did not shed her blood. The legalism is the point."}
  ],
  terms:[
    {k:"the unwritten laws", v:"<em>agrapta nomima</em>. Antigone's defence: older than any decree, made by no one, binding on everyone. The ancestor of natural law, human rights, and every appeal to a higher authority ever made in a courtroom."},
    {k:"autonomos", v:"'A law unto herself' — what the chorus calls her. The root of <em>autonomy</em>, and in context it is closer to an accusation than a tribute."},
    {k:"deinon", v:"The famous Ode to Man: 'Many things are <em>deinon</em>, and none more <em>deinon</em> than man.' The word means both <b>wonderful and terrible</b> at once, and no translation has ever held both."},
    {k:"philia (kinship)", v:"The same Greek word, used for the bond of blood. Antigone's defiance is a claim of <em>philia</em> — duty to kin and the dead — against the city, not the modern idea of individual conscience against authority."}
  ],
  context:`
  <p class="lede">Around 441 BC, at the height of Periclean Athens — a democracy that was also running an empire and would shortly begin executing the citizens of cities that tried to leave it.</p>
  <p>An old story says Sophocles was elected general on the strength of this play. It is probably not true, but he <em>was</em> elected general, and it tells you that the Athenians did not experience the play as an attack on the state. They experienced it as a play about how difficult it is to run one.</p>`,
  echoes:[
    {k:"→ Oedipus Rex", to:"oedipus-rex", v:"Her father. She inherits the one trait that destroyed him — the absolute refusal to stop — and it kills her too."},
    {k:"→ The Iliad", to:"iliad", v:"Achilles denies Hector burial and drags his body in the dirt, and the whole poem bends toward the moment he gives it back. Antigone is the same crime, prosecuted."},
    {k:"→ The Oresteia", to:"oresteia", v:"A woman against the state, the claim of the dead against the claim of the city. Aeschylus resolves it with a court. Sophocles refuses to resolve it at all."},
    {k:"→ Every resistance movement since", v:"Anouilh in occupied Paris, 1944. Athol Fugard's <em>The Island</em>, staged by political prisoners on Robben Island. Kamila Shamsie's <em>Home Fire</em>, 2017, with a body the British state won't repatriate. The play never stops being current, because the corpse is always somebody's."}
  ]
}

"gilgamesh": {
  file:"00.0", title:"The Epic of Gilgamesh", author:"Anonymous / Sîn-lēqi-unninni", date:"c. 2100–1200 BC",
  form:"Background layer · Mesopotamian epic · clay tablets",
  read:"Brief: 5 min",
  spineLabel:"What happens",
  oneline:"The oldest story we have that still reads as literature — a king who cannot accept that he will die, written down a thousand years before Homer and lost for two thousand years after.",
  spine:`
  <p class="lede">A poem in cuneiform on clay tablets, from Mesopotamia — modern Iraq — older than the Bible, older than Homer, and buried and forgotten until the 1850s.</p>
  <p><b>Gilgamesh</b> is the king of <b>Uruk</b>, two-thirds god and one-third man, and a tyrant — he works his people to exhaustion and takes whatever he wants. The gods answer their complaints by making him an equal: <b>Enkidu</b>, a wild man raised among animals, who has to be civilised first (a woman, <b>Shamhat</b>, is sent to tame him). The two giants fight to a standstill, and then love each other on sight. They become inseparable.</p>
  <p>Together they go looking for glory. They travel to the Cedar Forest and kill its monstrous guardian, <b>Humbaba</b>. They kill the <b>Bull of Heaven</b> after Gilgamesh publicly humiliates the goddess <b>Ishtar</b>. And for killing both, the gods decide one of them has to die — and they take Enkidu, slowly, in bed, of a wasting sickness.</p>
  <p>The second half of the poem is grief. Gilgamesh, who has never feared anything, watches his friend rot — <em>'until a worm fell out of his nose'</em> — and is destroyed by the discovery that this is coming for him too. He abandons his city and walks to the edge of the world to find <b>Utnapishtim</b>, the one man the gods ever made immortal, to demand the secret.</p>
  <p>He does not get it. Utnapishtim tells him immortality was a one-time gift, sets him a simple test — stay awake seven days — and Gilgamesh, exhausted, fails it instantly. He is given one consolation, a plant that restores youth, and a snake eats it while he bathes. He comes home with nothing. The poem ends where it began: with Gilgamesh looking at the walls of Uruk. The wall is the only thing he will leave. <b>That is the answer.</b></p>`,
  why:`
  <p class="lede">Because it is the beginning — and because it quietly demolishes the idea that the West's story starts with Homer.</p>
  <p>Everything that later works spend three thousand years arguing about is already here, fully formed, at the very start: the fear of death, the love between two men that outweighs everything, the refusal to accept mortal limits, and the hard consolation that the only immortality available is the work you leave behind. <b>Achilles and Patroclus are Gilgamesh and Enkidu.</b> Odysseus refusing Calypso's offer of eternal life is answering a question Gilgamesh asked first.</p>
  <p>And then there is the flood. On the eleventh tablet, Utnapishtim explains how he became immortal: the gods sent a <b>Great Flood</b> to wipe out humanity, warned him in secret, and told him to build a boat and fill it with his family and every kind of animal. When the waters fall he sends out a dove, then a swallow, then a raven, to find dry land. This was written down <em>centuries before Genesis</em>. When it was first translated in 1872, it made it very hard to keep reading Noah as history.</p>`,
  sticky:[
    {h:"It is older than everything, and nobody knew it existed.", p:"For roughly two thousand years, the oldest great poem in the world was completely lost — the language dead, the tablets buried under the ruins of Nineveh. It only came back when a self-taught British Museum engraver named George Smith deciphered it in the 1870s. Homer is the beginning of Western literature the way the second act is the beginning of a play you walked into late."},
    {h:"The flood story is older than Noah's.", p:"Utnapishtim builds a boat, saves his family and the animals, rides out a divine flood, and sends out birds to find land — the whole architecture of the Noah story, written centuries earlier. When George Smith read it out in London in 1872, with the Prime Minister in the audience, it detonated. By his coworkers' account he was so overcome he ran round the room and <b>began tearing off his clothes.</b>"},
    {h:"The two heroes are in love, and the poem is honest about it.", p:"Gilgamesh mourns Enkidu 'like a bride,' 'like a widow,' 'like a lioness robbed of her cubs.' Whether it is erotic or the deepest possible friendship has been argued for a century — but the intensity is not in question, and it is the engine of everything. The oldest story we have is about a man broken open by the death of the person he loved."},
    {h:"The only immortality is the wall.", p:"Gilgamesh crosses the whole world to escape death and comes home with nothing — no plant, no secret, no eternity. And the last image of the poem is him showing a stranger the great walls of his city: <em>look what I built.</em> Four thousand years before anyone said 'this too shall pass,' the first epic already knew the answer to death was the thing you make and leave."},
    {h:"An early, unbeatable version of 'eat, drink, and be merry.'", p:"In an older version, a tavern-keeper named Siduri stops the grief-maddened king and tells him the immortality search is pointless — so fill your belly, dance, wash, wear clean clothes, love the child who holds your hand and the wife in your arms. <em>That</em> is the life the gods allow. It is the oldest carpe diem on record, and it is kinder than most of the ones that came after."}
  ],
  idea:`
  <p class="lede">You are going to die, you cannot fix that, and the search for a way out is itself the thing that wastes the life you have.</p>
  <p>Gilgamesh does everything a hero can do — kills the monster, defies the gods, crosses the waters of death, reaches the one immortal man alive — and none of it works, because it cannot work. The poem is brutally clear-eyed: there is no secret, no plant, no reward. There is the city you build, the friend you loved, and the ordinary pleasures a tavern-keeper can list on one hand.</p>
  <p>Portable version: <b>the oldest story in the world is about learning to accept death</b> — and it does not pretend the lesson is comforting.</p>`,
  wrong:[
    {b:"It is not a myth in the vague sense — it is a specific poem.", p:"People use 'Gilgamesh' to mean 'ancient Mesopotamian legend' in general. It is a particular literary work, with an author-editor (the ancient tradition names Sîn-lēqi-unninni), a structure, and an argument — closer to Homer than to a folk tale."},
    {b:"The flood parallel does not mean the Bible 'copied' it.", p:"The honest claim is narrower and more interesting: both draw on a shared Mesopotamian flood tradition that Gilgamesh happens to record earlier. It does not prove plagiarism; it proves the story was already ancient when Genesis reached for it."},
    {b:"It is not incomplete gibberish.", p:"Because it survives on broken tablets, people imagine a heap of fragments. In fact the main narrative is nearly whole and completely coherent — and reads, four thousand years on, like a novel about a mid-life crisis."},
    {b:"Gilgamesh was probably real.", p:"A King Gilgamesh of Uruk appears on the Sumerian King List and was worshipped as a historical ancestor. Like Troy, the legend seems to have a real place and possibly a real man underneath it."}
  ],
  take:`<p>The most striking thing about the oldest story we have is how little the human problem has changed. Strip the gods and the cuneiform and Gilgamesh is a powerful man who is fine until someone he loves dies, and then cannot function, and throws everything away chasing a way out that does not exist, and finally comes home and goes back to work. Four thousand years of literature have refined the telling and added almost nothing to the diagnosis. We were already, at the very beginning, animals who know we will die and cannot stand it.</p>`,
  counter:`<p>The 'look how modern they were' response is mostly a way of congratulating ourselves. The poem is also genuinely alien: its gods are capricious and physical, its morality is not ours, its hero is a rapist-tyrant we are nonetheless asked to grieve with, and its deepest consolations are civic and communal rather than personal. Reading it purely as an early self-help book about accepting mortality is a modern projection — and, notably, the same anti-heroic, cost-counting reading I default to everywhere. It fits here. It is still a lens I bring, not a fact I found.</p>`,
  people:[
    {k:"Gilgamesh", v:"King of Uruk, two-thirds god, one-third man. Begins as a tyrant, is transformed by love and then by grief, and ends as something rarer: a king who has accepted that he is mortal. The first fully drawn character in literature."},
    {k:"Enkidu", v:"The wild man made by the gods to be Gilgamesh's equal and check — raised among animals, civilised by a week with the temple woman Shamhat, then bound to Gilgamesh in a friendship that outweighs the whole world. His death is the hinge of the poem.", to:"iliad"},
    {k:"Shamhat", v:"The temple woman sent to tame Enkidu. Seven days with her, and the animals will no longer accept him — he has become human, which in this poem means: severed from nature, and mortal. Sexuality as the doorway out of the wild and into death."},
    {k:"Utnapishtim", v:"The Mesopotamian Noah — the one man the gods ever granted eternal life, for surviving the Great Flood. Gilgamesh crosses the world to wring the secret out of him and learns there is none: immortality was a single unrepeatable gift.", to:"bible"},
    {k:"Ishtar", v:"Goddess of love and war (later echoed in Aphrodite and Venus). Gilgamesh refuses her advances and lists, to her face, how she destroyed every previous lover. In revenge she looses the Bull of Heaven — and the killing of it costs Enkidu his life."},
    {k:"Humbaba", v:"The monstrous guardian of the Cedar Forest, set there by the gods. Gilgamesh and Enkidu kill him for glory — and it is one of the two killings the gods avenge. He begs for his life first; they do it anyway."},
    {k:"Siduri", v:"The tavern-keeper at the edge of the world who tells the grieving king the truth: the search is hopeless, so eat, drink, dance, and love the people in front of you. The oldest 'seize the day' speech in existence, spoken by a bartender."},
    {k:"Ninsun", v:"Gilgamesh's mother, a goddess — wise and clear-eyed, she interprets his dreams and adopts Enkidu as her son. One of the few figures who understands what is coming."},
    {k:"George Smith", v:"The working-class British Museum engraver, largely self-taught, who deciphered the flood tablet in 1872 and brought the whole epic back after two thousand years. Read it out to a stunned London society — Prime Minister Gladstone in the room — and, by his colleagues' account, was so overcome he started removing his clothes. Dead at 36, in the field, chasing more tablets."}
  ],
  places:[
    {k:"Uruk", v:"Gilgamesh's city, one of the first true cities on earth, in Sumer — southern Iraq. Its great walls open and close the poem, and are its final answer to death: the one immortality a man can actually have is the thing he builds and leaves."},
    {k:"The Cedar Forest", v:"The sacred wilderness, guarded by Humbaba, that Gilgamesh and Enkidu invade for fame and timber. Killing its guardian is the first of the two crimes the gods punish — an early note of conquest and its cost."},
    {k:"The waters of death", v:"The sea at the edge of the world that Gilgamesh must cross to reach Utnapishtim — ferried across by the boatman Urshanabi. The journey no living person is meant to make."},
    {k:"Nineveh", v:"Not in the poem, but where it survived: the ruined library of the Assyrian king Ashurbanipal, whose buried tablets — dug up in the 1850s — preserved the fullest text. The poem outlived its whole civilisation as rubble in a hill."}
  ],
  terms:[
    {k:"cuneiform", v:"The wedge-shaped script, pressed into wet clay with a reed, that Mesopotamia wrote in for three thousand years. The reason the poem survived: clay tablets, unlike papyrus or paper, are baked hard and effectively permanent when a city burns."},
    {k:"the Standard Babylonian version", v:"The fullest text, twelve tablets, edited into its final form around 1200 BC and traditionally credited to the scribe Sîn-lēqi-unninni — one of the earliest named authors in history, if the tradition is right."},
    {k:"the Flood tablet", v:"Tablet XI, on which Utnapishtim tells the flood story — the most famous piece of cuneiform in the world, because it is Noah's ark, older than Noah."}
  ],
  context:`
  <p class="lede">Written across a thousand years, buried for two, and read again only in the last century and a half.</p>
  <p>The oldest pieces are Sumerian poems from around 2100 BC; the unified Akkadian epic came together around 1800 BC; the standard twelve-tablet version was fixed around 1200 BC. Then the civilisations that told it fell, the languages died, and the story vanished so completely that no one knew it had ever existed.</p>
  <p>It came back by accident. Austen Henry Layard and Hormuzd Rassam dug the tablets out of the mound of Nineveh in the 1850s; George Smith deciphered the flood passage in 1872. What we read today is still being reassembled — new fragments turn up in museum drawers and on the antiquities market, and the poem gets a little more complete every few decades. It is the only work here that is <b>still growing.</b></p>`,
  echoes:[
    {k:"→ The Bible", to:"bible", v:"The flood, the ark, the saved family, the birds sent out over the water — all of it here first, centuries before Genesis. Not copied, but drawn from the same ancient Mesopotamian source the Bible later reached for."},
    {k:"→ The Iliad", to:"iliad", v:"Achilles and Patroclus are Gilgamesh and Enkidu: the mightiest warrior alive, undone not by an enemy but by grief for the man he loved, raging against a death he cannot fight."},
    {k:"→ The Odyssey", to:"odyssey", v:"Gilgamesh seeks immortality and fails; Odysseus is offered it by Calypso and refuses. Two answers to the same question, 1,500 years apart — and the later hero has quietly decided a mortal life at home is the better one."},
    {k:"→ Ecclesiastes &amp; every carpe diem", v:"Siduri's speech — eat, drink, love the people in front of you, for the search is hopeless — is the template for three thousand years of 'seize the day,' from Ecclesiastes to Horace to the present."}
  ]
}

"bible": {
  file:"00.1", title:"The Bible", author:"Many hands", date:"c. 900 BC–AD 100",
  form:"Background layer",
  read:"Brief: 6 min",
  spineLabel:"What you actually need",
  oneline:"Augustine, Dante, Milton, Goethe, Melville and Dostoevsky are all extensions of about fifty verses of this. Without it you are reading fan fiction about a story you have never met.",
  spine:`
  <p class="lede">This file exists because several of the works here are not <em>enriched</em> by the Bible — they are <b>unreadable</b> without it. The clearest cases: Milton writes ten thousand lines expanding roughly forty verses of Genesis. Augustine's entire psychology is one sentence of Paul. Dante's Hell is sorted by a scheme that assumes you already know what sin is.</p>
  <p><b>The shape.</b> A world is made and pronounced good. Two people are put in a garden with one prohibition, and they break it, and everything after that is the consequence — work, pain, death, and a permanent sense that something is wrong that wasn't always wrong. That is the <b>Fall</b>, and it is the most load-bearing idea in Western literature.</p>
  <p>Then a family. God makes a deal — a <em class="g">covenant</em> — with Abraham, and then tests him by ordering him to cut his son's throat on a mountain. Abraham gets up early to do it. Then slavery in Egypt, and Moses, and a voice from a burning bush that gives its name as <b>I AM</b>, and a sea that opens, and a law delivered on a mountain in fire. Forty years in a desert, and Moses dies within sight of the land he was promised and never enters it.</p>
  <p>Then kings, and failure, and prophets shouting that the ritual is worthless without justice. Then exile in Babylon, and the great question that follows catastrophe: <em>why do the innocent suffer?</em> — which the Book of <b>Job</b> asks, and God <b>refuses to answer</b>.</p>
  <p><b>Then the reversal.</b> A god becomes a poor man in an occupied province, says that the meek inherit the earth and the last shall be first, is betrayed by a friend, executed as a criminal between two thieves, cries out that he has been abandoned — and, the claim goes, comes back.</p>
  <p>Then Paul, who takes it out of one nation and into the world, and who — writing to Rome — puts down the sentence that Western interior life is built on: <b>the good that I want to do, I do not do; and the evil I do not want, that I do.</b></p>`,
  why:`
  <p class="lede">These works run on two incompatible operating systems, and this is the second one.</p>
  <p>The Greek picture, which you've now read: excellence, glory, honour, the visible world, the beautiful and the strong, and a death you cannot escape or survive. Achilles buys immortal fame with his life because there is nothing else on offer.</p>
  <p>The Hebrew and Christian picture inverts nearly every term. The <b>weak</b> are favoured. The <b>slave</b> is the protagonist. God is invisible and cannot be depicted. The interior — what you <em>want</em>, in secret — matters more than what you achieve. And the central figure of the entire structure is a tortured provincial criminal, which is roughly the least heroic thing a Greek could imagine.</p>
  <p><b>Almost everything after Augustine is a negotiation between these two.</b> Augustine is a Platonist who converted. Dante is Aristotle plus Christ. Milton is Virgil plus Genesis. Dostoevsky is Job. Melville is Job with a harpoon. Once you can see the seam, you can see it everywhere — and that seam is the most useful thing in this entire app.</p>`,
  sticky:[
    {h:"There is no apple, and there is no Satan.", p:"Genesis says a serpent — 'more crafty than any beast of the field.' It does not name the fruit, and it does not say the serpent is the devil. The apple is a Latin pun (<em>malum</em> = both 'evil' and 'apple'). The identification with Satan comes centuries later. The most famous story in the West is mostly things that were added."},
    {h:"Satan is a job title.", p:"In Job, <em>ha-satan</em> means 'the accuser' — a prosecutor in God's court, on the payroll, doing his job with permission. He is not a rebel and he is not in Hell. The magnificent fallen Lucifer of the Western imagination is assembled later, out of scraps, and gets his final and definitive form from <b>Milton</b>, who did not retell Satan's story so much as invent it."},
    {h:"God takes a bet, and Job loses everything.", p:"The wager is the setup: Job is destroyed to settle an argument. He demands an explanation. God finally arrives in a whirlwind — and asks Job a hundred questions about stars and hippos and where he was when the world was made, and <b>never answers the one Job asked.</b> That refusal is the most unflinching thing in religious literature. It is also the open wound in <em>Moby-Dick</em> and <em>The Brothers Karamazov</em>."},
    {h:"Abraham gets up early to kill his son.", p:"He is told to butcher Isaac on a mountain, and he does not argue, and he does not delay. He saddles the donkey at dawn. Isaac carries the wood for his own fire and asks where the lamb is. Nothing is ever explained — and note that Agamemnon does exactly this to Iphigenia, and there, no one stops him."},
    {h:"'The good I want to do, I don't do.'", p:"Paul, writing to Rome. One sentence, and the divided self begins: the person who watches himself fail, wanting two things at once. Augustine expands it into 300 pages. Dostoevsky expands it into a religion. Every confessional narrative you have ever encountered is downstream of that verse."}
  ],
  idea:`
  <p class="lede">Athens and Jerusalem. The whole canon is the argument between them.</p>
  <p>Greek: <b>be excellent</b>, be seen to be excellent, and die. Hebrew/Christian: <b>be forgiven</b> — which requires there to be something wrong with you that effort cannot fix.</p>
  <p>That second premise is what Aristotle does not have and cannot accommodate. Aristotle says: character is built by repetition, so practise. Augustine says: <b>the machine is broken and practice will not repair it.</b> That argument — <em>can you fix yourself, or do you need to be rescued?</em> — runs directly through Aristotle, Augustine, Dante, Milton, Goethe, Melville and Dostoevsky — and not one of them declines to take a side.</p>`,
  wrong:[
    {b:"It isn't a book.", p:"It's a library — 66 to 81 books depending on whose canon, written over a millennium, in three languages, by many hands, in genres that don't agree with each other: law, chronicle, erotic poetry, philosophy, apocalypse, letters. Treating it as one author with one view is the commonest misreading."},
    {b:"The seven deadly sins are not in it.", p:"Nor is Lucifer-as-Satan's-name (that comes from a taunt aimed at a Babylonian king), nor Purgatory, nor the fall of the rebel angels as a narrative. Nearly all the furniture of 'Christian imagination' is later architecture — much of it Dante's and Milton's."},
    {b:"'Money is the root of all evil' is a misquote.", p:"The <em>love</em> of money. And 'immaculate conception' does not mean the virgin birth — it's a nineteenth-century doctrine about Mary's own conception. Both mistakes will identify you instantly."},
    {b:"The majestic English is a translation effect.", p:"The King James Version (1611) was deliberately archaic even when it was printed. The sonorous grandeur everyone thinks of as biblical is Jacobean English — and it is the version Milton, Melville, Lincoln, and every writer in English has in their ear. The literary event is the <em>translation</em>."}
  ],
  take:`<p>The useful move is to treat it the way one treats Greek myth: as a substrate. A shared library of plots, images, and vocabulary that everything downstream assumes you already have. You do not need to believe in Zeus to read the <em>Iliad</em>, and you do not need to believe in the Resurrection to read <em>Paradise Lost</em>. Read it for the furniture.</p>`,
  counter:`<p>But be honest about what that costs, because it is exactly the move that will mislead you. Augustine, Dante, and Milton did not think they were working with <em>material</em>. They thought they were working with <b>the truth</b>, and every ounce of pressure in what they wrote comes from that. Reading Dante as a magnificent imaginative construction is like reading a man's sworn testimony as a novel — you will get the shape and miss the terror. The literary reading is a modern convenience. It makes these works feel like inventions, when they were made as <em>reports</em>. Keep the convenience; just don't mistake it for the thing.</p>`,
  people:[
    {k:"Adam and Eve", v:"The Fall. Not, in the text, a story about sex or about an apple — a story about a prohibition, a persuasion, and the discovery of shame."},
    {k:"Abraham", v:"The covenant, and the knife. Kierkegaard wrote a whole book unable to get past him."},
    {k:"Moses", v:"Burning bush, plagues, sea, law. Dies looking at the promised land from a mountain, and is not allowed in."},
    {k:"Job", v:"Loses everything on a bet, refuses to curse God, refuses equally to say he deserved it, and demands an answer. Gets a whirlwind instead."},
    {k:"Noah", v:"The man God chooses to survive the Flood — building the ark, saving two of every creature while the world drowns. The first covenant, sealed with a rainbow: God promises never to destroy the world by water again."},
    {k:"Cain and Abel", v:"Adam and Eve's sons, and the first murder — Cain kills his brother out of jealousy when God prefers Abel's offering. 'Am I my brother's keeper?' is his answer when God asks where Abel is. Human history in the Bible begins with fratricide."},
    {k:"David", v:"King, poet, adulterer, murderer, and the voice of the Psalms — which is the voice Augustine writes in."},
    {k:"Jesus", v:"Teaches in stories, inverts every value on offer, is executed as a criminal, and on the cross cries that he has been abandoned. That cry is why the story is difficult and why it is durable."},
    {k:"Judas", v:"The friend who sells him. Dante puts him in the lowest mouth of Satan, chewed for eternity, alongside Brutus and Cassius."},
    {k:"Isaac &amp; the binding", v:"Abraham's son, whom God commands him to sacrifice as a test — then stops his hand at the last moment. The <em>Akedah</em>, the 'binding of Isaac,' is the knife-edge story of faith and obedience that haunts Kierkegaard, and shadows every father-and-son story in the corpus."},
    {k:"Paul", v:"Persecutor turned apostle. Invents theology, invents the introspective conscience, and writes the sentence Augustine builds a self out of."},
    {k:"'The satan'", v:"In the Hebrew Bible, an office, not a person: the adversary, the prosecutor. Everything else about him was added by poets."}
  ],
  places:[
    {ref:"eden", here:"The garden, and the gate closed behind. The Bible's last word on it is a locked door; Milton's is two people walking away from it together."},
    {k:"Sinai", v:"The mountain, the fire, the law. God dictates, and the people below build a golden calf while they wait."},
    {k:"The Garden of Eden", v:"See Eden — the first paradise, and the gate closed behind."},
    {k:"Jerusalem", v:"The holy city, site of Solomon's Temple and of the Crucifixion — the geographic and spiritual centre of the whole book, fought over, destroyed, rebuilt, and made the symbol of the promised end."},
    {k:"Babylon", v:"Exile. Where the question 'why has this happened to us?' becomes urgent enough to produce Job and half the prophets."},
    {k:"Gethsemane", v:"The garden the night before. He asks to be let off. He isn't."},
    {k:"Golgotha", v:"The execution. 'The place of the skull.'"}
  ],
  terms:[
    {k:"covenant", v:"A contract between God and a people. 'Testament' means the same thing — Old and New Covenant."},
    {k:"the Fall", v:"The event that explains why the world is not as it should be. Everything downstream needs it: without a Fall, Dante has nothing to punish and Milton has nothing to justify."},
    {k:"original sin", v:"The claim that the defect is inherited, structural, and prior to any choice you made. Largely <b>Augustine's</b> construction — and the most consequential idea he ever had."},
    {ref:"grace", here:"The direct contradiction of Aristotle: not self-built virtue but unearned rescue. Augustine's whole conversion turns on receiving it rather than achieving it."},
    {k:"Logos (the Word)", v:"'In the beginning was the Word.' John opens by welding Genesis to Greek philosophy in a single line, and the whole later fusion of Athens and Jerusalem is prefigured in it."},
    {k:"the Vulgate", v:"Jerome's Latin Bible, c. 405. <em>This</em> is the Bible Dante read and Augustine preached. Not Hebrew, not Greek, not English."},
    {k:"apocalypse", v:"Means 'unveiling,' not 'catastrophe.' The catastrophe is what happens to be under the veil."}
  ],
  context:`
  <p class="lede">Assembled, not written. Argued over, edited, translated, and canonised across more than a thousand years.</p>
  <p>The crucial fact is which <em>version</em> each author was hearing. Augustine and Dante had the Latin Vulgate. Milton had Hebrew, Greek, Latin, and the King James. Dostoevsky had Church Slavonic and Russian. Melville had the King James, and you can hear it in every sentence he writes — 'Call me Ishmael' is a name lifted from Genesis, and it means <b>the outcast son</b>, and Melville expects you to know that before the second sentence.</p>`,
  echoes:[
    {k:"→ The Epic of Gilgamesh", to:"gilgamesh", v:"The flood, the ark, the saved family, and the birds sent out over the water — all there centuries before Genesis. The Bible reaching for a story that was already ancient."},
    {k:"→ Confessions", to:"confessions", v:"Paul's divided will, expanded into the first autobiography."},
    {k:"→ Dante", to:"dante", v:"The frame, the furniture, and the destination — with Aristotle's ethics doing the filing."},
    {k:"→ Paradise Lost", to:"paradise-lost", v:"Genesis, chapters 1–3, at ten thousand lines. And the invention of the Satan everyone thinks they already knew."},
    {k:"→ Faust", to:"faust", v:"Goethe opens with a <b>Prologue in Heaven</b> in which God and Mephistopheles make a bet about a man — which is the opening of Job, transposed note for note."},
    {k:"→ Moby-Dick", to:"moby-dick", v:"Ishmael, Ahab, Leviathan, and the whirlwind that never answers. Melville read Job and wrote the reply."},
    {k:"→ The Brothers Karamazov", to:"karamazov", v:"Job read aloud, the problem of suffering children, and a Christ who says nothing at all."}
